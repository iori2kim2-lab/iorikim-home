<main class="app"><h1 class="title">SKY MEADOW</h1><p class="sub">클릭 · 터치 · 스페이스로 새를 날리세요</p><section class="game" id="g"><div class="world"></div><div class="hud" id="score">0</div><div class="bird" id="bird"></div><div class="tip" id="tip"><div class="card"><h2>구름 위로 날아볼까요?</h2><p>장애물 사이를 통과하면 점수가 올라가요.</p><button class="btn" id="start">날기 시작 ✨</button></div></div></section><aside class=records><h2>🏆 비행 기록</h2><div id=list></div><input id=name maxlength=8 placeholder="이름 입력"><button class=btn id=save>기록 저장</button></aside></main><script>
const g=document.querySelector('#g'),bird=document.querySelector('#bird'),score=document.querySelector('#score'),tip=document.querySelector('#tip');let y,v,run,pipes,n,frame,AC;const ding=(f,d=.09)=>{try{AC??=new AudioContext;let o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};const esc=s=>{let d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};const drawScores=()=>{let a=JSON.parse(localStorage.skyScores||'[]');list.innerHTML=a.map((x,i)=>'<p>'+(i+1)+'. '+esc(x.n)+' <b>'+x.s+'</b></p>').join('')||'<p>아직 기록이 없어요</p>'};function flap(){if(run){v=-7.1;ding(440)}}function start(){g.querySelectorAll('.pipe,.plus').forEach(e=>e.remove());document.querySelector('.world').style.animationPlayState='running';tip.remove();y=g.clientHeight*.42;v=0;run=true;pipes=[];n=0;frame=0;score.textContent=0;loop()}function add(){let gap=155+Math.random()*20,top=80+Math.random()*(g.clientHeight-gap-190),x=g.clientWidth+30,a=document.createElement('i'),b=document.createElement('i');a.className='pipe top';b.className='pipe bottom';a.style.cssText=`left:${x}px;top:0;height:${top}px`;b.style.cssText=`left:${x}px;top:${top+gap}px;height:${g.clientHeight-top-gap}px`;g.append(a,b);pipes.push({x,top,gap,a,b,got:false})}function end(){run=false;document.querySelector('.world').style.animationPlayState='paused';ding(120,.25);let o=document.createElement('div');o.className='over';o.innerHTML=`<div class=card><h2>비행 종료!</h2><p>이번 기록은 ${n}점이에요.</p><button class=btn>다시 날기</button></div>`;g.append(o);o.querySelector('button').onclick=()=>{o.remove();start()}}function loop(){if(!run)return;v+=.38;y+=v;bird.style.top=y+'px';bird.style.transform=`rotate(${Math.min(28,Math.max(-25,v*4))}deg)`;if(y<0||y>g.clientHeight-48)return end();if(++frame%105===0)add();pipes=pipes.filter(p=>{p.x-=2.7;p.a.style.left=p.b.style.left=p.x+'px';if(!p.got&&p.x<88){p.got=true;n++;ding(760);score.textContent=n;let q=document.createElement('b');q.className='plus';q.textContent='+1';q.style.cssText=`left:105px;top:${y}px`;g.append(q);setTimeout(()=>q.remove(),650)}if(p.x<135&&p.x+78>88&&(y<p.top||y+45>p.top+p.gap))end();if(p.x<-85){p.a.remove();p.b.remove();return false}return true});requestAnimationFrame(loop)}g.onclick=flap;document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}});document.querySelector('#start').onclick=start;save.onclick=()=>{let a=JSON.parse(localStorage.skyScores||'[]');a.push({n:name.value||'새',s:n});a.sort((x,y)=>y.s-x.s);localStorage.skyScores=JSON.stringify(a.slice(0,5));drawScores()};drawScores();

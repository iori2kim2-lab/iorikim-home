    { name: "성운 지대",   a: "#241a52", b: "#150e34", c: "#07051a", cloud: "#000000", cloudA: 0, star: 1,
      deco: "#7b5cff", deco2: "#ff6ae8" },
    { name: "심우주",      a: "#0c0c28", b: "#070718", c: "#02020a", cloud: "#000000", cloudA: 0, star: 1,
      deco: "#3a5cff", deco2: "#6affe0" },
    { name: "붉은 성운",   a: "#33122e", b: "#1c0a1e", c: "#07030d", cloud: "#000000", cloudA: 0, star: 1,
      deco: "#ff4d6a", deco2: "#ffb03a" },
    { name: "은하 가장자리", a: "#0d2a3f", b: "#071726", c: "#020a12", cloud: "#000000", cloudA: 0, star: 1,
      deco: "#3ad0ff", deco2: "#a0ffe8" }
  ]}
];
/* 팔레트를 한 줄로 펴 두고 "전체 인덱스" 하나로 크로스페이드한다 */
const FLAT_SKIES = [];
BIOMES.forEach((b, bi) => b.palettes.forEach(p => FLAT_SKIES.push(
  Object.assign({ biome: bi, biomeCloudA: b.cloudA }, p))));

function skyIndex(st) {
  const bi = biomeIndex(st);
  const slot = Math.floor((st - BIOME_START[bi]) / 5) % 4;   // 바이옴마다 아침부터 다시
  return bi * 4 + slot;
}

const nightStars = [];
for (let i = 0; i < 70; i++)
  nightStars.push({ x: rand(0, CW), y: rand(0, CH), r: rand(0.6, 2), ph: rand(0, TAU), sp: rand(1.4, 3.4) });
/* 우주에서만 쓰는 빠른 시차(parallax) 별 — 앞쪽에서 빠르게 흐른다 */
const fastStars = [];
for (let i = 0; i < 40; i++)
  fastStars.push({ x: rand(0, CW), y: rand(0, CH), r: rand(0.8, 2.4), sp: rand(60, 150) });

/* 숲 : 앞뒤 두 겹으로 흐르는 나무 덩어리 */
const forestBits = [];
for (let i = 0; i < 54; i++)
  forestBits.push({ x: rand(-30, CW + 30), y: rand(-CH, CH), s: rand(13, 27),
                    far: i % 3 === 0, ph: rand(0, TAU) });
/* 바다 : 아래로 흘러가는 파도 마루 */
const waveBits = [];
for (let i = 0; i < 26; i++)
  waveBits.push({ x: rand(0, CW), y: rand(-CH, CH), w: rand(24, 74), ph: rand(0, TAU), far: i % 2 === 0 });

function hex2rgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}
function mixHex(h1, h2, k) {
  const a = hex2rgb(h1), b = hex2rgb(h2);
  return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * k) + "," +
                  Math.round(a[1] + (b[1] - a[1]) * k) + "," +
                  Math.round(a[2] + (b[2] - a[2]) * k) + ")";
}

let skyFrom = 0, skyTo = 0, skyMix = 1;
let bgScroll = 0;                                  // 지형 스크롤 누적치
function currentSky(dt) {
  const want = skyIndex(Game.stage);
  if (want !== skyTo) { skyFrom = skyTo; skyTo = want; skyMix = 0; }
  if (skyMix < 1) skyMix = Math.min(1, skyMix + dt / 1.4);
  const A = FLAT_SKIES[skyFrom], B = FLAT_SKIES[skyTo], k = skyMix;
  return {
    a: mixHex(A.a, B.a, k), b: mixHex(A.b, B.b, k), c: mixHex(A.c, B.c, k),
    cloud: mixHex(A.cloud, B.cloud, k),
    cloudA: A.cloudA + (B.cloudA - A.cloudA) * k,
    star: A.star + (B.star - A.star) * k,
    name: FLAT_SKIES[skyTo].name,
    from: A, to: B, k
  };
}
/* 현재 화면에 보이는 바이옴 이름 (배너용) */
function currentBiomeName() { return ["하늘", "숲", "바닷가", "우주"][FLAT_SKIES[skyTo].biome]; }

/* ── 숲 : 강 + 나무 캔버스 ──────────────────────────────────────────── */
function riverX(y) {                                // 굽이치는 강의 중심선
  const t = y + bgScroll;
  return CW * 0.5 + Math.sin(t * 0.0052) * 118 + Math.sin(t * 0.0131 + 1.3) * 34;
}
function drawForest(pal, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  ctx.fillStyle = pal.river;                        // 강 (뒤쪽 레이어)
  ctx.globalAlpha = alpha * 0.75;
  ctx.beginPath();
  for (let y = -20; y <= CH + 20; y += 20) {
    const x = riverX(y) - 26 - Math.sin((y + bgScroll) * 0.01) * 8;
    y === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  for (let y = CH + 20; y >= -20; y -= 20) {
    const x = riverX(y) + 26 + Math.sin((y + bgScroll) * 0.01) * 8;
    ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha = alpha;
  for (const b of forestBits) {                     // 나무 덩어리
    const s = b.far ? b.s * 0.62 : b.s;
    const rx = riverX(b.y);
    if (Math.abs(b.x - rx) < 40) continue;          // 강 위에는 나무가 없다
    ctx.fillStyle = b.far ? pal.deco2 : pal.deco;
    ctx.globalAlpha = alpha * (b.far ? 0.75 : 1);
    ctx.beginPath();
    ctx.arc(b.x, b.y, s * 0.72, 0, TAU);
    ctx.arc(b.x + s * 0.62, b.y + s * 0.24, s * 0.56, 0, TAU);
    ctx.arc(b.x - s * 0.55, b.y + s * 0.3, s * 0.52, 0, TAU);
    ctx.arc(b.x + s * 0.05, b.y - s * 0.55, s * 0.5, 0, TAU);
    ctx.fill();
    if (!b.far) {                                   // 햇빛 받는 윗면
      ctx.globalAlpha = alpha * 0.28;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(b.x - s * 0.18, b.y - s * 0.42, s * 0.34, 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
}

/* ── 바닷가 : 파도 + 오른쪽 모래사장 ────────────────────────────────── */
function shoreX(y) {                                // 해안선 (오른쪽에서 굽이친다)
  const t = y + bgScroll * 0.9;
  return CW - 96 + Math.sin(t * 0.0061) * 46 + Math.sin(t * 0.0143 + 0.7) * 16;
}
function drawSea(pal, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;

  for (const w of waveBits) {                       // 흰 파도 마루
    ctx.globalAlpha = alpha * (w.far ? 0.28 : 0.5);
    ctx.strokeStyle = pal.deco;
    ctx.lineWidth = w.far ? 1.6 : 2.6;
    ctx.lineCap = "round";
    ctx.beginPath();
    const half = w.w * (w.far ? 0.6 : 1);
    for (let i = 0; i <= 8; i++) {
      const px = w.x - half + (2 * half) * (i / 8);
      const py = w.y + Math.sin(i * 0.9 + w.ph + Game.timer * 2.2) * 3;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
  }

  ctx.globalAlpha = alpha;                          // 모래사장
  ctx.fillStyle = pal.sand;
  ctx.beginPath();
  ctx.moveTo(CW + 10, -20);
  for (let y = -20; y <= CH + 20; y += 16) ctx.lineTo(shoreX(y), y);
  ctx.lineTo(CW + 10, CH + 20);
  ctx.closePath(); ctx.fill();

  ctx.globalAlpha = alpha * 0.85;                   // 밀려드는 포말
  ctx.strokeStyle = pal.deco; ctx.lineWidth = 3.2;
  ctx.beginPath();
  for (let y = -20; y <= CH + 20; y += 16) {
    const x = shoreX(y) - 5 - Math.abs(Math.sin(y * 0.05 + Game.timer * 1.6)) * 5;
    y === -20 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

/* ── 우주 : 성운 + 빠른 별 ──────────────────────────────────────────── */
function drawSpace(pal, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  const t = Game.timer;
  const nebs = [                                    // 아주 느리게 흐르는 성운 세 덩이
    { x: CW * 0.22 + Math.sin(t * 0.05) * 18, y: 180, r: 200, c: pal.deco,  a: 0.20 },
    { x: CW * 0.85 + Math.sin(t * 0.037 + 2) * 22, y: 520, r: 240, c: pal.deco2, a: 0.17 },
    { x: CW * 0.5 + Math.sin(t * 0.028 + 4) * 26, y: 760, r: 190, c: pal.deco,  a: 0.13 }
  ];
  for (const n of nebs) {
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    g.addColorStop(0, n.c); g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = alpha * n.a;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = alpha * 0.9;
  ctx.fillStyle = "#ffffff";
  for (const s of fastStars) {                      // 앞쪽에서 빠르게 흐르는 별
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ── 지구 레이어 ────────────────────────────────────────────────────────
 * 배경(성운·별) 위, 게임 오브젝트 아래에 놓이는 독립 레이어.
 * 아주 멀리 떠 있는 것처럼 화면을 옆으로 천천히 가로지른다. */
const Earth = { x: CW * 0.72, y: 250, r: 76, vx: -7.5, on: 0 };
/* 대륙 실루엣 — 단위원 좌표로 고정해 두어 모양이 매 프레임 흔들리지 않는다 */
const EARTH_LAND = [
  [[-0.66,-0.40],[-0.48,-0.60],[-0.22,-0.58],[-0.04,-0.38],[-0.10,-0.18],[-0.26,-0.04],
   [-0.46,-0.02],[-0.60,-0.14],[-0.72,-0.26]],
  [[-0.34,0.12],[-0.12,0.04],[0.06,0.20],[0.04,0.42],[-0.08,0.64],[-0.24,0.70],
   [-0.32,0.52],[-0.40,0.32]],
  [[0.16,-0.58],[0.40,-0.68],[0.64,-0.52],[0.76,-0.28],[0.62,-0.10],[0.40,-0.06],
   [0.24,-0.20],[0.12,-0.40]],
  [[0.32,0.18],[0.54,0.10],[0.72,0.22],[0.74,0.44],[0.58,0.58],[0.40,0.50],[0.30,0.34]]
];
/* 꼭짓점 사이를 지나는 부드러운 곡선 — 각진 다각형이 아니라 해안선처럼 보이게 */
function blobPath(cx, cy, R, poly, k) {
  const n = poly.length, sc = k === undefined ? 1 : k;
  const px = i => cx + poly[((i % n) + n) % n][0] * R * sc;
  const py = i => cy + poly[((i % n) + n) % n][1] * R * sc;
  ctx.beginPath();
  ctx.moveTo((px(0) + px(1)) / 2, (py(0) + py(1)) / 2);
  for (let i = 1; i <= n; i++)
    ctx.quadraticCurveTo(px(i), py(i), (px(i) + px(i + 1)) / 2, (py(i) + py(i + 1)) / 2);
  ctx.closePath();
}
function updateEarth(dt, visible) {
  Earth.on += ((visible ? 1 : 0) - Earth.on) * Math.min(1, dt * 1.2);   // 등·퇴장 페이드
  Earth.x += Earth.vx * dt;
  Earth.y = 190 + Math.sin(Game.timer * 0.06) * 26;
  if (Earth.x < -Earth.r - 90) Earth.x = CW + Earth.r + 90;             // 반대편에서 다시 등장
}
function drawEarth() {
  if (Earth.on < 0.01) return;
  const R = Earth.r, x = Earth.x, y = Earth.y;
  ctx.save();
  ctx.globalAlpha = Earth.on;

  const glow = ctx.createRadialGradient(x, y, R * 0.9, x, y, R * 1.5);  // 대기광
  glow.addColorStop(0, "rgba(120,200,255,.42)");
  glow.addColorStop(1, "rgba(120,200,255,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, TAU); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.clip();

  const sea = ctx.createRadialGradient(x - R * 0.35, y - R * 0.38, R * 0.15, x, y, R * 1.15);
  sea.addColorStop(0, "#6fc8ff"); sea.addColorStop(0.55, "#1f6fc4"); sea.addColorStop(1, "#0a2d5e");
  ctx.fillStyle = sea;
  ctx.fillRect(x - R, y - R, R * 2, R * 2);

  for (const poly of EARTH_LAND) {                                      // 대륙
    ctx.fillStyle = "#4a9a58";
    blobPath(x, y, R, poly); ctx.fill();
    ctx.globalAlpha = Earth.on * 0.45;                                  // 안쪽으로 한 겹 밝게
    ctx.fillStyle = "#7cc478";
    blobPath(x - R * 0.03, y - R * 0.05, R, poly, 0.82); ctx.fill();
    ctx.globalAlpha = Earth.on;
  }

  ctx.save();                                                           // 천천히 흐르는 흰 구름띠
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "rgba(255,255,255,.7)"; ctx.shadowBlur = R * 0.1;
  for (let i = 0; i < 6; i++) {
    const span = R * 3.0;
    const dx = ((Game.timer * 4 + i * 97) % span) - span / 2;
    const yy = y - R * 0.72 + i * R * 0.29;
    ctx.globalAlpha = Earth.on * 0.42;
    ctx.beginPath();
    ctx.ellipse(x + dx, yy, R * (0.30 + (i % 3) * 0.09), R * 0.055, 0.06, 0, TAU);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = Earth.on;

  const term = ctx.createLinearGradient(x - R, y - R, x + R, y + R);    // 명암 경계
  term.addColorStop(0, "rgba(0,0,0,0)");
  term.addColorStop(0.42, "rgba(0,0,0,0)");
  term.addColorStop(1, "rgba(2,6,20,.92)");
  ctx.globalAlpha = Earth.on;
  ctx.fillStyle = term;
  ctx.fillRect(x - R, y - R, R * 2, R * 2);
  ctx.restore();

  ctx.globalAlpha = Earth.on * 0.5;                                     // 가장자리 하이라이트
  ctx.strokeStyle = "#bfe6ff"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(x, y, R, -2.5, -0.5); ctx.stroke();
  ctx.restore();
}

/* ── 바이옴 장식 한 겹 그리기 ──────────────────────────────────────── */
function drawBiomeDeco(bi, pal, alpha) {
  if (alpha <= 0.01) return;
  if (bi === 1) drawForest(pal, alpha);
  else if (bi === 2) drawSea(pal, alpha);
  else if (bi === 3) drawSpace(pal, alpha);
}

function drawSky(dt) {
  const sky = currentSky(dt);
  const boost = Game.state === "playing" ? 1 : 0.45;
  bgScroll += 120 * boost * dt;                     // 지형 스크롤

  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, sky.a); g.addColorStop(0.45, sky.b); g.addColorStop(1, sky.c);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);

  if (sky.star > 0.02) {                            // 밤·우주의 별
    for (const st of nightStars) {
      ctx.globalAlpha = sky.star * (0.35 + Math.abs(Math.sin(Game.timer * st.sp + st.ph)) * 0.65);
      ctx.fillStyle = "#fff6e0";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* 지형 요소들의 위치를 프레임당 한 번만 전진시킨다 (두 겹으로 그려도 안전) */
  for (const b of forestBits) {
    b.y += (b.far ? 42 : 96) * boost * dt;
    if (b.y - b.s > CH + 20) { b.y = -b.s - rand(10, 90); b.x = rand(-30, CW + 30); }
  }
  for (const w of waveBits) {
    w.y += (w.far ? 40 : 88) * boost * dt;
    if (w.y > CH + 10) { w.y = -10; w.x = rand(0, CW); }
  }
  for (const s of fastStars) {
    s.y += s.sp * boost * dt;
    if (s.y > CH + 4) { s.y = -4; s.x = rand(0, CW); }
  }

  /* 바이옴이 바뀌는 순간에는 이전 지형과 새 지형을 겹쳐 페이드한다 */
  const A = FLAT_SKIES[skyFrom], B = FLAT_SKIES[skyTo];
  if (A.biome === B.biome) drawBiomeDeco(B.biome, B, 1);
  else { drawBiomeDeco(A.biome, A, 1 - sky.k); drawBiomeDeco(B.biome, B, sky.k); }

  /* 지구 레이어 — 우주 바이옴에서만 서서히 나타난다 */
  updateEarth(dt, B.biome === 3);
  drawEarth();

  for (const s of sparks) {                         // 속도감을 주는 흐름선
    s.y += s.sp * boost * dt;
    if (s.y > CH + 6) { s.y = -6; s.x = rand(0, CW); }
    ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = s.r;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y - 12 * boost); ctx.stroke();
  }

  const cloudMul = A.biomeCloudA + (B.biomeCloudA - A.biomeCloudA) * sky.k;
  if (cloudMul > 0.02) {
    for (const c of clouds) {                       // 위로 지나가는 구름
      c.y += c.sp * boost * dt;
      if (c.y - c.s > CH) { c.y = -c.s * 1.6; c.x = rand(0, CW); c.s = rand(26, 62); }
      ctx.globalAlpha = c.a * 0.9 * sky.cloudA * cloudMul;
      ctx.fillStyle = sky.cloud;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.s * 0.6, 0, TAU);
      ctx.arc(c.x + c.s * 0.6, c.y - c.s * 0.2, c.s * 0.46, 0, TAU);
      ctx.arc(c.x + c.s * 1.15, c.y + c.s * 0.05, c.s * 0.54, 0, TAU);
      ctx.arc(c.x + c.s * 0.55, c.y + c.s * 0.3, c.s * 0.48, 0, TAU);
      ctx.fill();
    }
  } else {
    for (const c of clouds) {                       // 우주에서도 위치는 계속 흘려 둔다
      c.y += c.sp * boost * dt;
      if (c.y - c.s > CH) { c.y = -c.s * 1.6; c.x = rand(0, CW); c.s = rand(26, 62); }
    }
  }
  ctx.globalAlpha = 1;
}

/* ── 펫 그리기 (선택 카드와 인게임 공용) ──────────────────────────────── */
/* ── 우주복 헬멧 ────────────────────────────────────────────────────────
 * 90스테이지(우주 구간)부터 펫이 쓰고 나온다.
 * 유리는 반투명이라 안의 귀·수염·코가 그대로 비쳐 고양이/강아지 구분이 유지된다.
 * (헬멧을 불투명하게 칠하면 둘이 똑같아 보여서 안 된다) */
function drawHelmet(pet) {
  const R = 33;
  ctx.save();
  ctx.translate(0, -3);

  ctx.fillStyle = "rgba(255,255,255,.95)";              // 목 고리(칼라)
  ctx.strokeStyle = "#9fb0c9"; ctx.lineWidth = 2;
  rrect(ctx, -23, 17, 46, 10, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = pet.key === "cat" ? "#ff8fbc" : "#ffb03a";   // 펫 색 띠
  rrect(ctx, -19, 19.5, 38, 4, 2); ctx.fill();

  for (const s of [-1, 1]) {                            // 좌우 산소 결합구
    ctx.fillStyle = "#cfd8e8"; ctx.strokeStyle = "#8494ad"; ctx.lineWidth = 1.6;
    rrect(ctx, s * 28 - 4, -6, 8, 13, 3); ctx.fill(); ctx.stroke();
  }

  ctx.strokeStyle = "#9fb0c9"; ctx.lineWidth = 2;       // 정수리 안테나
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(11, -R + 4); ctx.lineTo(18, -R - 7); ctx.stroke();
  ctx.fillStyle = "#ff5c72";
  ctx.shadowColor = "#ff5c72"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(18, -R - 8, 3, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0;

  const glass = ctx.createRadialGradient(-11, -13, 3, 0, 0, R);   // 유리 돔
  glass.addColorStop(0, "rgba(255,255,255,.36)");
  glass.addColorStop(0.55, "rgba(175,225,255,.16)");
  glass.addColorStop(1, "rgba(120,190,235,.3)");
  ctx.fillStyle = glass;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 3.4; // 테두리
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(150,200,235,.9)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, 0, R - 3.2, 0, TAU); ctx.stroke();

  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 4;   // 반사 광택
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(0, 0, R - 8, Math.PI * 1.08, Math.PI * 1.42); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R - 15, Math.PI * 1.12, Math.PI * 1.3); ctx.stroke();
  ctx.restore();
}

function drawPet(pet, x, y, scale, flap, tilt, flying, mood, space) {
  const s = scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt || 0);
  ctx.scale(s, s);

  if (flying) {
    /* 제트 불꽃 — 넓은 삼각형 하나로 그리면 "콘"처럼 보인다.
     * 바깥(주황)과 안쪽(노랑) 두 겹을 좁고 뾰족하게 겹쳐야 불꽃으로 읽힌다. */
    const f = 1 + Math.sin(flap) * 0.3;
    const outer = ctx.createLinearGradient(0, 14, 0, 14 + 30 * f);
    outer.addColorStop(0, "rgba(255,170,70,.34)");
    outer.addColorStop(0.45, "rgba(255,120,60,.18)");
    outer.addColorStop(1, "rgba(255,110,60,0)");
    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.moveTo(-6.5, 13);
    ctx.quadraticCurveTo(-3, 20 + 16 * f, 0, 16 + 30 * f);
    ctx.quadraticCurveTo(3, 20 + 16 * f, 6.5, 13);
    ctx.closePath(); ctx.fill();

    const inner = ctx.createLinearGradient(0, 14, 0, 14 + 17 * f);
    inner.addColorStop(0, "rgba(255,248,210,.6)");
    inner.addColorStop(1, "rgba(255,214,106,0)");
    ctx.fillStyle = inner;
    ctx.beginPath();
    ctx.moveTo(-3.2, 13);
    ctx.quadraticCurveTo(-1.6, 18 + 8 * f, 0, 14 + 17 * f);
    ctx.quadraticCurveTo(1.6, 18 + 8 * f, 3.2, 13);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = "rgba(60,80,110,.16)";               // 지상 그림자는 카드에서만
    ctx.beginPath(); ctx.ellipse(0, 20, 16, 4.5, 0, 0, TAU); ctx.fill();
  }

  const bg = ctx.createLinearGradient(0, -26, 0, 20);    // 몸통
  bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.4, pet.body); bg.addColorStop(1, pet.body2);
  ctx.fillStyle = bg;
  ctx.strokeStyle = pet.line; ctx.lineWidth = 2.2;

  if (pet.key === "cat") {
    ctx.beginPath();                                     // 쫑긋한 귀
    ctx.moveTo(-16, -14); ctx.lineTo(-20, -30); ctx.lineTo(-4, -21); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(16, -14); ctx.lineTo(20, -30); ctx.lineTo(4, -21); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ff9ec4";
    ctx.beginPath(); ctx.moveTo(-15, -16); ctx.lineTo(-17.5, -25); ctx.lineTo(-8, -20); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(15, -16); ctx.lineTo(17.5, -25); ctx.lineTo(8, -20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = bg;
  } else {
    ctx.beginPath();                                     // 처진 귀
    ctx.ellipse(-19, -8, 7.5, 13, 0.25, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(19, -8, 7.5, 13, -0.25, 0, TAU); ctx.fill(); ctx.stroke();
  }

  ctx.fillStyle = bg;                                    // 얼굴 · 몸
  ctx.beginPath(); ctx.ellipse(0, -2, 19, 20, 0, 0, TAU); ctx.fill(); ctx.stroke();

  ctx.fillStyle = "rgba(255,255,255,.85)";               // 하이라이트
  ctx.beginPath(); ctx.ellipse(-7, -12, 6.5, 4.5, -0.5, 0, TAU); ctx.fill();

  if (mood === "happy") {                                // 활짝 웃는 눈 (∩ ∩) + 미소
    ctx.strokeStyle = "#3d3145"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(-7, -2.5, 3.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc( 7, -2.5, 3.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, 4, 5.5, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  } else {
    ctx.fillStyle = "#3d3145";                           // 눈
    ctx.beginPath(); ctx.arc(-7, -3, 3.1, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -3, 3.1, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-6, -4.4, 1.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -4.4, 1.2, 0, TAU); ctx.fill();
  }

  ctx.fillStyle = "rgba(255,150,180,.5)";                // 볼터치
  ctx.beginPath(); ctx.ellipse(-13, 3, 4.2, 2.8, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, 3, 4.2, 2.8, 0, 0, TAU); ctx.fill();

  if (pet.key === "cat") {
    ctx.fillStyle = "#ff7ba6";                           // 코
    ctx.beginPath();
    ctx.moveTo(0, 3); ctx.lineTo(-3, 0.5); ctx.lineTo(3, 0.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(90,70,90,.55)"; ctx.lineWidth = 1.2;
    for (const sgn of [-1, 1]) {                         // 수염
      ctx.beginPath();
      ctx.moveTo(sgn * 8, 2); ctx.lineTo(sgn * 20, -1);
      ctx.moveTo(sgn * 8, 5); ctx.lineTo(sgn * 20, 5);
      ctx.stroke();
    }
  } else {
    ctx.fillStyle = "#5b4632";                           // 큼직한 코
    ctx.beginPath(); ctx.ellipse(0, 2.5, 4.6, 3.6, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#5b4632"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(0, 8); ctx.stroke();
    ctx.beginPath(); ctx.arc(-3.5, 8, 3.5, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(3.5, 8, 3.5, 0, Math.PI); ctx.stroke();
    ctx.fillStyle = "#ff8fa8";                           // 혀
    ctx.beginPath(); ctx.ellipse(0, 12, 3.6, 2.6, 0, 0, TAU); ctx.fill();
  }

  if (space) drawHelmet(pet);                          // 우주 구간의 헬멧

  ctx.restore();
}

/* ── 미사일 ────────────────────────────────────────────────────────────── */
/* ── 유도탄 표적 배분 ──────────────────────────────────────────────────
 * 한 번에 쏜 탄들은 거의 같은 자리에서 출발하므로 "가장 가까운 적"을
 * 고르면 전부 같은 놈에게 몰린다. 한 마리에 과잉 화력을 쏟는 동안
 * 바로 옆의 적은 그대로 지나가 버렸다.
 * → 적마다 "이미 날아오고 있는 피해량(inbound)"을 세어 두고, 그 값이 남은
 *   체력 이상인 적은 후보에서 뺀다. 자연히 탄들이 각자 다른 적을 문다.
 *   (모든 적이 이미 처리된 상태라면 그냥 가장 가까운 적으로 간다) */
function releaseLock(b) {
  if (b.lock) { b.lock.inbound = Math.max(0, (b.lock.inbound || 0) - b.dmg); b.lock = null; }
}
function setLock(b, e) {
  releaseLock(b);
  b.lock = e;
  if (e) e.inbound = (e.inbound || 0) + b.dmg;
}
function acquireTarget(b) {
  let best = null, bd = 1e9;                 // 아직 여유가 있는 적 중 가장 가까운 놈
  let near = null, nd = 1e9;                 // 여유를 따지지 않은 최근접 (예비)
  for (const e of Game.enemies) {
    if (e.dead || e.y < -e.r || e.y > b.y + 30) continue;   // 화면 밖 · 이미 지나친 적
    const d = dist2(b.x, b.y, e.x, e.y);
    if (d < nd) { nd = d; near = e; }
    if ((e.inbound || 0) >= e.hp) continue;                 // 이미 죽을 만큼 탄이 몰렸다
    if (d < bd) { bd = d; best = e; }
  }
  return best || near;
}

function drawBullet(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  if (b.kind === "paw") {
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
    ctx.shadowColor = "rgba(255,140,190,.85)"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#ff8fbc";
    ctx.beginPath(); ctx.ellipse(0, 1.5, 6.2, 5.2, 0, 0, TAU); ctx.fill();   // 발바닥 패드
    for (const [dx, dy, r] of [[-5.6, -4.6, 2.5], [-2, -7.4, 2.6], [2, -7.4, 2.6], [5.6, -4.6, 2.5]])
      { ctx.beginPath(); ctx.arc(dx, dy, r, 0, TAU); ctx.fill(); }           // 발가락
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.beginPath(); ctx.ellipse(-1.6, 0, 2.2, 1.6, 0, 0, TAU); ctx.fill();
  } else if (b.kind === "d_spread") {                     // 방사형 : 작은 에너지 탄
    ctx.shadowColor = b.col || "#8fd9ff"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, 4.2, 0, TAU); ctx.fill();
    ctx.fillStyle = b.col || "#8fd9ff";
    ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (b.kind === "d_focus") {                      // 집중형 : 길쭉한 관통형 빔
    ctx.shadowColor = "#6ff0ff"; ctx.shadowBlur = 12;
    const g = ctx.createLinearGradient(0, -14, 0, 10);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#6ff0ff"); g.addColorStop(1, "rgba(110,240,255,0)");
    ctx.fillStyle = g;
    rrect(ctx, -3.4, -14, 6.8, 24, 3.4); ctx.fill();
    ctx.shadowBlur = 0;
  } else if (b.kind === "d_missile") {                    // 미사일형 : 유도 로켓
    /* 예전엔 흰 몸통이라 하늘 배경에 묻혔다. 주황 동체 + 빨간 날개 + 노란 탄두로
     * 색을 확실히 주고, 크기도 1.6배 키웠다. 뒤로는 연기 꼬리를 남긴다. */
    const ang = Math.atan2(b.vy, b.vx) + Math.PI / 2;
    ctx.save();                                            // 연기 꼬리 (회전 전 좌표계)
    const ux = -Math.cos(ang - Math.PI / 2), uy = -Math.sin(ang - Math.PI / 2);
    for (let i = 1; i <= 4; i++) {
      ctx.globalAlpha = 0.28 - i * 0.055;
      ctx.fillStyle = "#e6ecf5";
      ctx.beginPath(); ctx.arc(ux * i * 9 + Math.sin(b.t * 20 + i) * 2, uy * i * 9, 3 + i * 1.6, 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.rotate(ang);
    const f = 1 + Math.sin(Game.timer * 32) * 0.35;
    const fg = ctx.createLinearGradient(0, 9, 0, 9 + 22 * f);   // 배기 불꽃
    fg.addColorStop(0, "rgba(255,240,160,.95)"); fg.addColorStop(0.5, "rgba(255,150,60,.7)");
    fg.addColorStop(1, "rgba(255,90,40,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-4.5, 9); ctx.quadraticCurveTo(0, 12 + 22 * f, 4.5, 9); ctx.closePath(); ctx.fill();

    ctx.fillStyle = "#ff4d6a";                             // 꼬리 날개
    ctx.strokeStyle = "#8f1f33"; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-5, 3); ctx.lineTo(-11, 11); ctx.lineTo(-5, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(5, 3); ctx.lineTo(11, 11); ctx.lineTo(5, 10); ctx.closePath(); ctx.fill(); ctx.stroke();

    const bodyG = ctx.createLinearGradient(-6, 0, 6, 0);   // 주황 동체
    bodyG.addColorStop(0, "#ffb070"); bodyG.addColorStop(0.5, "#ff7a2e"); bodyG.addColorStop(1, "#c94d12");
    ctx.fillStyle = bodyG; ctx.strokeStyle = "#7a2d08"; ctx.lineWidth = 1.5;
    rrect(ctx, -6, -8, 12, 18, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffffff";                             // 동체 띠
    ctx.fillRect(-6, -1, 12, 3);

    ctx.fillStyle = "#ffd76a"; ctx.strokeStyle = "#a8701a";  // 노란 탄두
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.quadraticCurveTo(6.5, -10, 6, -7); ctx.lineTo(-6, -7);
    ctx.quadraticCurveTo(-6.5, -10, 0, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.7)";                // 하이라이트
    ctx.beginPath(); ctx.ellipse(-2.5, -6, 1.4, 5, 0, 0, TAU); ctx.fill();
  } else {
    ctx.rotate(b.spin);
    ctx.shadowColor = "rgba(255,220,120,.9)"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#fff3c9";
    ctx.strokeStyle = "#e0ac3a"; ctx.lineWidth = 1.6;
    rrect(ctx, -3, -8, 6, 16, 3); ctx.fill(); ctx.stroke();                  // 뼈대
    for (const dy of [-8, 8])
      for (const dx of [-4.2, 4.2]) {
        ctx.beginPath(); ctx.arc(dx, dy, 3.6, 0, TAU); ctx.fill(); ctx.stroke();
      }
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

/* ── 드론 ──────────────────────────────────────────────────────────────── */
function drawDrones() {
  const p = Game.player, sp = droneSpec();
  if (!sp) return;
  const pet = Game.pet, t = Game.timer;
  const accent = DRONE_COLORS[sp.form];

  for (const d of droneSlots()) {
    ctx.save();
    ctx.translate(d.x, d.y);

    ctx.globalAlpha = 0.35;                              // 프로펠러
    ctx.fillStyle = "#cfe4f5";
    ctx.beginPath();
    ctx.ellipse(0, -11, 15 * Math.abs(Math.cos(t * 20)) + 3, 2.4, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#4a5570";                           // 프로펠러 축
    rrect(ctx, -1.6, -12, 3.2, 6, 1.5); ctx.fill();

    const g = ctx.createLinearGradient(0, -9, 0, 9);     // 몸체
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, pet.body); g.addColorStop(1, pet.body2);
    ctx.fillStyle = g;
    ctx.strokeStyle = pet.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#1b2233";                           // 바이저
    rrect(ctx, -6.5, -3.5, 13, 6, 3); ctx.fill();
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(-2.6, -0.5, 1.7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(2.6, -0.5, 1.7, 0, TAU); ctx.fill();

    ctx.fillStyle = "rgba(255,255,255,.6)";              // 하이라이트
    ctx.beginPath(); ctx.ellipse(-3.5, -6, 3, 2, -0.5, 0, TAU); ctx.fill();

    if (sp.form === 1) {                                 // 집중형: 총열
      ctx.fillStyle = "#c9d6ea";
      rrect(ctx, -2, -14, 4, 6, 1.6); ctx.fill();
    } else if (sp.form === 2) {                          // 미사일형: 측면 포드
      ctx.fillStyle = "#c9d6ea";
      rrect(ctx, -9, 4, 5, 7, 2); ctx.fill();
      rrect(ctx, 4, 4, 5, 7, 2); ctx.fill();
    } else if (sp.form === 3) {                          // 폭풍형: 포드 + 테슬라 코일
      ctx.fillStyle = "#c9d6ea";
      rrect(ctx, -9, 4, 5, 7, 2); ctx.fill();            // 미사일 포드
      rrect(ctx, 4, 4, 5, 7, 2); ctx.fill();
      rrect(ctx, -10, -9, 3.5, 11, 1.5); ctx.fill();
      rrect(ctx, 6.5, -9, 3.5, 11, 1.5); ctx.fill();
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(-8.2, -9.5, 2.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(8.2, -9.5, 2.4, 0, TAU); ctx.fill();
      ctx.save();                                        // 코일 사이를 튀는 작은 아크
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.4;
      ctx.shadowColor = accent; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.moveTo(-8, -10);
      for (let i = 1; i < 5; i++) ctx.lineTo(-8 + i * 3.2, -10 - rand(-3, 3));
      ctx.lineTo(8, -10); ctx.stroke();
      ctx.restore();
    }

    for (let i = 0; i < 3; i++) {                        // 랭크 표시 (아래 점 3개)
      ctx.fillStyle = i < sp.rank ? accent : "rgba(255,255,255,.28)";
      ctx.beginPath(); ctx.arc(-5 + i * 5, 13, 1.7, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ── 적 ────────────────────────────────────────────────────────────────── */
/* 날개 한 짝 — 어깨를 축으로 회전시켜 퍼덕이게 한다 */
function drawWing(r, side, ang, skin) {
  ctx.save();
  ctx.translate(side * r * 0.34, -r * 0.06);
  ctx.rotate(side * ang);
  const g = ctx.createLinearGradient(0, -r * 0.4, side * r * 1.4, r * 0.3);
  g.addColorStop(0, skin.body);
  g.addColorStop(1, skin.wing);
  ctx.fillStyle = g;
  ctx.strokeStyle = skin.wing; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(side * r * 0.85, -r * 0.62, side * r * 1.45, -r * 0.08);
  ctx.quadraticCurveTo(side * r * 0.95, r * 0.12, side * r * 1.15, r * 0.34);
  ctx.quadraticCurveTo(side * r * 0.55, r * 0.30, 0, r * 0.22);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1.2;
  ctx.beginPath();                                   // 깃털 결
  ctx.moveTo(side * r * 0.25, r * 0.02);
  ctx.quadraticCurveTo(side * r * 0.75, -r * 0.16, side * r * 1.2, -r * 0.02);
  ctx.stroke();
  ctx.restore();
}

/* ── 보스: 메카 부엉이 ────────────────────────────────────────────────
 * 일반 적(둥글고 귀여운 새)과 실루엣부터 다르게 간다.
 * 각진 장갑판 · 회전 로터 · 바이저 눈 · 가슴 코어 · 추진기 화염.
 * 체력이 절반 아래로 떨어지면 코어와 눈이 붉게 변하며 경고등이 빨라진다. */
function drawBoss(e) {
  const r = e.r, k = clamp(e.hp / e.maxHp, 0, 1);
  const rage = k < 0.5;
  const eye = rage ? "#ff5c6c" : "#6ff0ff";
  const t = Game.timer;

  ctx.save();
  ctx.translate(e.x, e.y + Math.sin(t * 1.8) * 3);
  ctx.rotate(Math.sin(t * 0.9) * 0.05);
  if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 26 * e.hurt; }

  // 추진기 화염
  for (const sx of [-0.42, 0.42]) {
    const f = 1 + Math.sin(t * 22 + sx) * 0.3;
    const fg = ctx.createLinearGradient(0, r * 0.7, 0, r * 0.7 + r * 0.7 * f);
    fg.addColorStop(0, "rgba(255,220,120,.85)");
    fg.addColorStop(0.5, "rgba(255,130,60,.45)");
    fg.addColorStop(1, "rgba(255,110,60,0)");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(sx * r - r * 0.13, r * 0.66);
    ctx.quadraticCurveTo(sx * r, r * 0.7 + r * 0.8 * f, sx * r + r * 0.13, r * 0.66);
    ctx.closePath(); ctx.fill();
  }

  // 회전 로터 (좌우 2쌍)
  for (const sx of [-1, 1]) {
    ctx.save();
    ctx.translate(sx * r * 0.86, -r * 0.16);
    ctx.fillStyle = "#4a5570";
    rrect(ctx, -r * 0.1, -r * 0.1, r * 0.2, r * 0.44, r * 0.06); ctx.fill();   // 로터 축
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#9fb4d6";
    for (let i = 0; i < 3; i++) {                                             // 블레이드
      ctx.save();
      ctx.rotate(t * 16 * sx + i * (TAU / 3));
      ctx.beginPath(); ctx.ellipse(r * 0.34, 0, r * 0.34, r * 0.055, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#2f3a52";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.1, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // 각진 장갑 본체
  const body = ctx.createLinearGradient(0, -r, 0, r);
  body.addColorStop(0, "#8fa3c4"); body.addColorStop(0.45, "#5d6d90"); body.addColorStop(1, "#39445e");
  ctx.fillStyle = body;
  ctx.strokeStyle = "#232a3d"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-r * 0.72, -r * 0.34);
  ctx.lineTo(-r * 0.34, -r * 0.82);
  ctx.lineTo(r * 0.34, -r * 0.82);
  ctx.lineTo(r * 0.72, -r * 0.34);
  ctx.lineTo(r * 0.6, r * 0.5);
  ctx.lineTo(0, r * 0.82);
  ctx.lineTo(-r * 0.6, r * 0.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // 장갑 패널 라인 · 경고 스트라이프
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-r * 0.5, -r * 0.1); ctx.lineTo(r * 0.5, -r * 0.1);
  ctx.moveTo(-r * 0.4, r * 0.3); ctx.lineTo(r * 0.4, r * 0.3);
  ctx.stroke();
  ctx.fillStyle = rage ? "rgba(255,92,108,.85)" : "rgba(255,201,60,.8)";
  for (let i = -2; i <= 2; i++)
    ctx.fillRect(i * r * 0.2 - r * 0.05, r * 0.36, r * 0.1, r * 0.1);

  // 바이저와 눈
  ctx.fillStyle = "#1b2233";
  rrect(ctx, -r * 0.56, -r * 0.56, r * 1.12, r * 0.42, r * 0.14); ctx.fill();
  ctx.save();
  ctx.shadowColor = eye; ctx.shadowBlur = 16;
  ctx.fillStyle = eye;
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(sx * r * 0.26, -r * 0.35, r * 0.15, r * 0.1, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // 가슴 코어 (약점처럼 보이게 맥동)
  const pulse = 1 + Math.sin(t * (rage ? 9 : 4.5)) * 0.12;
  ctx.save();
  ctx.translate(0, r * 0.06);
  ctx.scale(pulse, pulse);
  const core = ctx.createRadialGradient(0, 0, r * 0.03, 0, 0, r * 0.26);
  core.addColorStop(0, "#ffffff");
  core.addColorStop(0.45, eye);
  core.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = core;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, TAU); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.17, 0, TAU); ctx.stroke();
  ctx.restore();

  // 안테나 + 점멸 경고등
  ctx.strokeStyle = "#2f3a52"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -r * 0.82); ctx.lineTo(0, -r * 1.06); ctx.stroke();
  const blink = Math.sin(t * (rage ? 14 : 7)) > 0;
  ctx.fillStyle = blink ? "#ff5c6c" : "rgba(255,92,108,.3)";
  ctx.beginPath(); ctx.arc(0, -r * 1.1, r * 0.07, 0, TAU); ctx.fill();

  // 어깨 포드
  ctx.fillStyle = "#46527040".slice(0, 7);
  for (const sx of [-1, 1]) {
    ctx.fillStyle = "#465270";
    rrect(ctx, sx * r * 0.58 - r * 0.12, -r * 0.5, r * 0.24, r * 0.3, r * 0.08);
    ctx.fill();
  }

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════
 * TIER 1 : 분노한 야수 군단 (30스테이지~)
 * ───────────────────────────────────────────────────────────────────────
 * 디자인 규칙 — "둥근 곳을 전부 각지게, 표정을 전부 아래로".
 *  · 실루엣  : 원/타원 → 다각형, 어깨와 등에 가시
 *  · 눈      : 동그란 점 → 사선으로 찢어진 발광 슬릿 + 두꺼운 V자 눈썹
 *  · 입      : 미소 → 지그재그 송곳니
 *  · 색      : 파스텔 → 어둡게 가라앉은 적/보라/독초색 + 붉은 오라
 * ═════════════════════════════════════════════════════════════════════ */

/* 화가 난 눈 — 사선 슬릿 + 눈썹. 멀리서도 "분노"가 한눈에 읽히도록. */
function angryEyes(r, col, glow, ox, oy) {
  const ex = ox === undefined ? r * 0.34 : ox;
  const ey = oy === undefined ? -r * 0.10 : oy;
  ctx.save();
  ctx.shadowColor = glow; ctx.shadowBlur = r * 0.55;
  ctx.fillStyle = col;
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * ex, ey);
    ctx.rotate(s * 0.6);                       // 안쪽이 아래로 처진 사선
    ctx.beginPath();
    ctx.moveTo(-r * 0.26, 0);
    ctx.lineTo(r * 0.20, -r * 0.14);
    ctx.lineTo(r * 0.20, r * 0.14);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = "#1c0a10";                 // 미간을 찌푸린 두꺼운 눈썹
  ctx.lineWidth = Math.max(2, r * 0.13);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(-ex * 1.9, ey - r * 0.42); ctx.lineTo(-ex * 0.3, ey - r * 0.14);
  ctx.moveTo( ex * 1.9, ey - r * 0.42); ctx.lineTo( ex * 0.3, ey - r * 0.14);
  ctx.stroke();
}

/* 지그재그 송곳니 입 */
function fangMouth(r, y, w, n, col) {
  ctx.fillStyle = col || "#2a0810";
  ctx.beginPath();
  ctx.moveTo(-w, y);
  for (let i = 0; i < n; i++) {
    ctx.lineTo(-w + (2 * w) * (i + 0.5) / n, y + r * 0.26);
    ctx.lineTo(-w + (2 * w) * (i + 1) / n, y);
  }
  ctx.closePath(); ctx.fill();
}

/* 맹금류의 각진 날개 — 끝이 톱니처럼 갈라진다 */
function drawRaptorWing(r, side, ang, skin) {
  ctx.save();
  ctx.translate(side * r * 0.32, -r * 0.05);
  ctx.rotate(side * ang);
  const g = ctx.createLinearGradient(0, -r * 0.4, side * r * 1.5, r * 0.3);
  g.addColorStop(0, skin.body); g.addColorStop(1, skin.wing);
  ctx.fillStyle = g; ctx.strokeStyle = skin.edge; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.10);
  ctx.lineTo(side * r * 0.78, -r * 0.66);
  ctx.lineTo(side * r * 1.58, -r * 0.24);
  ctx.lineTo(side * r * 1.18,  r * 0.02);
  ctx.lineTo(side * r * 1.44,  r * 0.30);
  ctx.lineTo(side * r * 0.94,  r * 0.16);
  ctx.lineTo(side * r * 1.04,  r * 0.54);
  ctx.lineTo(side * r * 0.44,  r * 0.20);
  ctx.lineTo(0, r * 0.24);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawEnemyT1(e, flapA) {
  const r = e.r, skin = e.skin || RAGE_SKINS[0];

  /* 공통 : 몸을 감싼 분노의 오라(맥동) */
  const auraPulse = 0.22 + Math.sin(Game.timer * 6 + (e.wob || 0)) * 0.07;

  if (e.type === "bird" || e.elite) {
    /* ── 맹금 : 방패꼴 몸통에 갈고리 부리 ── */
    ctx.translate(e.x, e.y + flapA * r * 0.08);
    ctx.save();
    ctx.globalAlpha = auraPulse; ctx.fillStyle = skin.aura;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.2, 0, TAU); ctx.fill();
    ctx.restore();
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    drawRaptorWing(r, -1, -0.10 - flapA * 0.9, skin);
    drawRaptorWing(r,  1, -0.10 - flapA * 0.9, skin);

    ctx.fillStyle = skin.wing;                         // 세 갈래 꼬리깃
    ctx.beginPath();
    ctx.moveTo(-r * 0.30, -r * 0.45);
    ctx.lineTo(-r * 0.17, -r * 1.14);
    ctx.lineTo(0, -r * 0.66);
    ctx.lineTo(r * 0.17, -r * 1.14);
    ctx.lineTo(r * 0.30, -r * 0.45);
    ctx.closePath(); ctx.fill();

    const g = ctx.createLinearGradient(0, -r, 0, r);    // 몸통 : 아래가 뾰족한 방패
    g.addColorStop(0, skin.body); g.addColorStop(1, skin.body2);
    ctx.fillStyle = g; ctx.strokeStyle = skin.edge; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.90);
    ctx.lineTo(r * 0.84, -r * 0.32);
    ctx.lineTo(r * 0.52, r * 0.58);
    ctx.lineTo(0, r * 0.96);
    ctx.lineTo(-r * 0.52, r * 0.58);
    ctx.lineTo(-r * 0.84, -r * 0.32);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.fillStyle = skin.edge;                          // 어깨 가시
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.52, -r * 0.60);
      ctx.lineTo(s * r * 0.98, -r * 0.92);
      ctx.lineTo(s * r * 0.70, -r * 0.26);
      ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;

    ctx.fillStyle = skin.beak;                          // 갈고리 부리
    ctx.strokeStyle = "#7d3a10"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.26, r * 0.18);
    ctx.lineTo(0, r * 0.80);
    ctx.lineTo(r * 0.26, r * 0.18);
    ctx.lineTo(0, r * 0.34);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    angryEyes(r, skin.eye, skin.glow, r * 0.34, -r * 0.14);

    if (e.elite) {                                      // 엘리트는 거대한 뿔
      ctx.fillStyle = "#efe0c6"; ctx.strokeStyle = "#7a5a30"; ctx.lineWidth = 2;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * r * 0.32, -r * 0.70);
        ctx.quadraticCurveTo(s * r * 1.10, -r * 1.10, s * r * 0.82, -r * 1.60);
        ctx.quadraticCurveTo(s * r * 0.74, -r * 0.98, s * r * 0.18, -r * 0.56);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }

  } else if (e.type === "slime") {
    /* ── 용암 슬라임 : 굳은 암석 껍질 사이로 용암이 흐른다 ── */
    const sq = 1 + Math.sin(e.flap * 0.7) * 0.11;
    ctx.translate(e.x, e.y + r * (1 - 1 / sq) * 0.5);
    ctx.scale(1 / sq, sq);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, "#8c2a22"); g.addColorStop(0.55, "#4a1010"); g.addColorStop(1, "#1c0606");
    ctx.fillStyle = g; ctx.strokeStyle = "#0d0303"; ctx.lineWidth = 2;
    ctx.beginPath();                                   // 각진 바위 덩어리
    ctx.moveTo(-r * 0.98, r * 0.62);
    ctx.lineTo(-r * 0.72, -r * 0.42);
    ctx.lineTo(-r * 0.24, -r * 0.94);
    ctx.lineTo(r * 0.34, -r * 0.88);
    ctx.lineTo(r * 0.86, -r * 0.30);
    ctx.lineTo(r * 0.98, r * 0.62);
    ctx.lineTo(r * 0.42, r * 0.98);
    ctx.lineTo(-r * 0.42, r * 0.98);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#3a0d0d";                          // 등에 솟은 가시
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.42 - r * 0.14, -r * 0.78);
      ctx.lineTo(i * r * 0.42, -r * 1.34);
      ctx.lineTo(i * r * 0.42 + r * 0.14, -r * 0.78);
      ctx.closePath(); ctx.fill();
    }

    ctx.save();                                         // 용암 균열 (맥동하는 빛)
    ctx.globalAlpha = 0.75 + Math.sin(Game.timer * 5 + e.wob) * 0.2;
    ctx.strokeStyle = "#ff7a1a"; ctx.lineWidth = Math.max(1.6, r * 0.09);
    ctx.shadowColor = "#ff5a00"; ctx.shadowBlur = r * 0.6; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-r * 0.72, r * 0.10); ctx.lineTo(-r * 0.30, r * 0.44);
    ctx.lineTo(-r * 0.02, r * 0.16); ctx.lineTo(r * 0.44, r * 0.52);
    ctx.moveTo(r * 0.62, -r * 0.44); ctx.lineTo(r * 0.24, -r * 0.16);
    ctx.stroke();
    ctx.restore();

    angryEyes(r, "#ffd23a", "#ff7a00", r * 0.36, -r * 0.16);
    fangMouth(r, r * 0.36, r * 0.44, 4, "#1a0404");

  } else {
    /* ── 악귀 : 유령이 뿔과 송곳니를 얻고 검게 물들었다 ── */
    ctx.translate(e.x, e.y + Math.sin(e.wob * 1.6) * 3);
    ctx.rotate(Math.sin(e.wob * 0.9) * 0.12);
    ctx.save();
    ctx.globalAlpha = auraPulse * 0.9; ctx.fillStyle = "rgba(120,40,200,.55)";
    ctx.beginPath(); ctx.arc(0, 0, r * 1.15, 0, TAU); ctx.fill();
    ctx.restore();
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, "#7a4fa8"); g.addColorStop(1, "#1c0a2c");
    ctx.fillStyle = g; ctx.strokeStyle = "#0d0416"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.96, r * 0.14);                    // 각진 어깨
    ctx.lineTo(-r * 0.66, -r * 0.74);
    ctx.lineTo(0, -r * 1.00);
    ctx.lineTo(r * 0.66, -r * 0.74);
    ctx.lineTo(r * 0.96, r * 0.14);
    const tips = 5, w = r * 0.96;                       // 갈기갈기 찢어진 아랫자락
    for (let i = 0; i <= tips; i++) {
      const px = w - (2 * w) * (i / tips);
      const py = r * 0.72 + (i % 2 ? r * 0.42 : -r * 0.10)
               + Math.sin(e.flap * 1.1 + i) * r * 0.12;
      ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#120520";                          // 머리 위 두 개의 뿔
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.30, -r * 0.86);
      ctx.lineTo(s * r * 0.62, -r * 1.46);
      ctx.lineTo(s * r * 0.66, -r * 0.74);
      ctx.closePath(); ctx.fill();
    }

    angryEyes(r, "#ff5c3a", "#ff2a00", r * 0.36, -r * 0.20);
    fangMouth(r, r * 0.26, r * 0.40, 4, "#0d0212");
  }
}

/* ═══════════════════════════════════════════════════════════════════════
 * TIER 2 : 보이드 결정체 (60스테이지~)
 * ───────────────────────────────────────────────────────────────────────
 * 여기서부터는 아예 "생물"을 버린다.
 *  · 실루엣  : 완전한 기하 도형(델타/구/육각결정)과 회전하는 궤도 링
 *  · 색      : 거의 검은 본체 + 단 하나의 네온 발광색 (시안/마젠타/라임)
 *  · 표정    : 눈이 아니라 '코어'가 맥동한다. 사선 슬릿만 남겨 냉랭함 유지
 * ═════════════════════════════════════════════════════════════════════ */

/* 회전하는 에너지 궤도 링 */
function voidRing(r, rx, ry, rot, col, alpha, lw) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = col; ctx.lineWidth = lw;
  ctx.shadowColor = col; ctx.shadowBlur = r * 0.5;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, rot, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* 맥동하는 코어 (마름모) */
function voidCore(r, size, col, core, t, oy) {
  const k = size * (1 + Math.sin(t * 7) * 0.12), y = oy || 0;
  ctx.save();
  ctx.shadowColor = col; ctx.shadowBlur = r * 0.9;
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.moveTo(0, y - k); ctx.lineTo(k * 0.7, y); ctx.lineTo(0, y + k); ctx.lineTo(-k * 0.7, y);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemyT2(e, flapA) {
  const r = e.r, sk = e.skin || VOID_SKINS[0], t = Game.timer + (e.wob || 0);

  if (e.type === "bird" || e.elite) {
    /* ── 인터셉터 : 아래를 향한 델타 기체 + 좌우 에너지 블레이드 ── */
    ctx.translate(e.x, e.y + flapA * r * 0.05);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }
    voidRing(r, r * 1.55, r * 0.34, Math.sin(e.flap) * 0.55, sk.neon, 0.55, 2);

    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, sk.dark); g.addColorStop(1, sk.dark2);
    ctx.fillStyle = g; ctx.strokeStyle = sk.neon; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, r * 1.06);                            // 뾰족한 기수(아래)
    ctx.lineTo(r * 1.10, -r * 0.46);
    ctx.lineTo(r * 0.40, -r * 0.30);
    ctx.lineTo(0, -r * 1.00);
    ctx.lineTo(-r * 0.40, -r * 0.30);
    ctx.lineTo(-r * 1.10, -r * 0.46);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.save();                                          // V자 바이저 슬릿
    ctx.shadowColor = sk.neon; ctx.shadowBlur = r * 0.7;
    ctx.strokeStyle = sk.core; ctx.lineWidth = Math.max(2, r * 0.11);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-r * 0.52, -r * 0.02); ctx.lineTo(0, r * 0.26); ctx.lineTo(r * 0.52, -r * 0.02);
    ctx.stroke();
    ctx.restore();

    voidCore(r, r * 0.24, sk.neon, sk.core, t, -r * 0.52);   // 바이저 위에서 맥동
    if (e.elite) {                                       // 엘리트는 궤도 링이 하나 더
      voidRing(r, r * 1.15, r * 1.15, t * 0.8, sk.neon, 0.45, 3);
      voidRing(r, r * 0.8, r * 1.35, -t * 0.6, sk.core, 0.3, 2);
    }

  } else if (e.type === "slime") {
    /* ── 코어 큐브 : 천천히 자전하는 육각 결정 ── */
    ctx.translate(e.x, e.y);
    ctx.rotate(Math.sin(t * 0.9) * 0.35);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    const g = ctx.createLinearGradient(-r, -r, r, r);
    g.addColorStop(0, sk.dark); g.addColorStop(1, sk.dark2);
    ctx.fillStyle = g; ctx.strokeStyle = sk.neon; ctx.lineWidth = 2;
    ctx.beginPath();                                     // 외곽 육각
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * TAU - Math.PI / 2;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.save();                                          // 내부 결정 격자
    ctx.globalAlpha = 0.5; ctx.strokeStyle = sk.neon; ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * Math.PI - Math.PI / 2;
      ctx.moveTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92);
      ctx.lineTo(-Math.cos(a) * r * 0.92, -Math.sin(a) * r * 0.92);
    }
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur = 0;

    ctx.save();                                          // 냉랭한 사선 슬릿 눈
    ctx.shadowColor = sk.neon; ctx.shadowBlur = r * 0.6;
    ctx.fillStyle = sk.core;
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * r * 0.32, -r * 0.06);
      ctx.rotate(s * 0.55);
      ctx.fillRect(-r * 0.22, -r * 0.05, r * 0.44, r * 0.1);
      ctx.restore();
    }
    ctx.restore();
    voidCore(r, r * 0.24, sk.neon, sk.core, t, r * 0.42);    // 슬릿 눈 아래에서 맥동

  } else {
    /* ── 보이드 아이 : 궤도 링을 두른 외눈 구체 + 에너지 촉수 ── */
    ctx.translate(e.x, e.y + Math.sin(t * 2.2) * 3);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    ctx.save();                                          // 아래로 늘어진 촉수
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = sk.neon; ctx.lineWidth = Math.max(1.5, r * 0.09);
    ctx.shadowColor = sk.neon; ctx.shadowBlur = r * 0.5; ctx.lineCap = "round";
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.42, r * 0.5);
      ctx.quadraticCurveTo(i * r * 0.42 + Math.sin(t * 4 + i) * r * 0.3, r * 0.95,
                           i * r * 0.42 + Math.sin(t * 4 + i) * r * 0.55, r * 1.35);
      ctx.stroke();
    }
    ctx.restore();

    const g = ctx.createRadialGradient(0, -r * 0.2, r * 0.15, 0, 0, r);
    g.addColorStop(0, sk.dark); g.addColorStop(1, sk.dark2);
    ctx.fillStyle = g; ctx.strokeStyle = sk.neon; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    voidRing(r, r * 1.25, r * 0.36, t * 1.1, sk.neon, 0.6, 2);
    voidRing(r, r * 0.42, r * 1.2, -t * 0.7, sk.core, 0.3, 1.6);

    ctx.save();                                          // 세로 동공의 외눈
    ctx.shadowColor = sk.neon; ctx.shadowBlur = r * 0.9;
    ctx.fillStyle = sk.neon;
    ctx.beginPath(); ctx.ellipse(0, -r * 0.02, r * 0.42, r * 0.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#050510";
    ctx.beginPath(); ctx.ellipse(Math.sin(t * 1.6) * r * 0.1, -r * 0.02,
                                 r * 0.09, r * 0.26, 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = sk.neon; ctx.lineWidth = Math.max(2, r * 0.12);
    ctx.lineCap = "round";
    ctx.beginPath();                                     // 눈 위를 가로지르는 각진 눈꺼풀
    ctx.moveTo(-r * 0.62, -r * 0.5); ctx.lineTo(r * 0.62, -r * 0.26);
    ctx.stroke();
  }
}

/* ═══════════════════════════════════════════════════════════════════════
 * TIER 3 : 외계 침공군 (90스테이지~ · 우주 구간)
 * ───────────────────────────────────────────────────────────────────────
 * 배경이 우주로 바뀌는 구간이라 적도 전부 "외계인"으로 갈아 끼운다.
 *  · 접시병 : 작은 UFO 조종석에 앉은 외계인 (돔 유리 + 깜빡이는 착륙등)
 *  · 그레이 : 큰 물방울 머리에 검은 아몬드 눈, 더듬이와 촉수 팔
 *  · 젤리   : 반투명 점액질 몸에 눈이 셋, 안에서 기포가 오르내린다
 * 색은 3종(라임 / 보라 / 시안)으로 돌려 같은 종류라도 지루하지 않게.
 * ═════════════════════════════════════════════════════════════════════ */

/* 커다란 검은 아몬드 눈 한 쌍 — 외계인이라는 인상을 결정짓는 부분 */
function alienEyes(r, tilt, w, h, oy) {
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * r * 0.34, oy);
    ctx.rotate(s * tilt);
    ctx.fillStyle = "#0b1020";
    ctx.beginPath(); ctx.ellipse(0, 0, r * w, r * h, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.85)";                 // 반짝임 두 점
    ctx.beginPath(); ctx.ellipse(-r * w * 0.3, -r * h * 0.35, r * w * 0.26, r * h * 0.2, -0.4, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.ellipse(r * w * 0.22, r * h * 0.28, r * w * 0.14, r * h * 0.12, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

/* 끝에 빛나는 구슬이 달린 더듬이 */
function antenna(r, side, glow, len) {
  ctx.save();
  ctx.strokeStyle = "#4d6b3a"; ctx.lineWidth = Math.max(1.6, r * 0.07);
  ctx.lineCap = "round";
  const sway = Math.sin(Game.timer * 3 + side) * r * 0.12;
  ctx.beginPath();
  ctx.moveTo(side * r * 0.3, -r * 0.62);
  ctx.quadraticCurveTo(side * r * 0.5, -r * (0.62 + len * 0.5),
                       side * r * 0.42 + sway, -r * (0.62 + len));
  ctx.stroke();
  ctx.shadowColor = glow; ctx.shadowBlur = r * 0.5;
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(side * r * 0.42 + sway, -r * (0.62 + len), r * 0.13, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawEnemyT3(e, flapA) {
  const r = e.r, sk = e.skin || ALIEN_SKINS[0], t = Game.timer + (e.wob || 0);

  if (e.type === "bird" || e.elite) {
    /* ── 접시병 : 조종석 돔에 앉은 외계인 ── */
    ctx.translate(e.x, e.y + Math.sin(t * 2.6) * 3);
    ctx.rotate(Math.sin(t * 1.3) * 0.07);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    ctx.save();                                            // 아래로 새는 견인 광선
    ctx.globalAlpha = 0.22 + Math.sin(t * 5) * 0.06;
    const bg = ctx.createLinearGradient(0, r * 0.3, 0, r * 1.7);
    bg.addColorStop(0, sk.light); bg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-r * 0.34, r * 0.3); ctx.lineTo(r * 0.34, r * 0.3);
    ctx.lineTo(r * 0.9, r * 1.7); ctx.lineTo(-r * 0.9, r * 1.7);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    const hull = ctx.createLinearGradient(0, -r * 0.1, 0, r * 0.45);   // 접시 선체
    hull.addColorStop(0, "#e8eef8"); hull.addColorStop(0.5, "#9fb0c9"); hull.addColorStop(1, "#5b6a86");
    ctx.fillStyle = hull; ctx.strokeStyle = "#39445e"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, r * 0.16, r * 1.12, r * 0.36, 0, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.save();                                            // 깜빡이는 착륙등
    ctx.shadowColor = sk.light; ctx.shadowBlur = r * 0.5;
    for (let i = -2; i <= 2; i++) {
      const on = (Math.sin(t * 7 + i * 1.1) + 1) * 0.5;
      ctx.globalAlpha = 0.35 + on * 0.65;
      ctx.fillStyle = i % 2 ? sk.light : sk.glow;
      ctx.beginPath(); ctx.arc(i * r * 0.4, r * 0.3, r * 0.09, 0, TAU); ctx.fill();
    }
    ctx.restore();

    const dome = ctx.createRadialGradient(-r * 0.15, -r * 0.35, r * 0.05, 0, -r * 0.1, r * 0.72);
    dome.addColorStop(0, "rgba(255,255,255,.9)");          // 유리 돔
    dome.addColorStop(0.55, "rgba(190,235,255,.45)");
    dome.addColorStop(1, "rgba(120,190,230,.3)");
    ctx.fillStyle = dome;
    ctx.beginPath(); ctx.ellipse(0, r * 0.06, r * 0.62, r * 0.62, 0, Math.PI, 0); ctx.fill();

    ctx.save();                                            // 돔 안의 외계인
    ctx.beginPath(); ctx.ellipse(0, r * 0.06, r * 0.6, r * 0.6, 0, Math.PI, 0); ctx.clip();
    const g = ctx.createLinearGradient(0, -r * 0.5, 0, r * 0.1);
    g.addColorStop(0, sk.skin); g.addColorStop(1, sk.skin2);
    ctx.fillStyle = g; ctx.strokeStyle = sk.line; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(0, -r * 0.14, r * 0.36, r * 0.32, 0, 0, TAU); ctx.fill(); ctx.stroke();
    alienEyes(r, 0.5, 0.15, 0.19, -r * 0.16);
    ctx.restore();

    ctx.strokeStyle = "rgba(255,255,255,.8)"; ctx.lineWidth = 2.4;   // 돔 테두리 광택
    ctx.beginPath(); ctx.ellipse(0, r * 0.06, r * 0.62, r * 0.62, 0, Math.PI * 1.15, Math.PI * 1.62); ctx.stroke();
    ctx.shadowBlur = 0;

    if (e.elite) {                                         // 엘리트 = 모선
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.strokeStyle = sk.glow; ctx.lineWidth = 3;
      ctx.shadowColor = sk.glow; ctx.shadowBlur = r * 0.35;
      ctx.beginPath(); ctx.ellipse(0, r * 0.16, r * 1.34, r * 0.5, Math.sin(t) * 0.06, 0, TAU); ctx.stroke();
      ctx.restore();
    }

  } else if (e.type === "slime") {
    /* ── 젤리 외계인 : 반투명 점액질, 눈이 셋 ── */
    const sq = 1 + Math.sin(e.flap * 0.7) * 0.13;
    ctx.translate(e.x, e.y + r * (1 - 1 / sq) * 0.5);
    ctx.scale(1 / sq, sq);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r * 1.05);
    g.addColorStop(0, "rgba(255,255,255,.85)");
    g.addColorStop(0.45, sk.skin);
    g.addColorStop(1, sk.skin2);
    ctx.fillStyle = g; ctx.strokeStyle = sk.line; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r, r * 0.66);
    ctx.quadraticCurveTo(-r * 1.08, -r * 0.98, 0, -r * 0.98);
    ctx.quadraticCurveTo(r * 1.08, -r * 0.98, r, r * 0.66);
    ctx.quadraticCurveTo(r * 0.5, r * 1.06, 0, r * 0.9);
    ctx.quadraticCurveTo(-r * 0.5, r * 1.06, -r, r * 0.66);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.save();                                            // 안에서 오르내리는 기포
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 4; i++) {
      const by = r * 0.7 - ((t * 26 + i * 33) % (r * 1.7));
      ctx.beginPath();
      ctx.arc(Math.sin(t * 2 + i * 2) * r * 0.4, by, r * (0.06 + (i % 2) * 0.04), 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = "#0b1020";                              // 눈 셋
    for (const [ex, ey, er] of [[-r * 0.36, -r * 0.06, 0.15], [0, -r * 0.24, 0.12], [r * 0.36, -r * 0.06, 0.15]]) {
      ctx.beginPath(); ctx.ellipse(ex, ey, r * er, r * er * 1.25, 0, 0, TAU); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.9)";
    for (const [ex, ey] of [[-r * 0.39, -r * 0.11], [-r * 0.03, -r * 0.28], [r * 0.33, -r * 0.11]]) {
      ctx.beginPath(); ctx.arc(ex, ey, r * 0.045, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = "#0b1020"; ctx.lineWidth = 2;         // 작은 입
    ctx.beginPath(); ctx.arc(0, r * 0.3, r * 0.16, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();

  } else {
    /* ── 그레이 : 물방울 머리 + 촉수 팔 ── */
    ctx.translate(e.x, e.y + Math.sin(t * 2.2) * 3);
    ctx.rotate(Math.sin(t * 1.1) * 0.08);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }

    ctx.save();                                            // 텔레파시 오라
    ctx.globalAlpha = 0.2 + Math.sin(t * 4) * 0.06;
    ctx.strokeStyle = sk.glow; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, -r * 0.1, r * 1.1, r * 0.5, 0, 0, TAU); ctx.stroke();
    ctx.restore();

    antenna(r, -1, sk.glow, 0.42);
    antenna(r, 1, sk.glow, 0.36);

    ctx.strokeStyle = sk.skin2; ctx.lineWidth = Math.max(2, r * 0.11);   // 촉수 팔
    ctx.lineCap = "round";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.3, r * 0.4);
      ctx.quadraticCurveTo(s * r * 0.8, r * 0.6 + Math.sin(t * 4 + s) * r * 0.12,
                           s * r * 0.62, r * 1.02);
      ctx.stroke();
    }

    const bg2 = ctx.createLinearGradient(0, r * 0.1, 0, r * 0.8);       // 작은 몸통
    bg2.addColorStop(0, sk.skin); bg2.addColorStop(1, sk.skin2);
    ctx.fillStyle = bg2; ctx.strokeStyle = sk.line; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, r * 0.5, r * 0.34, r * 0.38, 0, 0, TAU); ctx.fill(); ctx.stroke();

    const hg = ctx.createRadialGradient(-r * 0.2, -r * 0.45, r * 0.06, 0, -r * 0.2, r * 0.9);
    hg.addColorStop(0, "#ffffff"); hg.addColorStop(0.35, sk.skin); hg.addColorStop(1, sk.skin2);
    ctx.fillStyle = hg;                                     // 물방울 머리 (위가 넓다)
    ctx.beginPath();
    ctx.moveTo(0, r * 0.42);
    ctx.bezierCurveTo(-r * 0.92, r * 0.16, -r * 0.86, -r * 0.86, 0, -r * 0.86);
    ctx.bezierCurveTo(r * 0.86, -r * 0.86, r * 0.92, r * 0.16, 0, r * 0.42);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;

    alienEyes(r, 0.62, 0.24, 0.3, -r * 0.16);
    ctx.strokeStyle = "#2a3a22"; ctx.lineWidth = 2;          // 가느다란 입
    ctx.beginPath(); ctx.moveTo(-r * 0.12, r * 0.2); ctx.lineTo(r * 0.12, r * 0.2); ctx.stroke();
  }
}

function drawEnemy(e) {
  if (e.boss) { drawBoss(e); return; }
  const flapA = Math.sin(e.flap || 0);
  ctx.save();

  /* 세대(TIER)에 따라 완전히 다른 그림을 쓴다 — 새끼 로봇만 예외(보스 세트) */
  const tier = e.type === "botling" ? 0 : (e.tier | 0);
  if (tier === 1) {
    drawEnemyT1(e, flapA);
  } else if (tier === 2) {
    drawEnemyT2(e, flapA);
  } else if (tier === 3) {
    drawEnemyT3(e, flapA);
  } else if (e.type === "bird" || e.elite) {
    /* ── 새 : 날개를 퍼덕이며 내려온다 ──
     * 날갯짓에 맞춰 몸이 살짝 위아래로 뜨고, 머리 깃털이 뒤로 흩날린다. */
    const lift = flapA * e.r * 0.09;
    ctx.translate(e.x, e.y + lift);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }
    const skin = e.skin || BIRD_SKINS[0];
    const r = e.r;

    drawWing(r, -1, -0.15 - flapA * 0.85, skin);     // 날개는 몸통 뒤에
    drawWing(r,  1, -0.15 - flapA * 0.85, skin);

    ctx.fillStyle = skin.wing;                       // 꼬리 깃
    ctx.beginPath();
    ctx.moveTo(-r * 0.26, -r * 0.5);
    ctx.lineTo(0, -r * 1.02 - flapA * r * 0.06);
    ctx.lineTo(r * 0.26, -r * 0.5);
    ctx.closePath(); ctx.fill();

    const g = ctx.createLinearGradient(0, -r, 0, r); // 몸통
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.35, skin.body);
    g.addColorStop(1, skin.body2);
    ctx.fillStyle = g;
    ctx.strokeStyle = skin.wing; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.8, r * 0.88, 0, 0, TAU); ctx.fill(); ctx.stroke();

    ctx.fillStyle = "rgba(255,255,255,.75)";         // 배
    ctx.beginPath(); ctx.ellipse(0, r * 0.28, r * 0.45, r * 0.42, 0, 0, TAU); ctx.fill();

    ctx.fillStyle = skin.beak;                       // 부리 (아래를 향한다)
    ctx.strokeStyle = "#d98a20"; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.2, r * 0.24);
    ctx.lineTo(0, r * 0.62);
    ctx.lineTo(r * 0.2, r * 0.24);
    ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.shadowBlur = 0;
    const eo = r * 0.3;                              // 눈 · 볼
    ctx.fillStyle = "#3d3145";
    ctx.beginPath(); ctx.arc(-eo, -r * 0.1, r * 0.15, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( eo, -r * 0.1, r * 0.15, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-eo + r * 0.05, -r * 0.15, r * 0.055, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( eo + r * 0.05, -r * 0.15, r * 0.055, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,140,170,.45)";
    ctx.beginPath(); ctx.ellipse(-eo * 1.7, r * 0.1, r * 0.16, r * 0.1, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( eo * 1.7, r * 0.1, r * 0.16, r * 0.1, 0, 0, TAU); ctx.fill();

    if (e.elite) {                                   // 보스는 왕관과 성난 눈썹
      ctx.fillStyle = "#ffd76a"; ctx.strokeStyle = "#d9a52c"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.46, -r * 0.62);
      ctx.lineTo(-r * 0.3, -r * 0.98); ctx.lineTo(-r * 0.1, -r * 0.7);
      ctx.lineTo(0, -r * 1.06); ctx.lineTo(r * 0.1, -r * 0.7);
      ctx.lineTo(r * 0.3, -r * 0.98); ctx.lineTo(r * 0.46, -r * 0.62);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#3d3145"; ctx.lineWidth = 3.4;
      ctx.beginPath();
      ctx.moveTo(-eo * 1.55, -r * 0.36); ctx.lineTo(-eo * 0.5, -r * 0.22);
      ctx.moveTo( eo * 1.55, -r * 0.36); ctx.lineTo( eo * 0.5, -r * 0.22);
      ctx.stroke();
    }

  } else if (e.type === "botling") {
    /* ── 새끼 로봇 드론 : 보스와 같은 계열의 작고 귀여운 기체 ── */
    const r = e.r, t = Game.timer;
    ctx.translate(e.x, e.y + Math.sin(e.flap * 0.6) * 2);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 16 * e.hurt; }

    ctx.globalAlpha = 0.4;                            // 프로펠러
    ctx.fillStyle = "#dbe6f5";
    ctx.beginPath();
    ctx.ellipse(0, -r * 1.1, r * (0.5 + Math.abs(Math.cos(t * 22)) * 0.9), r * 0.12, 0, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#5d6d90";
    rrect(ctx, -r * 0.12, -r * 1.16, r * 0.24, r * 0.4, r * 0.1); ctx.fill();

    const g = ctx.createLinearGradient(0, -r, 0, r);  // 둥근 장갑 몸체
    g.addColorStop(0, "#c3d2ea"); g.addColorStop(0.5, "#8fa3c4"); g.addColorStop(1, "#5d6d90");
    ctx.fillStyle = g;
    ctx.strokeStyle = "#39445e"; ctx.lineWidth = 2;
    rrect(ctx, -r * 0.86, -r * 0.78, r * 1.72, r * 1.6, r * 0.55);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#1b2233";                        // 외눈 바이저
    rrect(ctx, -r * 0.62, -r * 0.34, r * 1.24, r * 0.62, r * 0.3); ctx.fill();
    ctx.save();
    ctx.shadowColor = "#ff5c6c"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#ff8a96";
    ctx.beginPath();
    ctx.ellipse(Math.sin(t * 2 + e.wob) * r * 0.18, -r * 0.03, r * 0.22, r * 0.18, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "rgba(255,255,255,.55)";          // 하이라이트
    ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.55, r * 0.24, r * 0.14, -0.5, 0, TAU); ctx.fill();

    ctx.fillStyle = "#46527a";                        // 작은 팔 · 발
    rrect(ctx, -r * 1.06, -r * 0.14, r * 0.24, r * 0.5, r * 0.1); ctx.fill();
    rrect(ctx, r * 0.82, -r * 0.14, r * 0.24, r * 0.5, r * 0.1); ctx.fill();
    ctx.fillStyle = "#ffd76a";                        // 아래쪽 추진 불빛
    ctx.beginPath();
    ctx.ellipse(0, r * 0.9, r * 0.3, r * 0.16 * (1 + Math.sin(t * 18) * 0.4), 0, 0, TAU);
    ctx.fill();

  } else if (e.type === "slime") {
    /* ── 슬라임 : 젤리처럼 눌렸다 펴졌다 ── */
    const sq = 1 + Math.sin(e.flap * 0.7) * 0.14;
    ctx.translate(e.x, e.y + e.r * (1 - 1 / sq) * 0.5);
    ctx.scale(1 / sq, sq);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }
    const r = e.r;
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, "#d6f8cd"); g.addColorStop(1, "#63c268");
    ctx.fillStyle = g; ctx.strokeStyle = "#4b9e52"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r, r * 0.72);
    ctx.quadraticCurveTo(-r * 1.06, -r * 0.98, 0, -r * 0.98);
    ctx.quadraticCurveTo(r * 1.06, -r * 0.98, r, r * 0.72);
    ctx.quadraticCurveTo(0, r * 1.08, -r, r * 0.72);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.6)";          // 반짝임
    ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.22, r * 0.14, -0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#3d3145";
    ctx.beginPath(); ctx.arc(-r * 0.32, -r * 0.08, r * 0.15, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( r * 0.32, -r * 0.08, r * 0.15, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#3d3145"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();

  } else {
    /* ── 유령 : 몸을 좌우로 기울이며 아랫자락이 물결친다 ── */
    ctx.translate(e.x, e.y + Math.sin(e.wob * 1.6) * 3);
    ctx.rotate(Math.sin(e.wob * 0.9) * 0.14);
    if (e.hurt > 0) { ctx.shadowColor = "#ffffff"; ctx.shadowBlur = 18 * e.hurt; }
    const r = e.r;
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, "#ffffff"); g.addColorStop(1, "#d9c9ff");
    ctx.fillStyle = g; ctx.strokeStyle = "#a992d6"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -r * 0.1, r * 0.95, Math.PI, 0);
    const w = r * 0.95, tips = 4;
    for (let i = 0; i <= tips; i++) {
      const px = w - (2 * w) * (i / tips);
      const py = r * 0.75 + (i % 2 ? -r * 0.2 : r * 0.14)
               + Math.sin(e.flap * 0.9 + i * 1.1) * r * 0.14;   // 자락이 살아 움직인다
      ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#3d3145";
    ctx.beginPath(); ctx.arc(-r * 0.34, -r * 0.12, r * 0.16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc( r * 0.34, -r * 0.12, r * 0.16, 0, TAU); ctx.fill();
    ctx.fillStyle = "rgba(255,140,170,.45)";
    ctx.beginPath(); ctx.ellipse(-r * 0.55, r * 0.16, r * 0.16, r * 0.1, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse( r * 0.55, r * 0.16, r * 0.16, r * 0.1, 0, 0, TAU); ctx.fill();
  }

  ctx.restore();

  if (!e.boss && (e.hp < e.maxHp || e.elite)) {          // 체력 바 (보스는 상단 바 사용)
    const w = e.r * 1.8, hpr = clamp(e.hp / e.maxHp, 0, 1);
    ctx.fillStyle = "rgba(0,0,0,.35)";
    rrect(ctx, e.x - w / 2, e.y - e.r - 12, w, 5, 2.5); ctx.fill();
    ctx.fillStyle = hpr > 0.5 ? "#7ef0a0" : hpr > 0.25 ? "#ffd76a" : "#ff7a90";
    rrect(ctx, e.x - w / 2, e.y - e.r - 12, w * hpr, 5, 2.5); ctx.fill();
  }
}

/* ── 아이템 ────────────────────────────────────────────────────────────── */
function drawDrop(d) {
  const bob = Math.sin(d.t * 7) * 2.5;
  const x = d.x, y = d.y + bob;
  ctx.save();
  ctx.translate(x, y);
  /* 낙하 속도가 붙을수록 세로로 살짝 늘어난다 — 가속이 눈에 보이게 하는 장치 */
  const st = clamp((d.vy || 0) / 340, 0, 1) * 0.22;
  if (st > 0.01) ctx.scale(1 - st * 0.5, 1 + st);
  if (d.type === "gold") {
    ctx.shadowColor = "rgba(255,200,80,.8)"; ctx.shadowBlur = 10;
    const g = ctx.createLinearGradient(0, -11, 0, 11);
    g.addColorStop(0, "#fff2c0"); g.addColorStop(0.5, "#ffd76a"); g.addColorStop(1, "#e0a52c");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 11, 0, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.75)";             // 코인 위 발바닥 각인
    ctx.beginPath(); ctx.ellipse(0, 2, 3.6, 3, 0, 0, TAU); ctx.fill();
    for (const [dx, dy] of [[-3.6, -2.6], [-1.2, -4.4], [1.2, -4.4], [3.6, -2.6]])
      { ctx.beginPath(); ctx.arc(dx, dy, 1.5, 0, TAU); ctx.fill(); }
  } else if (d.type === "weapon") {                   // 무기 강화 배지
    ctx.shadowColor = "rgba(255,140,190,.9)"; ctx.shadowBlur = 12;
    const g = ctx.createLinearGradient(0, -12, 0, 12);
    g.addColorStop(0, "#ffd1e6"); g.addColorStop(1, "#ff6fa8");
    ctx.fillStyle = g;
    rrect(ctx, -12, -12, 24, 24, 8); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";                        // 위로 향한 화살표 두 겹
    ctx.beginPath();
    ctx.moveTo(0, -8); ctx.lineTo(7, 0); ctx.lineTo(3, 0);
    ctx.lineTo(3, 4); ctx.lineTo(-3, 4); ctx.lineTo(-3, 0); ctx.lineTo(-7, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-5, 6, 10, 2.6);
  } else if (d.type === "magnet") {
    ctx.fillStyle = "rgba(120,190,255,.25)";
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#7ec8f5"; ctx.lineWidth = 4.5; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.arc(0, 1, 6, Math.PI, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, 1); ctx.lineTo(-6, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 1); ctx.lineTo(6, 7); ctx.stroke();
    ctx.strokeStyle = "#ff7a90";
    ctx.beginPath(); ctx.moveTo(-6, 5); ctx.lineTo(-6, 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, 5); ctx.lineTo(6, 9); ctx.stroke();
  } else {
    ctx.fillStyle = "rgba(140,240,200,.3)";
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#68e6b0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.beginPath(); ctx.ellipse(-3.5, -4, 3, 2, -0.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ── 파티클 (고양이=하트 / 강아지=별) ─────────────────────────────────── */
function heartPath(g, s) {
  g.beginPath();
  g.moveTo(0, s * 0.34);
  g.bezierCurveTo(-s * 1.1, -s * 0.5, -s * 0.32, -s * 1.1, 0, -s * 0.36);
  g.bezierCurveTo(s * 0.32, -s * 1.1, s * 1.1, -s * 0.5, 0, s * 0.34);
  g.closePath();
}
function starPath(g, s) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? s * 0.45 : s, a = (i / 10) * TAU - Math.PI / 2;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
}
function drawParticles() {
  for (const s of Game.parts) {
    ctx.save();
    ctx.globalAlpha = clamp(s.life * 1.7, 0, 1);
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    if (s.kind === "blast") {                     // 미사일 착탄 링
      const k = 1 - s.life / 0.34;
      ctx.strokeStyle = "rgba(255,243,201,.9)";
      ctx.lineWidth = 6 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(0, 0, (s.size || 66) * (0.25 + k * 0.85), 0, TAU); ctx.stroke();
      ctx.restore();
      continue;
    }
    ctx.fillStyle = s.color;
    if (s.kind === "spark") {                     // 전기 스파크 : 가늘고 뾰족한 4갈래
      ctx.shadowColor = s.color; ctx.shadowBlur = 14;
      const r = s.size, w = s.size * 0.36;               // 갈래를 두툼하게
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.lineTo(w, -w); ctx.lineTo(r, 0); ctx.lineTo(w, w);
      ctx.lineTo(0, r); ctx.lineTo(-w, w); ctx.lineTo(-r, 0); ctx.lineTo(-w, -w);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(0, 0, w * 1.1, 0, TAU); ctx.fill();
      ctx.restore();
      continue;
    }
    if (s.kind === "heart") heartPath(ctx, s.size); else starPath(ctx, s.size);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  for (const q of Game.pops) {
    ctx.globalAlpha = clamp(q.life * 1.4, 0, 1);
    text(q.str, q.x, q.y, 14, q.color, "center");
    ctx.globalAlpha = 1;
  }
}

/* ── 스테이지 / 러시 / 보스 배너 ─────────────────────────────────────── */
function drawBanners() {

    ctx.font = "800 15px " + FONT;
    ctx.fillStyle = "#ff8a7a";

    ctx.fillStyle = "#ff7a90";

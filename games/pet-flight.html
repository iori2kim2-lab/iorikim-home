}

/* ── 보스 체력바 ──────────────────────────────────────────────────────── */
/* ── 급강하 낙하 지점 예고 ──────────────────────────────────────────────
 * 세 가지를 동시에 알려 준다.
 *   어디로  : 바닥의 타원 마커 (실제 피격 폭과 같은 크기)
 *   언제    : 마커 위로 조여드는 링 + 점점 붉어지는 색
 *   무엇이  : 보스에서 마커까지 이어지는 위험 기둥 (줄무늬가 아래로 흐른다) */
function drawDiveWarn() {
  const b = Game.boss;
  if (!b || (b.phase !== "warn" && b.phase !== "dive")) return;
  const warn = b.phase === "warn";
  const k = warn ? clamp(b.pt / BOSS_WARN, 0, 1) : 1;
  const fade = warn ? 1 : clamp(1 - b.pt / 0.42, 0, 1) * 0.7;
  const x = b.diveX, y = BOSS_DIVE_Y;
  const RX = 96, RY = 26;                              // 실제 피격 반경과 같은 폭
  const blink = 0.55 + Math.abs(Math.sin(b.pt * (8 + k * 16))) * 0.45;

  ctx.save();
  ctx.globalAlpha = fade;

  /* 위험 기둥 — 보스 아래에서 마커까지 */
  const colTop = b.y + b.r * 0.4;
  if (y > colTop) {
    const g = ctx.createLinearGradient(0, colTop, 0, y);
    g.addColorStop(0, "rgba(255,70,90,0)");
    g.addColorStop(1, "rgba(255,70,90," + (0.16 + k * 0.16).toFixed(3) + ")");
    ctx.fillStyle = g;
    ctx.fillRect(x - RX, colTop, RX * 2, y - colTop);

    ctx.save();                                        // 아래로 흐르는 줄무늬
    ctx.beginPath(); ctx.rect(x - RX, colTop, RX * 2, y - colTop); ctx.clip();
    ctx.globalAlpha = fade * 0.22;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 9;
    const off = (Game.timer * 220) % 56;
    for (let sy = colTop - RX * 2; sy < y + 56; sy += 56) {
      ctx.beginPath();
      ctx.moveTo(x - RX - 30, sy + off);
      ctx.lineTo(x + RX + 30, sy + off - (RX * 2 + 60));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* 바닥 마커 */
  ctx.globalAlpha = fade * (0.28 + k * 0.34);
  ctx.fillStyle = "#ff3b57";
  ctx.beginPath(); ctx.ellipse(x, y, RX, RY, 0, 0, TAU); ctx.fill();

  ctx.globalAlpha = fade * blink;
  ctx.strokeStyle = "#ff5c72"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(x, y, RX, RY, 0, 0, TAU); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, RX - 7, RY - 5, 0, 0, TAU); ctx.stroke();

  /* 조여드는 링 — 링이 마커에 닿는 순간이 착지 시각 */
  if (warn) {
    ctx.globalAlpha = fade * 0.9;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3.5;
    const t = 1 + (1 - k) * 1.9;
    ctx.beginPath(); ctx.ellipse(x, y, RX * t, RY * t, 0, 0, TAU); ctx.stroke();
  }

  /* 십자 조준선 + 경고 표시 */
  ctx.globalAlpha = fade * blink;
  ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - RX * 0.5, y); ctx.lineTo(x + RX * 0.5, y);
  ctx.moveTo(x, y - RY * 0.55); ctx.lineTo(x, y + RY * 0.55);
  ctx.stroke();

  if (warn) {
    ctx.globalAlpha = fade * blink;
    ctx.font = "900 38px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 5;   // 흰 테 + 붉은 속
    ctx.strokeText("!", x, y - RY - 26);
    ctx.fillStyle = "#ff3b57";
    ctx.fillText("!", x, y - RY - 26);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBossBar() {
  const b = Game.boss;
  if (!b) return;
  const ratio = clamp(b.hp / b.maxHp, 0, 1);
  const w = CW - 44, x = 22, y = 138;
  ctx.fillStyle = "rgba(20,45,75,.5)";
  rrect(ctx, x - 4, y - 16, w + 8, 30, 12); ctx.fill();
  text("BOSS", x, y - 4, 11, "#ff9ec4", "left", 800);
  text(Math.ceil(b.hp) + " / " + b.maxHp, x + w, y - 4, 11, "rgba(255,255,255,.8)", "right", 700);
  ctx.fillStyle = "rgba(255,255,255,.22)";
  rrect(ctx, x, y + 3, w, 8, 4); ctx.fill();
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, "#ff7a90"); g.addColorStop(1, "#ffd76a");
  ctx.fillStyle = g;
  rrect(ctx, x, y + 3, Math.max(4, w * ratio), 8, 4); ctx.fill();
  if (Game.bossT > BOSS_TIMEOUT - 8) {                 // 도망까지 남은 시간 경고
    ctx.globalAlpha = 0.5 + Math.abs(Math.sin(Game.timer * 6)) * 0.5;
    text("곧 달아납니다!", CW / 2, y + 26, 11, "#ffd76a", "center", 800);
    ctx.globalAlpha = 1;
  }
}

/* ── 피버 레이저 ──────────────────────────────────────────────────────── */
/* 커다란 뼈다귀 윤곽 — 가운데 기둥 + 네 귀퉁이 마디.
 * 여러 조각이 겹친 도형이라 "선을 먼저 긋고 면을 나중에" 칠해야
 * 조각끼리 만나는 안쪽 경계선이 면에 덮여 하나의 실루엣으로 보인다. */
function bonePath(g, s) {
  g.beginPath();
  g.moveTo(-s * 0.26, -s * 0.66);
  g.lineTo(s * 0.26, -s * 0.66);
  g.lineTo(s * 0.26, s * 0.66);
  g.lineTo(-s * 0.26, s * 0.66);
  g.closePath();
  for (const sy of [-1, 1])
    for (const sx of [-1, 1]) {
      g.moveTo(sx * s * 0.40 + s * 0.32, sy * s * 0.70);
      g.arc(sx * s * 0.40, sy * s * 0.70, s * 0.32, 0, TAU);
    }
}

/* 피버 관통탄 한 발 */
function drawFeverShot(f, cat) {
  const pulse = 1 + Math.sin(f.t * 9 + f.wob) * (cat ? 0.09 : 0.04);   // 하트는 두근두근
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(cat ? Math.sin(f.t * 3 + f.wob) * 0.12 : f.spin);
  ctx.scale(pulse, cat ? 2 - pulse : pulse);

  const glowCol = cat ? "255,110,180" : "255,190,70";
  ctx.save();                                        // 바깥 후광
  ctx.globalAlpha = 0.35;
  const gg = ctx.createRadialGradient(0, 0, f.r * 0.4, 0, 0, f.r * 1.55);
  gg.addColorStop(0, "rgba(" + glowCol + ",.85)");
  gg.addColorStop(1, "rgba(" + glowCol + ",0)");
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(0, 0, f.r * 1.55, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.shadowColor = "rgba(" + glowCol + ",.95)"; ctx.shadowBlur = 34;
  ctx.lineJoin = "round";

  if (cat) {
    const s = f.r * 0.96;
    heartPath(ctx, s);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 15;  // 뼈다귀와 같은 굵기의 흰 테
    ctx.stroke();
    ctx.shadowBlur = 0;
    const g = ctx.createLinearGradient(0, -s, 0, s * 0.4);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.35, "#ff9ec4"); g.addColorStop(1, "#ff4d86");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.75)";         // 광택
    ctx.beginPath();
    ctx.ellipse(-s * 0.34, -s * 0.44, s * 0.20, s * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    const s = f.r * 1.0;
    bonePath(ctx, s);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 15;  // 실루엣 테두리를 먼저
    ctx.stroke();
    ctx.shadowBlur = 0;
    const g = ctx.createLinearGradient(-s * 0.6, -s, s * 0.6, s);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.45, "#ffeeb4"); g.addColorStop(1, "#efa524");
    ctx.fillStyle = g;
    ctx.fill();                                       // 면이 안쪽 경계선을 덮는다
    ctx.fillStyle = "rgba(255,255,255,.55)";          // 기둥 위 하이라이트
    rrect(ctx, -s * 0.13, -s * 0.42, s * 0.11, s * 0.84, s * 0.06); ctx.fill();
  }
  ctx.restore();
}

function drawFeverFx() {
  const cat = Game.pet.key === "cat";
  for (const f of Game.feverShots) drawFeverShot(f, cat);
  if (Game.feverT <= 0 && Game.feverBanner <= 0) return;

  const k = Game.feverT / FEVER_TIME;
  const fade = clamp(k < 0.15 ? k / 0.15 : 1, 0, 1);   // 끝날 때 부드럽게 사라진다
  ctx.fillStyle = (cat ? "rgba(255,190,220," : "rgba(255,232,170,") + (0.13 * fade).toFixed(3) + ")";
  ctx.fillRect(0, 0, CW, CH);

  if (Game.feverBanner > 0) {                          // 진입 배너
    ctx.save();
    ctx.globalAlpha = clamp(Game.feverBanner * 1.3, 0, 1);
    ctx.translate(CW / 2, CH * 0.32);
    ctx.rotate(Math.sin(Game.timer * 13) * 0.03);
    ctx.font = "800 40px " + FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 7;
    ctx.strokeText("FEVER TIME!", 0, 0);
    const bg = ctx.createLinearGradient(-130, 0, 130, 0);
    bg.addColorStop(0, "#ff6f9c"); bg.addColorStop(0.5, "#ffd23f"); bg.addColorStop(1, "#7ec8f5");
    ctx.fillStyle = bg;
    ctx.fillText("FEVER TIME!", 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ── 필살기 충격파 이펙트 ─────────────────────────────────────────────── */
function drawUltFx() {
  if (Game.ultT <= 0) return;
  const p = Game.player, r = Game.ultR;
  const k = 1 - Game.ultT / ULT_TIME;
  const pet = Game.pet;

  ctx.save();
  ctx.globalAlpha = (1 - k) * 0.85;
  const g = ctx.createRadialGradient(p.x, p.y, Math.max(1, r * 0.55), p.x, p.y, r);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(0.82, pet.key === "cat" ? "rgba(255,150,200,.5)" : "rgba(255,215,110,.5)");
  g.addColorStop(1, "rgba(255,255,255,.95)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,.95)";
  ctx.lineWidth = 7 * (1 - k) + 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.stroke();

  // 충격파 테두리를 따라 하트(고양이) / 별(강아지)이 돌며 퍼진다
  const n = 14;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * TAU + Game.timer * 2.2;
    ctx.save();
    ctx.translate(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r);
    ctx.rotate(a + Game.timer * 3);
    ctx.fillStyle = pet.pcolor[i % pet.pcolor.length];
    if (pet.particle === "heart") heartPath(ctx, 11); else starPath(ctx, 11);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  ctx.fillStyle = "rgba(255,255,255," + ((1 - k) * 0.3).toFixed(3) + ")";
  ctx.fillRect(0, 0, CW, CH);
}

/* ── 필살기 버튼 ──────────────────────────────────────────────────────── */
/* 개발용 구석 힌트 — 아주 흐릿한 점 하나. 누르면 진행 개수가 잠깐 보인다. */
function drawDevCorner() {
  const active = Game.timer - (Game.devTapT || -9) < DEV_WINDOW;
  ctx.save();
  ctx.globalAlpha = active ? 0.5 : 0.13;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(CW - 22, CH - 22, active ? 7 : 4.5, 0, TAU); ctx.fill();
  if (active) {
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CW - 22, CH - 22, 14, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

function drawUltButton() {
  const b = ULT_BTN, ratio = clamp(Game.ult / ULT_NEED, 0, 1), ready = ultReady();
  const pulse = ready ? 1 + Math.sin(Game.timer * 7) * 0.06 : 1;

  ctx.save();
  ctx.translate(b.cx, b.cy);
  ctx.scale(pulse, pulse);

  ctx.fillStyle = "rgba(20,45,75,.5)";
  ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();

  ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, 0, b.r - 4, 0, TAU); ctx.stroke();

  ctx.strokeStyle = ready ? "#ffd76a" : (Game.pet.body2 || "#ff9ec4");
  ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(0, 0, b.r - 4, -Math.PI / 2, -Math.PI / 2 + TAU * ratio);
  ctx.stroke();

  if (ready) {                                     // 준비 완료 시 빛난다
    ctx.shadowColor = "#ffd76a"; ctx.shadowBlur = 18;
    ctx.fillStyle = "#ffd76a";
  } else ctx.fillStyle = "rgba(255,255,255,.55)";

  if (Game.pet.particle === "heart") heartPath(ctx, 13); else starPath(ctx, 13);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  if (ready) {
    ctx.globalAlpha = 0.6 + Math.abs(Math.sin(Game.timer * 5)) * 0.4;
    text("필살기!", b.cx, b.cy - b.r - 14, 12, "#ffd76a", "center");
    ctx.globalAlpha = 1;
  } else {
    // 퍼센트는 버튼 위쪽에 (아래에 두면 화면 끝에 잘린다)
    text(Math.floor(ratio * 100) + "%", b.cx, b.cy - b.r - 13, 11, "rgba(255,255,255,.8)", "center", 700);
  }
}

/* ── HUD ───────────────────────────────────────────────────────────────── */
function drawHUD() {
  ctx.fillStyle = "rgba(20,45,75,.42)";
  rrect(ctx, 8, 8, CW - 16, 58, 16); ctx.fill();

  text("SCORE", 22, 24, 10, "rgba(255,255,255,.75)", "left");
  text(String(Game.score).padStart(6, "0"), 22, 45, 22, "#ffffff", "left");

  text("GOLD", CW / 2 + 6, 24, 10, "rgba(255,255,255,.75)", "center");
  text(String(Game.gold), CW / 2 + 6, 45, 20, "#ffd76a", "center");

  text("STAGE", CW - 22, 24, 10, "rgba(255,255,255,.75)", "right");
  text(String(Game.stage), CW - 22, 45, 22, "#a7f0c6", "right");

  // 다음 스테이지까지의 비행 거리
  const prog = (Game.distance % STAGE_DIST) / STAGE_DIST;
  ctx.fillStyle = "rgba(255,255,255,.18)";
  rrect(ctx, 16, 70, CW - 32, 3.5, 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.75)";
  rrect(ctx, 16, 70, (CW - 32) * prog, 3.5, 2); ctx.fill();
  text(Math.floor(Game.distance) + " m", CW - 22, 88, 11, "rgba(255,255,255,.85)", "right", 700);

  // 피버 게이지 — 골드로 차오르고, 가득 차면 자동 발동
  const fr = Game.feverT > 0 ? Game.feverT / FEVER_TIME : clamp(Game.fever, 0, 1);
  const active = Game.feverT > 0;
  ctx.fillStyle = "rgba(255,255,255,.18)";
  rrect(ctx, 16, 104, CW - 32, 7, 3.5); ctx.fill();
  if (fr > 0.001) {
    const fg = ctx.createLinearGradient(16, 0, CW - 16, 0);
    if (active) {
      const sh = (Game.timer * 200) % 360;
      for (let i = 0; i <= 5; i++) fg.addColorStop(i / 5, "hsl(" + ((sh + i * 60) % 360) + ",95%,65%)");
    } else { fg.addColorStop(0, "#ffd1e6"); fg.addColorStop(1, "#ff6f9c"); }
    ctx.fillStyle = fg;
    rrect(ctx, 16, 104, Math.max(7, (CW - 32) * fr), 7, 3.5); ctx.fill();
  }
  ctx.globalAlpha = active ? 0.75 + Math.abs(Math.sin(Game.timer * 10)) * 0.25 : 0.9;
  text(active ? "FEVER!  " + Game.feverT.toFixed(1) + "s"
              : "FEVER  " + Math.floor(fr * 100) + "%",
       CW / 2, 107.5, 9, active ? "#ffffff" : "#ffb9d4", "center", 800);
  ctx.globalAlpha = 1;

  const p = Game.player;
  if (p) {
    /* 상태 줄: 무기 레벨 → 실드 → 자석 순으로 왼쪽부터 흘려 배치한다.
     * (처음엔 HUD 한가운데에 뒀더니 GOLD 숫자와 겹쳐 읽기 어려웠다) */
    const st = fireStats();
    text("LV." + st.lv, 22, 89, 12, "#ff9ec4", "left", 800);
    for (let i = 0; i < MAX_WLV; i++) {
      ctx.fillStyle = i < st.lv ? "#ff8fbc" : "rgba(255,255,255,.3)";
      ctx.beginPath(); ctx.arc(60 + i * 10, 89, 3.1, 0, TAU); ctx.fill();
    }
    let bx = 118;
    const dsp = droneSpec();
    if (dsp) {                                        // 드론 형태와 랭크
      const col = DRONE_COLORS[dsp.form];
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(bx + 7, 88, 5.5, 0, TAU); ctx.fill();
      text(dsp.name, bx + 17, 89, 11, col, "left", 800);
      text("★".repeat(dsp.rank) + "☆".repeat(3 - dsp.rank), bx + 17 + 46, 89, 9, col, "left", 800);
      bx += 108;
    }
    if (p.shield > 0) {
      const low = p.shieldT < SHIELD_WARN;
      ctx.save();
      if (low) ctx.globalAlpha = 0.35 + Math.abs(Math.sin(Game.timer * 12)) * 0.65;
      ctx.strokeStyle = low ? "#ffd76a" : "#68e6b0"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.arc(bx + 8, 88, 8, 0, TAU); ctx.stroke();
      text("x" + p.shield + "  " + p.shieldT.toFixed(1) + "s", bx + 20, 89, 12,
           low ? "#ffd76a" : "#68e6b0", "left", 700);
      ctx.restore();
      bx += 86;
    }
    if (p.rapidT > 0) {                                 // 연사 강화 남은 시간
      ctx.save();
      ctx.globalAlpha = 0.55 + Math.abs(Math.sin(Game.timer * 9)) * 0.45;
      ctx.fillStyle = "#ffd76a";
      ctx.beginPath();                                  // 번개 아이콘
      ctx.moveTo(bx + 10, 80); ctx.lineTo(bx + 3, 90); ctx.lineTo(bx + 8, 90);
      ctx.lineTo(bx + 5, 97); ctx.lineTo(bx + 14, 86); ctx.lineTo(bx + 9, 86);
      ctx.closePath(); ctx.fill();
      text("x1.5  " + p.rapidT.toFixed(1) + "s", bx + 18, 89, 12, "#ffd76a", "left", 800);
      ctx.restore();
      bx += 90;
    }
    if (p.magnet > 0) {
      ctx.strokeStyle = "#7ec8f5"; ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.arc(bx + 8, 88, 6, Math.PI, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx + 2, 88); ctx.lineTo(bx + 2, 94); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx + 14, 88); ctx.lineTo(bx + 14, 94); ctx.stroke();
      text(p.magnet.toFixed(1) + "s", bx + 22, 89, 12, "#7ec8f5", "left", 700);
    }
  }
}

/* ── 캐릭터 선택 화면 ──────────────────────────────────────────────────── */
/* =========================================================================
 * 타이틀 화면 — 「강아지&고양이 플라이」
 * -------------------------------------------------------------------------
 * 연출 타임라인 (titleT 기준)
 *   0.15 ~ 1.30s  고양이(왼쪽)·강아지(오른쪽)가 화면 밖에서 가운데로 날아온다
 *   0.45 ~ 1.45s  로고가 위에서 떨어져 내려와 살짝 오버슈트한 뒤 "탁" 멈춘다
 *   1.45s         착지 순간 로고가 납작해졌다 튀어오르며 별이 터진다
 *   2.0s ~        "탭하여 시작" 안내가 깜빡인다
 * ========================================================================= */
const TITLE_LINE1 = "강아지 & 고양이";
const TITLE_LINE2 = "플라이";
const titleFx = [];                                  // 떠오르는 하트·별
let titleLanded = false;

function easeOutCubic(k) { return 1 - Math.pow(1 - k, 3); }
function easeOutBack(k) {                            // 목표를 살짝 지나쳤다 되돌아온다
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
}

function updateTitle(dt) {
  Game.titleT += dt;
  const t = Game.titleT;
  if (t > 1.45 && !titleLanded) {                    // 착지 : 별 폭죽 + 진동
    titleLanded = true;
    Game.shake = 7;
    for (let i = 0; i < 26; i++) {
      const a = rand(0, TAU), sp = rand(120, 380);
      titleFx.push({ x: CW / 2 + Math.cos(a) * 60, y: 250, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
                     life: rand(0.6, 1.1), kind: Math.random() < 0.5 ? "star" : "heart",
                     size: rand(6, 12), rot: rand(0, TAU), spin: rand(-8, 8),
                     color: ["#ffd76a", "#ff9ec4", "#ffffff", "#8fd9ff"][(Math.random() * 4) | 0] });
    }
    Sound.play("bigpop");
  }
  if (t > 1.3 && Math.random() < dt * 5) {           // 두 친구 주변에서 하트·별이 떠오른다
    const side = Math.random() < 0.5 ? -1 : 1;
    titleFx.push({ x: CW / 2 + side * rand(40, 110), y: rand(470, 520), vx: rand(-20, 20), vy: rand(-90, -50),
                   life: rand(1.0, 1.6), kind: side < 0 ? "heart" : "star", size: rand(5, 9),
                   rot: rand(0, TAU), spin: rand(-4, 4), color: side < 0 ? "#ff9ec4" : "#ffd76a", float: true });
  }
  for (let i = titleFx.length - 1; i >= 0; i--) {
    const f = titleFx[i];
    f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.spin * dt;
    if (!f.float) f.vy += 520 * dt;
    if (f.life <= 0) titleFx.splice(i, 1);
  }
}

/* 통통한 외곽선 글자 — 한 글자씩 살짝 기울이고 들썩여서 "귀여운 로고"로 만든다 */
function drawBubbleText(str, cx, cy, size, fillTop, fillBot, outline, wobble) {
  ctx.save();
  ctx.font = "900 " + size + "px " + FONT;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  const chars = [...str];
  const widths = chars.map(c => ctx.measureText(c).width * (c === " " ? 0.6 : 1));
  const total = widths.reduce((a, b) => a + b, 0) + (chars.length - 1) * size * 0.04;
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const px = x + w / 2, t = Game.timer;
    const rot = (Math.sin(i * 1.7) * 0.07 + Math.sin(t * 2.2 + i) * 0.025) * wobble;
    const dy = (Math.sin(i * 2.3) * size * 0.05 + Math.sin(t * 2.6 + i * 0.8) * size * 0.03) * wobble;
    ctx.save();
    ctx.translate(px, cy + dy);
    ctx.rotate(rot);
    const g = ctx.createLinearGradient(0, -size * 0.5, 0, size * 0.5);
    g.addColorStop(0, fillTop); g.addColorStop(1, fillBot);
    ctx.strokeStyle = outline; ctx.lineWidth = size * 0.30; ctx.strokeText(c, 0, 0);   // 진한 외곽
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = size * 0.14; ctx.strokeText(c, 0, 0);  // 흰 테
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.fillStyle = "rgba(255,255,255,.55)";                                         // 위쪽 광택
    ctx.beginPath(); ctx.ellipse(-size * 0.08, -size * 0.28, size * 0.2, size * 0.07, -0.3, 0, TAU); ctx.fill();
    ctx.restore();
    x += w + size * 0.04;
  });
  ctx.restore();
}

/* 로고 전체 — 구름판 + 두 줄 글자 + 작은 날개 */
function drawLogo(cx, cy, scale, wobble) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  ctx.fillStyle = "rgba(255,255,255,.55)";           // 뒤에 깔리는 구름판
  ctx.beginPath();
  ctx.ellipse(0, 20, 178, 74, 0, 0, TAU);
  ctx.arc(-120, -14, 52, 0, TAU); ctx.arc(-40, -40, 60, 0, TAU);
  ctx.arc(50, -42, 62, 0, TAU); ctx.arc(125, -12, 50, 0, TAU);
  ctx.fill();

  /* 1줄: 강아지 = 노랑 · & = 빨강 하트색 · 고양이 = 핑크 */
  ctx.font = "900 34px " + FONT;
  const wA = ctx.measureText("강아지").width, wAmp = ctx.measureText(" & ").width, wC = ctx.measureText("고양이").width;
  const tot = wA + wAmp + wC;
  drawBubbleText("강아지", -tot / 2 + wA / 2, -30, 34, "#fff1b8", "#f7b73a", "#7a4a12", wobble);
  drawBubbleText("&",      -tot / 2 + wA + wAmp / 2, -28, 30, "#ffb3c6", "#ff4d6a", "#7a1a2c", wobble);
  drawBubbleText("고양이", -tot / 2 + wA + wAmp + wC / 2, -30, 34, "#ffe0ec", "#ff8fbc", "#8a2a55", wobble);

  /* 2줄: 플라이 = 하늘색, 크게 */
  drawBubbleText(TITLE_LINE2, 0, 34, 70, "#ffffff", "#5fb8f0", "#1f4b7a", wobble);

  for (const sgn of [-1, 1]) {                       // 양옆 작은 날개
    ctx.save();
    ctx.translate(sgn * 150, 30);
    ctx.scale(sgn, 1);
    ctx.rotate(Math.sin(Game.timer * 6) * 0.18 * wobble - 0.2);
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#8fc6ea"; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(22, -30, 48, -22);
    ctx.quadraticCurveTo(30, -12, 40, 0);
    ctx.quadraticCurveTo(24, 4, 30, 16);
    ctx.quadraticCurveTo(12, 12, 0, 10);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

function drawTitle() {
  const t = Game.titleT;
  ctx.fillStyle = "rgba(20,45,75,.28)";
  ctx.fillRect(0, 0, CW, CH);

  /* ── 두 친구의 입장 ── */
  const kIn = easeOutCubic(clamp((t - 0.15) / 1.15, 0, 1));
  const catX = -80 + (CW / 2 - 84 + 80) * kIn;
  const dogX = CW + 80 - (CW + 80 - (CW / 2 + 84)) * kIn;
  const hoverY = 500 + Math.sin(t * 2.4) * 8;
  const arrived = kIn >= 1;
  /* 날아오는 동안은 진행 방향으로 기울고, 도착하면 서로를 향해 살짝 갸웃 */
  const catTilt = arrived ? Math.sin(t * 2.4) * 0.08 + 0.12 : 0.42 * (1 - kIn) + 0.12;
  const dogTilt = arrived ? -Math.sin(t * 2.4 + 0.5) * 0.08 - 0.12 : -0.42 * (1 - kIn) - 0.12;
  const flap = t * 11;
  drawPet(PETS.cat, catX, hoverY + Math.sin(t * 2.4) * 4, 2.2, flap, catTilt, true, "happy");
  drawPet(PETS.dog, dogX, hoverY - Math.sin(t * 2.4) * 4, 2.2, flap + 1.5, dogTilt, true, "happy");

  for (const f of titleFx) {                          // 하트·별
    ctx.save();
    ctx.globalAlpha = clamp(f.life * 1.5, 0, 1);
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.fillStyle = f.color;
    if (f.kind === "heart") heartPath(ctx, f.size); else starPath(ctx, f.size);
    ctx.fill();
    ctx.restore();
  }

  /* ── 로고 낙하 ── */
  const kDrop = clamp((t - 0.45) / 1.0, 0, 1);
  const logoY = -180 + (250 + 180) * easeOutBack(kDrop);
  let sx = 1, sy = 1;
  if (kDrop >= 1) {                                   // 착지 후 납작→튕김 (감쇠 진동)
    const a = t - 1.45;
    const sq = Math.exp(-a * 5) * Math.sin(a * 22) * 0.18;
    sx = 1 + sq; sy = 1 - sq;
  } else if (kDrop > 0.75) {                          // 떨어지는 동안은 세로로 길쭉
    sy = 1 + (1 - kDrop) * 0.3; sx = 1 - (1 - kDrop) * 0.12;
  }
  const wobble = kDrop >= 1 ? 1 : 0;
  ctx.save();
  ctx.translate(CW / 2, logoY + (kDrop >= 1 ? Math.sin(t * 1.8) * 4 : 0));
  ctx.scale(sx, sy);
  drawLogo(0, 0, 1, wobble);
  ctx.restore();

  /* ── 안내 ── */
  if (t > 2.0) {
    const a = 0.5 + Math.abs(Math.sin(t * 3)) * 0.5;
    ctx.globalAlpha = a;
    text("탭하여 시작", CW / 2, 650, 20, "#ffffff", "center");
    ctx.globalAlpha = 1;
    if (Game.best.score > 0)
      text("최고 기록  " + Game.best.score.toLocaleString() + "  ·  STAGE " + Game.best.stage,
           CW / 2, 690, 13, "#ffe9a8", "center", 700);
  }
}

function drawSelect() {
  ctx.fillStyle = "rgba(20,45,75,.35)";
  ctx.fillRect(0, 0, CW, CH);

  const bob = Math.sin(Game.timer * 2) * 5;
  drawLogo(CW / 2, 140 + bob, 0.62, 1);
  text("함께 날아갈 친구를 고르세요", CW / 2, 232, 14, "#eaf6ff", "center", 700);

  for (const key of ["cat", "dog"]) {
    const c = CARDS[key], pet = PETS[key];
    const hover = Math.sin(Game.timer * 2.4 + (key === "cat" ? 0 : 1.2)) * 4;

    ctx.fillStyle = "rgba(255,255,255,.92)";
    rrect(ctx, c.x, c.y + hover, c.w, c.h, 22); ctx.fill();
    ctx.strokeStyle = pet.line; ctx.lineWidth = 3;
    rrect(ctx, c.x, c.y + hover, c.w, c.h, 22); ctx.stroke();

    drawPet(pet, c.x + c.w / 2, c.y + hover + 78, 1.55, Game.timer * 10, 0, true);

    text(pet.name, c.x + c.w / 2, c.y + hover + 142, 22, "#3d3145", "center");
    ctx.fillStyle = pet.body2;
    rrect(ctx, c.x + 26, c.y + hover + 156, c.w - 52, 22, 11); ctx.fill();
    text(pet.tag, c.x + c.w / 2, c.y + hover + 168, 12, "#ffffff", "center", 800);
    pet.desc.forEach((line, i) =>
      text(line, c.x + c.w / 2, c.y + hover + 194 + i * 17, 11.5, "#7a6a80", "center", 700));
  }

  const a = 0.55 + Math.abs(Math.sin(Game.timer * 3)) * 0.45;
  ctx.globalAlpha = a;
  text("카드를 탭하면 바로 출발!", CW / 2, 588, 17, "#ffffff", "center");
  ctx.globalAlpha = 1;

  if (Game.best.score > 0) {
    ctx.fillStyle = "rgba(20,45,75,.4)";
    rrect(ctx, CW / 2 - 118, 622, 236, 56, 16); ctx.fill();
    text("BEST", CW / 2, 640, 11, "rgba(255,255,255,.7)", "center");
    text(Game.best.score + " 점 · " + Game.best.gold + " G · STAGE " + Game.best.stage,
         CW / 2, 661, 14, "#ffd76a", "center");
  }
  text("드래그 · ← → · A D 이동   |   미사일 자동 발사", CW / 2, 706, 12, "rgba(255,255,255,.85)", "center", 700);
  text("게이지가 차면 좌하단 버튼 · Space 로 필살기!", CW / 2, 724, 12, "#ffd76a", "center", 700);
  text("골드를 모으면 FEVER — 화면을 가르는 초대형 레이저!", CW / 2, 742, 12, "#ff9ec4", "center", 700);
  text("M 음악 켜기/끄기   ·   P 일시정지", CW / 2, 762, 12, "rgba(255,255,255,.7)", "center", 700);
}

/* ── 게임 오버 / 일시정지 ──────────────────────────────────────────────── */
function drawGameOver() {
  ctx.fillStyle = "rgba(16,36,60,.72)";
  ctx.fillRect(0, 0, CW, CH);
  const x = CW / 2, y = 250;
  ctx.fillStyle = "rgba(255,255,255,.96)";
  rrect(ctx, 40, y, CW - 80, 300, 26); ctx.fill();
  ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 4;
  rrect(ctx, 40, y, CW - 80, 300, 26); ctx.stroke();

  text("GAME OVER", x, y + 52, 34, "#ff7a90", "center");

  if (Game.newRecord) {                            // 신기록 배지
    const s = 1 + Math.sin(Game.timer * 8) * 0.05;
    ctx.save();
    ctx.translate(x, y + 92); ctx.scale(s, s);
    ctx.fillStyle = "#ffd76a";
    rrect(ctx, -68, -14, 136, 28, 14); ctx.fill();
    text("NEW RECORD!", 0, 1, 15, "#7a5a10", "center");
    ctx.restore();
  } else {
    text("최고 " + (Game.best.score || 0) + "점", x, y + 92, 14, "#8c7f96", "center", 700);
  }

  const rows = [["점수", Game.score, "#3d3145"], ["골드", Game.gold + " G", "#e0a52c"],
                ["도달 스테이지", "STAGE " + Game.stage, "#3fa87a"],
                ["비행 거리", Math.floor(Game.distance) + " m", "#5a7fa8"]];
  rows.forEach(([label, value, color], i) => {
    const ry = y + 132 + i * 34;
    text(label, 76, ry, 13, "#8c7f96", "left", 700);
    text(String(value), CW - 76, ry, 17, color, "right");
  });

  ctx.globalAlpha = Game.overT > 0 ? 0.3 : 0.55 + Math.abs(Math.sin(Game.timer * 3)) * 0.45;
  text("탭 또는 Space 로 캐릭터 선택", x, y + 272, 15, "#ff6f9c", "center");
  ctx.globalAlpha = 1;
}

function drawPause() {
  ctx.fillStyle = "rgba(16,36,60,.6)";
  ctx.fillRect(0, 0, CW, CH);
  text("PAUSED", CW / 2, CH / 2 - 10, 34, "#ffffff", "center");
  text("P 키 또는 탭으로 계속하기", CW / 2, CH / 2 + 28, 14, "#dceaf7", "center", 700);
}

/* ── 메인 드로우 ───────────────────────────────────────────────────────── */
function draw(dt) {
  drawSky(dt);

  ctx.save();
  if (Game.shake > 0) ctx.translate(rand(-Game.shake, Game.shake), rand(-Game.shake, Game.shake));

  if (Game.state === "playing" || Game.state === "paused" || Game.state === "over") {
    for (const d of Game.drops) drawDrop(d);

    for (const f of Game.formations) {              // 편대 대형을 잇는 실선
      const live = f.members.filter(m => !m.dead && !m.gone);
      if (live.length < 2) continue;
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.6;
      ctx.setLineDash([5, 6]); ctx.lineDashOffset = -Game.timer * 22;
      for (const m of live) {
        ctx.beginPath(); ctx.moveTo(f.cx, f.cy); ctx.lineTo(m.x, m.y); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(f.cx, f.cy, 3.5, 0, TAU); ctx.fill();
    }

    drawDiveWarn();                                 // 낙하 예고는 적들 아래에 깔린다
    for (const e of Game.enemies) drawEnemy(e);
    for (const b of Game.bullets) drawBullet(b);
    drawBolts();

    const p = Game.player;
    if (p && Game.state !== "over") {
      if (p.inv > 0 && Math.floor(p.inv * 12) % 2 === 0) ctx.globalAlpha = 0.4;
      drawDrones();
      drawPet(Game.pet, p.x, p.y, 1, p.flap, p.tilt, true, null, Game.stage >= TIER_STAGE[3]);
      ctx.globalAlpha = 1;
      if (p.shield > 0) {                          // 실드 버블
        /* 남은 시간이 SHIELD_WARN 아래로 떨어지면 깜빡이기 시작하고,
         * 끝에 가까울수록 깜빡임이 빨라진다(1.8Hz → 9Hz). */
        const left = p.shieldT;
        let a = 1;
        if (left < SHIELD_WARN) {
          const u = clamp(left / SHIELD_WARN, 0, 1);       // 1 → 0
          const hz = 1.8 + (1 - u) * 7.2;
          a = 0.22 + (0.5 + 0.5 * Math.sin(Game.timer * TAU * hz)) * 0.78;
        }
        ctx.save();
        ctx.globalAlpha = a;
        ctx.strokeStyle = "rgba(104,230,176,.9)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y - 2, 34 + Math.sin(Game.timer * 6) * 2, 0, TAU); ctx.stroke();
        ctx.fillStyle = "rgba(104,230,176,.14)";
        ctx.beginPath(); ctx.arc(p.x, p.y - 2, 34, 0, TAU); ctx.fill();

        ctx.globalAlpha = a * 0.85;                        // 남은 시간을 도는 호로 표시
        ctx.strokeStyle = "#a7f0c6"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(p.x, p.y - 2, 39, -Math.PI / 2,
                -Math.PI / 2 + TAU * clamp(p.shieldT / SHIELD_TIME, 0, 1));
        ctx.stroke();
        ctx.restore();
      }
      if (p.rapidT > 0) {                          // 연사 강화 오라 — 위로 흐르는 속도선
        ctx.save();
        ctx.globalAlpha = 0.5 + Math.sin(Game.timer * 18) * 0.2;
        ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 2.6; ctx.lineCap = "round";
        for (let i = 0; i < 6; i++) {
          const sx = p.x + (i % 2 ? 1 : -1) * (20 + (i >> 1) * 11);
          const sy = p.y + 8 + ((Game.timer * 520 + i * 27) % 46);
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 13); ctx.stroke();
        }
        ctx.restore();
      }
      if (p.magnet > 0) {                          // 자석 범위
        ctx.strokeStyle = "rgba(126,200,245,.35)"; ctx.lineWidth = 2;
        ctx.setLineDash([7, 9]); ctx.lineDashOffset = -Game.timer * 40;
        ctx.beginPath(); ctx.arc(p.x, p.y, 90, 0, TAU); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    drawUpgradeFx();
    drawParticles();
    drawFeverFx();
    drawUltFx();
  }
  ctx.restore();

  if (Game.state === "title") drawTitle();
  else if (Game.state === "select") drawSelect();
  else {
    drawHUD();
    if (Game.state === "playing" || Game.state === "paused") {
      drawUltButton();
      drawDevCorner();
      drawBossBar();
      drawBanners();
    }
    if (Game.state === "over") drawGameOver();
    if (Game.state === "paused") drawPause();
  }
}

/* =========================================================================
 * 게임 루프
 * ========================================================================= */
let last = 0;
function frame(ts) {
  if (!last) last = ts;
  let dt = (ts - last) / 1000;
  last = ts;
  if (dt > 0.05) dt = 0.05;              // 탭 전환 뒤 물리가 튀는 것 방지
  update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>

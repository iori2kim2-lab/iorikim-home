<script>
"use strict";
/* =========================================================================
 * 펫 플라이트 (Pet Flight) — 9:16 세로형 종스크롤 슈팅
 * 단일 파일 / 외부 이미지·사운드 0개 / 모든 그래픽과 소리는 코드로 생성
 * -------------------------------------------------------------------------
 * [1단계] 450x800 세로 캔버스 · 무한 스크롤 구름 하늘 · 캐릭터 선택 UI
 * [2단계] 고양이(유도 발바닥) / 강아지(직사 뼈다귀) 차별화
 * [3단계] Web Audio 8비트 BGM + 캐릭터별 발사음 + 폭발음
 * [4단계] 라인 편대 스폰 · 무한 스테이지 난이도 곡선 · 엘리트 몬스터
 * [5단계] 파티클 · 아이템(골드/자석/실드) · HUD · localStorage 최고기록
 * ========================================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const CW = 450, CH = 800;                    // 정확히 9 : 16

/* ── 밸런스 상수 ───────────────────────────────────────────────────────── */
const PLAYER_Y     = CH - 132;               // 플레이어는 하단 고정, 좌우로만 이동
const PLAYER_R     = 24;
const MOVE_SPEED   = 430;                    // 키보드 이동 속도(px/초)
const FIRE_RATE    = 0.15;                   // 자동 발사 간격(초)
const LANES        = 6;                      // 적이 내려오는 라인 수
const LANE_W       = CW / LANES;
const ENEMY_R      = 22;                     // 일반 몬스터 반지름
const ELITE_SCALE  = 3;                      // 엘리트는 3배 크기
const MAGNET_TIME  = 6.0;
/* 실드는 원래 "쓸 때까지 영구"였다 → 한 번 얻으면 끝까지 남아 긴장이 사라졌다.
 * 이제 20초 제한을 두고, 마지막 4초는 점점 빠르게 깜빡이며 사라질 걸 알린다.
 * (겹쳐 먹으면 개수가 늘고 시간도 새로 채워진다) */
/* 만렙 이후의 강화 아이템 — 더 올릴 게 없으면 잠깐 화력을 폭발시킨다.
 * (아이템이 아예 안 나오면 후반에 화면이 심심해진다) */
const RAPID_TIME   = 5.0;                    // 연사 강화 지속 시간(초)
const RAPID_MUL    = 1.5;                    // 기본탄·드론 발사 속도 배수
const SHIELD_TIME  = 20.0;                   // 실드 지속 시간(초)
const SHIELD_WARN  = 4.0;                    // 남은 시간이 이보다 적으면 깜빡인다
const MAX_WLV      = 5;                      // 무기 최대 강화 단계

/* ── 보조 드론 ─────────────────────────────────────────────────────────
 * 만렙(LV5) 이후의 강화 아이템은 드론으로 전환된다. 본체 탄을 더 늘리면
 * 화면이 어지러우므로, 드론은 "발사 간격이 긴 다른 종류의 탄"을 쏜다.
 *   1단계 방사형   : 부채꼴 3발, 약하지만 넓게
 *   2단계 집중형   : 드론 2기, 빠르고 굵은 직사탄
 *   3단계 미사일형 : 유도 미사일 + 착탄 시 범위 폭발 */
/* 드론은 "형태 3종 × 랭크 3단계 = 9단계"로 성장한다.
 * 랭크업 방향을 형태마다 다르게 둬서, 무작정 탄만 늘어나 화면이
 * 지저분해지는 걸 막는다.
 *   방사형  → 탄 수가 늘고 부채꼴이 넓어진다   (3 → 4 → 5발)
 *   집중형  → 연사와 위력이 오르고 마지막에 2줄 (0.28 → 0.18초)
 *   미사일형→ 폭발 반경과 위력, 마지막에 2발    (66 → 96px) */
const DRONE_FORMS = [
  { name: "방사형", ranks: [
      { shots: 3, rate: 0.42, dmg: 1, arc: 0.34 },
      { shots: 4, rate: 0.36, dmg: 1, arc: 0.40 },
      { shots: 5, rate: 0.30, dmg: 1, arc: 0.46 } ] },
  { name: "집중형", ranks: [
      { shots: 1, rate: 0.28, dmg: 3 },
      { shots: 1, rate: 0.20, dmg: 4 },
      { shots: 2, rate: 0.18, dmg: 4 } ] },
  { name: "미사일형", ranks: [
      { shots: 1, rate: 0.80, dmg: 4, blast: 66 },
      { shots: 1, rate: 0.72, dmg: 5, blast: 80 },
      { shots: 2, rate: 0.70, dmg: 6, blast: 96 } ] },
  /* 폭풍형(최종) → 미사일과 전기를 "동시에" 쏜다.
   *   미사일 : 미사일형과 같은 유도 + 범위 폭발 (shots/rate/dmg/blast)
   *   전기   : 별도 타이머(srate)로 도는 즉발 체인 라이트닝.
   *            reach 안의 첫 표적을 때린 뒤 range 안의 다음 적으로 chain번 튀며
   *            튈 때마다 20%씩 약해진다. (sdmg = 전기 위력) */
  { name: "폭풍형", ranks: [
      { shots: 1, rate: 0.78, dmg: 5, blast: 82,
        chain: 2, reach: 420, range: 160, sdmg: 2, srate: 0.70 },
      { shots: 2, rate: 0.74, dmg: 6, blast: 94,
        chain: 3, reach: 450, range: 185, sdmg: 3, srate: 0.62 },
      { shots: 2, rate: 0.70, dmg: 7, blast: 106,
        chain: 4, reach: 480, range: 210, sdmg: 4, srate: 0.55 } ] }
];
const MAX_DSTEP = 12;                        // 4형태 x 3랭크
const DRONE_COLORS = ["#a7f0c6", "#6ff0ff", "#ffb03a", "#f0ff5a"];   // 형태별 상징색
const droneForm = () => Math.min(3, Math.floor((Game.player.dstep - 1) / 3));
const droneRank = () => ((Game.player.dstep - 1) % 3) + 1;
function droneSpec() {
  const p = Game.player;
  if (!p || p.dstep <= 0) return null;
  const f = DRONE_FORMS[droneForm()];
  return Object.assign({ form: droneForm(), rank: droneRank(), name: f.name }, f.ranks[droneRank() - 1]);
}

/* ── 필살기 (펫 오라) ──────────────────────────────────────────────────
 * 게이지가 가득 차면 발동 가능. 자동이 아니라 "직접 터뜨리는" 기술이라
 * 위험한 순간까지 아껴 두는 판단이 생긴다. 발동 중에는 무적. */
const ULT_NEED     = 1;
const ULT_KILL     = 0.006;                  // 적 처치당 충전량 (약 167마리 — 기존의 1/3)
const ULT_GOLD     = 0.002;                  // 골드 획득당 충전량
const ULT_TIME     = 1.15;                   // 충격파가 화면을 훑는 시간
const ULT_ELITE_DMG= 0.45;                   // 엘리트에게 주는 최대체력 비율
const ULT_BTN      = { cx: 54, cy: CH - 54, r: 34 };

/* ── 피버타임 ──────────────────────────────────────────────────────────
 * 필살기(수동·순간 폭발)와 역할이 겹치지 않도록 충전원을 나눴다.
 *   필살기 = 적 처치     → 직접 터뜨리는 한 방
 *   피버   = 골드 수집   → 가득 차면 자동 발동, 3.5초간 초대형 레이저
 * 덕분에 자석·골드를 챙길 이유가 생기고, 두 게이지가 따로 논다. */
const FEVER_GOLD   = 0.011;                  // 골드 1개당 (약 90개면 만충 — 기존의 2배 시간)
const FEVER_KILL   = 0.0015;                 // 처치로도 아주 조금은 찬다 (역시 절반)
const FEVER_TIME   = 3.5;                    // 피버 지속 시간
/* 피버는 레이저가 아니라 "거대한 마스코트 탄"이 화면을 훑고 지나간다.
 *   고양이 → 커다란 하트가 두근거리며 위로 날아간다
 *   강아지 → 커다란 뼈다귀가 빙글빙글 돌며 위로 날아간다
 * 둘 다 적을 관통하며, 닿은 일반 적은 그 자리에서 소멸한다. */
const FEVER_R      = 104;                    // 관통탄 판정 반지름
const FEVER_GAP    = 0.72;                   // 발사 간격 (지속시간 동안 약 5발)
const FEVER_VY     = -600;                   // 위로 나아가는 속도
const FEVER_ELITE  = 3.0;                    // 엘리트 초당 피해(최대체력 비율)
const FEVER_BOSS   = 0.25;                   // 보스 초당 피해(최대체력 비율)

/* ── 페이스 리듬 ───────────────────────────────────────────────────────
 * 같은 간격의 스트림은 아무리 빨라져도 지루하다. 4번의 일반 편성 뒤에
 * "러시(3연속 속사)"를 넣고, 러시가 끝나면 짧은 소강을 준다.
 * 조용해졌다가 몰아치는 대비가 긴장을 만든다. */
const RUSH_EVERY   = 4;
const RUSH_WAVES   = 3;
const RUSH_GAP     = 0.34;
const CALM_EXTRA   = 1.25;

/* ── 보스전 ────────────────────────────────────────────────────────────
 * 5스테이지마다 등장. "다음 보스까지 2스테이지" 라는 기대가 중반을 끌고 간다. */
const BOSS_EVERY   = 5;
const BOSS_TIMEOUT = 45;
/* 보스 급강하 — 예전엔 플레이어보다 130px 위에서 멈춰 "공격 같지가 않았다".
 * 이제는 플레이어 높이까지 그대로 내리꽂고, 대신 예고 시간을 넉넉히 주고
 * 바닥에 낙하 지점을 미리 그려 준다(피할 수 있으면 공격은 세도 된다). */
const BOSS_WARN    = 1.15;                   // 예고 시간(초)
const BOSS_DIVE_Y  = PLAYER_Y - 8;           // 급강하가 멈추는 높이 = 플레이어 높이
const SCROLL_SPEED = 90;                     // 비행 거리 증가 속도(m/s)
const STAGE_DIST   = 600;                    // 이만큼 날아가면 다음 스테이지
const BEST_KEY     = "petflight_best_v1";

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand  = (a, b) => a + Math.random() * (b - a);
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y,     x + w, y + h, r);
  g.arcTo(x + w, y + h, x,     y + h, r);
  g.arcTo(x,     y + h, x,     y,     r);
  g.arcTo(x,     y,     x + w, y,     r);
  g.closePath();
}
const FONT = "'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif";
function text(str, x, y, size, color, align, weight) {
  ctx.font = (weight || 800) + " " + size + "px " + FONT;
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
}

/* ── 펫 정의 ───────────────────────────────────────────────────────────── */
const PETS = {
  cat: {
    key: "cat", name: "고양이", tag: "연사 발바닥",
    desc: ["곧게 뻗는 발바닥을", "촘촘하게 퍼붓는", "빠른 연사형"],
    body: "#ffd7e6", body2: "#ffb0cf", line: "#e4749b",
    /* [밸런스] 유도를 걷어내고 둘 다 직사로 통일했다.
     *  고양이 = 연사가 15% 빠르지만 탄속이 느린 쪽,
     *  강아지 = 연사는 보통이지만 탄이 훨씬 빨라 먼 적을 먼저 때리는 쪽. */
    shot: { dmg: 2, speed: 620, homing: 0, count: 1, rateMul: 0.85 },
    particle: "heart", pcolor: ["#ff9ec4", "#ffd1e3", "#ff6f9c", "#fff0f6"]
  },
  dog: {
    key: "dog", name: "강아지", tag: "직사 뼈다귀",
    desc: ["앞으로 곧게 뻗는", "빠르고 강력한", "노란 뼈다귀 미사일"],
    body: "#ffe3ac", body2: "#f7c46a", line: "#c98f2c",
    shot: { dmg: 2, speed: 720, homing: 0, count: 1, rateMul: 1.0 },
    particle: "star", pcolor: ["#ffd76a", "#fff0c2", "#ffb03a", "#ffffff"]
  }
};

/* ── 게임 상태 ─────────────────────────────────────────────────────────── */
const Game = {
  state: "title",           // title | select | playing | paused | over
  titleT: 0,                // 타이틀 연출 경과 시간
  pet: PETS.cat,
  player: null,
  bullets: [], enemies: [], drops: [], parts: [], pops: [], formations: [], bolts: [],
  upFx: null,               // 머리 위 "업그레이드!" 연출
  feverShots: [], feverShotT: 0,   // 피버 관통탄
  score: 0, gold: 0, stage: 1, distance: 0,
  ult: 0, ultT: 0, ultR: 0,
  fever: 0, feverT: 0, feverBanner: 0,
  waveCount: 0, rushLeft: 0, rushBanner: 0,
  boss: null, lastBossStage: 0, bossT: 0, stageBanner: 0, lastStage: 1,
  tierBanner: 0, tierShown: 0,          // 적 세대 교체 연출
  spawnT: 0, fireT: 0, timer: 0, shake: 0, overT: 0,
  best: { score: 0, gold: 0, stage: 1 },
  newRecord: false
};

try {
  const raw = localStorage.getItem(BEST_KEY);
  if (raw) Game.best = JSON.parse(raw);
} catch (e) { /* 로컬스토리지를 못 쓰는 환경이면 기본값 */ }

/* ── 기록판 (이름 저장) ───────────────────────────────────────────────── */
const SCORES_KEY = "petflight_scores_v1";
function loadScores() {
  try { return JSON.parse(localStorage.getItem(SCORES_KEY) || "[]"); }
  catch (e) { return []; }
}
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}
function drawScoreList() {
  const el = document.getElementById("scoreList");
  if (!el) return;
  const list = loadScores();
  el.innerHTML = list.length
    ? list.map((s, i) => "<p>" + (i + 1) + ". " + escapeHtml(s.n) + " <b>" + s.s + "</b></p>").join("")
    : "<p>아직 기록이 없어요</p>";
}
function saveScore() {
  const nameEl = document.getElementById("nameInput");
  const name = (nameEl && nameEl.value.trim()) || "익명";
  const list = loadScores();
  list.push({ n: name, s: Game.score });
  list.sort((a, b) => b.s - a.s);
  localStorage.setItem(SCORES_KEY, JSON.stringify(list.slice(0, 5)));
  drawScoreList();
}
document.addEventListener("DOMContentLoaded", () => {
  drawScoreList();
  const btn = document.getElementById("saveScore");
  if (btn) btn.addEventListener("click", saveScore);
});

/* ── 입력: 드래그 / 키보드 ───────────────────────────────────────────────
 * 좌우 이동은 방향키와 A·D를 같은 자격으로 받는다. 이 목록에 있는 키를
 * 누르면 진행 중이던 드래그 조작을 놓아 준다(둘이 서로 잡아당기지 않도록). */
const MOVE_KEYS = ["ArrowLeft", "ArrowRight", "KeyA", "KeyD"];
const keys = Object.create(null);
const pressed = Object.create(null);
let pointerX = null, pointerDown = false;

addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "Space"].indexOf(e.code) >= 0) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (MOVE_KEYS.indexOf(e.code) >= 0) pointerX = null;      // 이동키를 쓰면 드래그 해제
});
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; pointerDown = false; });

function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (CW / r.width),
           y: (e.clientY - r.top) * (CH / r.height) };
}
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const p = canvasPos(e);
  // 필살기 버튼을 눌렀을 때는 이동 입력으로 잡지 않는다
  if (Game.state === "playing" &&
      (p.x - ULT_BTN.cx) * (p.x - ULT_BTN.cx) + (p.y - ULT_BTN.cy) * (p.y - ULT_BTN.cy)
        < (ULT_BTN.r + 10) * (ULT_BTN.r + 10)) {
    fireUlt();
    return;
  }
  pointerDown = true; pointerX = p.x;
  handleTap(p.x, p.y);
  canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!pointerDown) return;
  pointerX = canvasPos(e).x;
});
const endPointer = () => { pointerDown = false; };
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

/* =========================================================================
 * [3단계] 오디오 — 외부 파일 없이 Web Audio API로 전부 합성
 * ========================================================================= */
const Sound = {
  ctx: null, master: null, music: null, sfx: null,
  on: true, started: false, timer: null,
  bpm: 148, step: 0, nextTime: 0, lookahead: 0.12,

  /* 경쾌한 비행 BGM — Am - F - C - G, 8비트 리드 + 베이스 + 드럼 */
  melody: [
    [69, null, 76, null, 74, 72, 74, null, 76, null, 72, null, 69, null, null, null],
    [65, null, 72, null, 71, 69, 71, null, 72, null, 69, null, 65, null, null, null],
    [72, null, 79, null, 77, 76, 77, null, 79, null, 76, null, 72, null, null, null],
    [67, null, 74, null, 79, 78, 79, null, 83, null, 79, null, 74, null, null, null]
  ],
  bassRoot: [45, 41, 48, 43],
  bassPat: [0, null, 12, null, 7, null, 12, null, 0, null, 12, null, 7, null, 7, null],
  chords: [[57, 60, 64], [53, 57, 60], [60, 64, 67], [55, 59, 62]],

  ensure() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = 0.15;
      this.music.connect(this.master);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = 0.5;
      this.sfx.connect(this.master);
      const len = Math.floor(this.ctx.sampleRate * 0.35);
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },

  tone(t, f0, f1, dur, type, vol, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noiseBurst(t, freq, dur, vol, type) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise;
    f.type = type || "bandpass"; f.frequency.value = freq; f.Q.value = 1.1;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx);
    s.start(t); s.stop(t + dur + 0.02);
  },

  /* ── 효과음 ─────────────────────────────────────────────────────────
   * catShot : 가볍고 청량한 고음 플럭   dogShot : 묵직하고 통통 튀는 저음
   * pop     : 적 처치 '팡!'             coin/shield/magnet/hit/over      */
  play(name) {
    if (!this.on) return;
    try {
      const c = this.ensure(), t = c.currentTime;
      if (name === "catShot") {
        this.tone(t, 1250, 1900, 0.07, "triangle", 0.16);
        this.tone(t + 0.01, 2400, 3000, 0.04, "sine", 0.07);
      } else if (name === "dogShot") {
        this.tone(t, 420, 190, 0.10, "square", 0.20);
        this.noiseBurst(t, 900, 0.06, 0.10);
      } else if (name === "pop") {
        this.tone(t, 780, 180, 0.14, "square", 0.20);
        this.noiseBurst(t, 2400, 0.14, 0.26, "highpass");
      } else if (name === "bigpop") {
        this.tone(t, 300, 60, 0.34, "sawtooth", 0.28);
        this.noiseBurst(t, 700, 0.34, 0.34, "lowpass");
        this.noiseBurst(t + 0.02, 2600, 0.2, 0.2, "highpass");
      } else if (name === "coin") {
        this.tone(t, 1046, 0, 0.07, "square", 0.16);
        this.tone(t + 0.05, 1568, 0, 0.11, "square", 0.14);
      } else if (name === "power") {
        [784, 988, 1319, 1568].forEach((f, i) => this.tone(t + i * 0.06, f, 0, 0.16, "square", 0.18));
      } else if (name === "hit") {
        this.tone(t, 220, 70, 0.45, "sawtooth", 0.3);
        this.noiseBurst(t, 500, 0.4, 0.3, "lowpass");
      } else if (name === "over") {
        [523, 415, 349, 262].forEach((f, i) => this.tone(t + i * 0.17, f, 0, 0.42, "triangle", 0.24));
      } else if (name === "ult") {
        this.tone(t, 180, 1400, 0.35, "sawtooth", 0.18);           // 차오르는 라이저
        this.noiseBurst(t + 0.05, 1200, 0.3, 0.18, "highpass");
        const h = t + 0.34;
        this.tone(h, 220, 45, 0.6, "sine", 0.42);                  // 묵직한 임팩트
        this.noiseBurst(h, 600, 0.55, 0.36, "lowpass");
        this.noiseBurst(h, 3000, 0.4, 0.24, "highpass");
        [523, 659, 784, 1046, 1318].forEach((f, i) =>
          this.tone(h + 0.08 + i * 0.05, f, 0, 0.3, "square", 0.14));
      } else if (name === "fever") {
        this.tone(t, 140, 1600, 0.4, "sawtooth", 0.2);              // 차오르는 라이저
        this.noiseBurst(t + 0.06, 1400, 0.36, 0.2, "highpass");
        const h = t + 0.4;
        this.tone(h, 90, 50, 1.6, "sawtooth", 0.22);                // 레이저 저음 지속
        this.tone(h, 1200, 900, 1.6, "square", 0.06);
        this.noiseBurst(h, 800, 1.2, 0.22, "lowpass");
        [523, 784, 1046, 1568].forEach((f, i) =>
          this.tone(h + 0.1 + i * 0.06, f, 0, 0.34, "square", 0.16));
      } else if (name === "drone") {
        this.tone(t, 900, 1500, 0.06, "sine", 0.10);
      } else if (name === "missile") {
        this.tone(t, 300, 700, 0.14, "sawtooth", 0.12);
        this.noiseBurst(t, 1400, 0.1, 0.08, "highpass");
      } else if (name === "warn") {                       // 급강하 예고 알림
        [880, 880].forEach((f, i) => this.tone(t + i * 0.16, f, f * 0.7, 0.12, "square", 0.13));
      } else if (name === "whoosh") {                     // 피버 관통탄 사출
        this.tone(t, 220, 900, 0.30, "sine", 0.16);
        this.tone(t + 0.02, 440, 1400, 0.22, "triangle", 0.10);
        this.noiseBurst(t, 900, 0.26, 0.10, "lowpass");
      } else if (name === "zap") {                        // 지지직 — 고역 노이즈 + 급강하 톱니파
        this.noiseBurst(t, 2600, 0.12, 0.12, "highpass");
        this.tone(t, 1800, 240, 0.09, "sawtooth", 0.09);
        this.tone(t + 0.03, 2600, 500, 0.07, "square", 0.05);
      } else if (name === "rush") {
        [660, 880].forEach((f, i) => this.tone(t + i * 0.08, f, f * 1.6, 0.14, "square", 0.18));
      } else if (name === "stage") {
        [784, 1046].forEach((f, i) => this.tone(t + i * 0.07, f, 0, 0.2, "triangle", 0.16));
      } else if (name === "boss") {
        this.tone(t, 120, 60, 0.9, "sawtooth", 0.3);
        this.noiseBurst(t, 400, 0.8, 0.3, "lowpass");
        [196, 233, 262].forEach((f, i) => this.tone(t + 0.2 + i * 0.14, f, 0, 0.4, "square", 0.2));
      } else if (name === "start") {
        [659, 880, 1319].forEach((f, i) => this.tone(t + i * 0.07, f, 0, 0.18, "square", 0.2));
      }
    } catch (e) { /* 오디오 불가 환경은 조용히 무시 */ }
  },

  /* ── BGM: 오디오 클럭에 선행 예약해 프레임과 무관하게 정확히 루프 ── */
  startBgm() {
    if (this.started || !this.on) return;
    try {
      this.ensure();
      this.started = true;
      this.nextTime = this.ctx.currentTime + 0.08;
      this.timer = setInterval(() => this.schedule(), 25);
    } catch (e) { this.started = false; }
  },
  stopBgm() { if (!this.started) return; clearInterval(this.timer); this.timer = null; this.started = false; },
  toggle() {
    this.on = !this.on;
    if (!this.on) this.stopBgm();
    else if (Game.state === "playing") this.startBgm();
  },
  sync(state) {
    if (state === "playing" && this.on) this.startBgm();
    else if (state !== "playing") this.stopBgm();
  },

  schedule() {
    if (!this.ctx) return;
    const stepDur = 60 / this.bpm / 4;
    while (this.nextTime < this.ctx.currentTime + this.lookahead) {
      this.playStep(this.step, this.nextTime, stepDur);
      this.nextTime += stepDur;
      this.step = (this.step + 1) % 64;
    }
  },

  playStep(i, t, dur) {
    const bar = i >> 4, s = i & 15;
    const midi = m => 440 * Math.pow(2, (m - 69) / 12);

    const n = this.melody[bar][s];
    if (n !== null) this.tone(t, midi(n), 0, dur * 1.7, "square", 0.17, this.music);

    const off = this.bassPat[s];
    if (off !== null) this.tone(t, midi(this.bassRoot[bar] + off), 0, dur * 1.5, "triangle", 0.28, this.music);

    if (s % 4 === 2) {                                  // 아르페지오
      const ch = this.chords[bar];
      this.tone(t, midi(ch[(i >> 1) % 3] + 12), 0, dur * 0.8, "square", 0.05, this.music);
    }
    if (s % 8 === 0) {                                  // 킥
      const c = this.ctx, o = c.createOscillator(), g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.1);
      g.gain.setValueAtTime(0.4, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o.connect(g); g.connect(this.music); o.start(t); o.stop(t + 0.17);
    }
    if (s % 8 === 4) {                                  // 스네어
      const c = this.ctx, sr = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      sr.buffer = this.noise;
      f.type = "highpass"; f.frequency.value = 1500;
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      sr.connect(f); f.connect(g); g.connect(this.music); sr.start(t); sr.stop(t + 0.12);
    }
    if (s % 2 === 0) {                                  // 하이햇
      const c = this.ctx, sr = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
      sr.buffer = this.noise;
      f.type = "highpass"; f.frequency.value = 8500;
      g.gain.setValueAtTime(s % 4 === 0 ? 0.05 : 0.03, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      sr.connect(f); f.connect(g); g.connect(this.music); sr.start(t); sr.stop(t + 0.05);
    }
  }
};

/* =========================================================================
 * [4단계] 게임 로직 — 스폰 · 난이도 곡선 · 충돌 · 아이템
 * ========================================================================= */

/* 카드 UI 좌표(선택 화면 · 탭 판정 공용) */
const CARD_W = 178, CARD_H = 252, CARD_Y = 286;
const CARDS = {
  cat: { x: 26, y: CARD_Y, w: CARD_W, h: CARD_H },
  dog: { x: CW - 26 - CARD_W, y: CARD_Y, w: CARD_W, h: CARD_H }
};
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

function startGame(petKey) {
  Game.pet = PETS[petKey];
  Game.player = { x: CW / 2, y: PLAYER_Y, r: PLAYER_R, shield: 0, shieldT: 0, magnet: 0, rapidT: 0,
                  tilt: 0, flap: 0, inv: 0, wlv: 1, dstep: 0, droneT: 0, sparkT: 0 };
  Game.bullets = []; Game.enemies = []; Game.drops = []; Game.formations = [];
  Game.parts = []; Game.pops = []; Game.bolts = []; Game.upFx = null;
  Game.feverShots = []; Game.feverShotT = 0;
  Game.score = 0; Game.gold = 0; Game.stage = 1; Game.distance = 0;
  Game.ult = 0; Game.ultT = 0; Game.ultR = 0;
  Game.fever = 0; Game.feverT = 0; Game.feverBanner = 0;
  Game.waveCount = 0; Game.rushLeft = 0; Game.rushBanner = 0;
  Game.boss = null; Game.lastBossStage = 0; Game.bossT = 0;
  Game.weaponBlock = -1;                    // 강화 아이템을 내보낸 구간(2스테이지 단위)
  Game.shieldNextStage = 1;                 // 실드가 다시 나올 수 있는 스테이지
  Game.stageBanner = 0; Game.lastStage = 1;
  Game.tierBanner = 0; Game.tierShown = 0;
  Sound.bpm = 148;
  Game.spawnT = 0.5; Game.fireT = 0; Game.shake = 0; Game.overT = 0;
  Game.newRecord = false;
  Game.state = "playing";
  pointerX = null;
  Sound.play("start");
}

/* ── 개발용 단축키 : 화면 오른쪽 아래 구석을 3번 연속 터치 ──────────────
 * 강화를 전부 만렙으로 올리고 90스테이지(우주 · 외계 침공군)로 건너뛴다.
 * 후반 콘텐츠를 매번 90판까지 플레이해서 확인할 수는 없기 때문. */
const DEV_CORNER = { w: 80, h: 80 };         // 오른쪽 아래 구석 판정 영역
const DEV_TAPS   = 3;                        // 몇 번 눌러야 발동하는가
const DEV_WINDOW = 1.4;                      // 연속으로 인정하는 시간(초)

function devCornerTap(x, y) {
  if (Game.state !== "playing") return false;
  if (x < CW - DEV_CORNER.w || y < CH - DEV_CORNER.h) return false;

  if (Game.timer - (Game.devTapT || -9) > DEV_WINDOW) Game.devTaps = 0;
  Game.devTaps = (Game.devTaps || 0) + 1;
  Game.devTapT = Game.timer;
  if (Game.devTaps < DEV_TAPS) {
    pop(Game.devTaps + " / " + DEV_TAPS, CW - 44, CH - 96, "#ffd76a");
    return true;
  }

  /* 발동 — 만렙 + 90스테이지 */
  Game.devTaps = 0;
  const p = Game.player;
  p.wlv = MAX_WLV; p.dstep = MAX_DSTEP;
  p.shield = 2; p.shieldT = SHIELD_TIME;
  Game.stage = TIER_STAGE[3];
  Game.distance = (TIER_STAGE[3] - 1) * STAGE_DIST + 10;
  Game.lastStage = Game.stage;
  Game.lastBossStage = Game.stage;             // 진입하자마자 보스가 뜨지 않게
  Game.tierShown = enemyTier(Game.stage);
  Game.weaponBlock = -1;
  Game.enemies.length = 0; Game.bullets.length = 0; Game.bolts.length = 0;
  Game.boss = null;
  skyMix = 1; skyTo = skyIndex(Game.stage); skyFrom = skyTo;   // 배경도 즉시 우주로
  Game.stageBanner = 1.8; Game.tierBanner = 2.4;
  Game.flash = 0.8; Game.shake = 12;
  Sound.play("bigpop");
  pop("DEV : MAX + STAGE " + Game.stage, CW / 2, CH * 0.4, "#7ef0ff");
  return true;
}

function handleTap(x, y) {
  if (devCornerTap(x, y)) return;
  if (Game.state === "title") {
    if (Game.titleT > 0.6) { Game.state = "select"; Sound.play("stage"); }
  } else if (Game.state === "select") {
    if (inRect(x, y, CARDS.cat)) startGame("cat");
    else if (inRect(x, y, CARDS.dog)) startGame("dog");
  } else if (Game.state === "over" && Game.overT <= 0) {
    Game.state = "select";
  } else if (Game.state === "paused") {
    Game.state = "playing";
  }
}

/* ── 난이도 곡선 ───────────────────────────────────────────────────────
 * 스테이지가 오를수록 HP는 계단식으로, 속도는 완만한 곡선으로 오르고
 * 스폰 간격은 하한선까지 서서히 좁아진다. 무한히 이어지되 발산하지 않는다. */
function enemyHp()    { return 1 + Math.floor(Game.stage * 0.75); }
function enemySpeed() { return Math.min(250, 78 + Game.stage * 6.5); }
function spawnGap()   { return Math.max(0.62, 1.55 - Game.stage * 0.045); }

/* 적의 색 변형 — 같은 종류라도 지루하지 않게 */
const BIRD_SKINS = [
  { body: "#a9d9ff", body2: "#6bb4f5", wing: "#4a90d9", beak: "#ffb03a" },
  { body: "#ffc6dc", body2: "#ff92bd", wing: "#e26d9c", beak: "#ffa73a" },
  { body: "#d3c4ff", body2: "#ab90f5", wing: "#8a6fe0", beak: "#ffbf4a" }
];

/* ── 적 세대(TIER) ─────────────────────────────────────────────────────────
 * 스테이지가 깊어지면 적의 "종족"이 통째로 교체된다.
 *   TIER 0 (1~29)  : 말랑한 하늘 친구들 — 둥글고 귀엽다
 *   TIER 1 (30~59) : 분노한 야수 군단 — 각진 실루엣, 뿔·가시·송곳니, 찢어진 눈
 *   TIER 2 (60~89) : 보이드 결정체   — 유기체가 아닌 기하학 에너지 병기
 *   TIER 3 (90~)   : 외계 침공군     — 배경이 우주가 되는 구간, 전부 외계인
 * 행동과 밸런스(HP/속도/스폰)는 그대로 두고 "겉모습만" 바꾸므로
 * 난이도 곡선은 유지한 채 후반부의 시각적 지루함만 걷어낸다. */
const TIER_STAGE = [1, 30, 60, 90];
const TIER_NAME  = ["하늘 친구들", "분노한 야수 군단", "보이드 결정체", "외계 침공군"];
function enemyTier(st) {
  return st >= TIER_STAGE[3] ? 3 : st >= TIER_STAGE[2] ? 2 : st >= TIER_STAGE[1] ? 1 : 0;
}

    beak:"#ffd14a", eye:"#ff8a2a", glow:"#ff6a10", aura:"rgba(180,60,255,.5)" },

  { dark:"#0f3a3a", dark2:"#031414", neon:"#7dff9f", core:"#f2fff5" }
];
/* TIER 3 — 외계인 피부색 3종 */
const ALIEN_SKINS = [
  { skin:"#a8e86a", skin2:"#5aa832", line:"#2f6b1c", glow:"#c8ff5a", light:"#7ef0ff" },
  { skin:"#cba8ff", skin2:"#7a4ecf", line:"#472a86", glow:"#e08cff", light:"#ffd76a" },
  { skin:"#8fe6e0", skin2:"#3f9fa8", line:"#1f5f68", glow:"#7ef0ff", light:"#ff8fbc" }
];
const SKIN_SETS = [BIRD_SKINS, RAGE_SKINS, VOID_SKINS, ALIEN_SKINS];
function tierSkin(t) {
  const a = SKIN_SETS[t] || BIRD_SKINS;
  return a[(Math.random() * a.length) | 0];
}

function makeEnemy(lane, y, opt) {
  const hp = (opt && opt.hp) || enemyHp();
  const roll = Math.random();
  const type = roll < 0.46 ? "bird" : roll < 0.76 ? "ghost" : "slime";
  const x = (lane + 0.5) * LANE_W;
  return {
    x, baseX: x, y,
    r: ENEMY_R, hp, maxHp: hp, speed: enemySpeed(),
    type, hurt: 0, elite: false,
    tier: enemyTier(Game.stage),                 // 태어난 스테이지의 세대를 그대로 가진다
    /* 움직임: 날갯짓 위상 · 좌우 흔들림 · 몸통 출렁임을 개체마다 다르게 */
    wob: rand(0, TAU),
    flap: rand(0, TAU), flapSp: rand(7.5, 11),
    sway: rand(6, LANE_W * 0.34), swayPh: rand(0, TAU), swaySp: rand(0.8, 1.6),
    skin: tierSkin(enemyTier(Game.stage))
  };
}

/* ── 편대 비행 ─────────────────────────────────────────────────────────────
 * 개체가 각자 내려오는 대신, 하나의 "대형"이 좌우로 스치듯 움직이고
 * 구성원은 대형 중심에서의 오프셋으로 위치가 결정된다(회전까지 반영).
 * 편대를 전멸시키면 보너스 점수와 확정 아이템이 나온다. */
function spawnFormation() {
  const kind = ["v", "circle", "diamond"][(Math.random() * 3) | 0];
  const offs = [];
  if (kind === "v") {
    for (let i = -2; i <= 2; i++) offs.push({ x: i * 40, y: Math.abs(i) * 30 });
  } else if (kind === "circle") {
    for (let i = 0; i < 6; i++)
      offs.push({ x: Math.cos(i / 6 * TAU) * 60, y: Math.sin(i / 6 * TAU) * 60 });
  } else {
    offs.push({ x: 0, y: -46 }, { x: -46, y: 0 }, { x: 46, y: 0 },
              { x: 0, y: 46 }, { x: 0, y: 0 });
  }
  const maxOff = Math.max.apply(null, offs.map(o => Math.abs(o.x))) + ENEMY_R + 8;
  const f = {
    kind, t: 0, rot: 0,
    cx: CW / 2, cy: -110,
    vy: enemySpeed() * 1.35,        // 편대는 낱개보다 확실히 빠르게 밀고 내려온다
    amp: Math.min(rand(70, 130), CW / 2 - maxOff),
    ph: rand(0, TAU), maxOff,
    members: [], left: offs.length
  };
  const hp = enemyHp() + 1;                      // 편대는 조금 더 단단하다
  for (const o of offs) {
    const e = makeEnemy(0, 0, { hp });
    e.type = "bird";                             // 편대는 새 부대
    e.form = f; e.ox = o.x; e.oy = o.y;
    e.baseX = undefined; e.sway = 0;
    e.x = f.cx + o.x; e.y = f.cy + o.y;
    f.members.push(e);
    Game.enemies.push(e);
  }
  Game.formations.push(f);
}

function updateFormations(dt) {
  for (let i = Game.formations.length - 1; i >= 0; i--) {
    const f = Game.formations[i];
    f.t += dt;
    f.cy += f.vy * dt;

    if (f.kind === "v") {                        // 지그재그로 미끄러지는 V자
      f.cx = CW / 2 + Math.sin(f.t * 1.55 + f.ph) * f.amp;
      f.rot = Math.sin(f.t * 1.55 + f.ph) * 0.2;
    } else if (f.kind === "circle") {            // 빙글빙글 도는 원형
      f.rot += dt * 1.45;
      f.cx = CW / 2 + Math.sin(f.t * 1.05 + f.ph) * f.amp * 0.75;
    } else {                                     // 좌우로 빠르게 오가는 다이아
      f.cx = CW / 2 + Math.sin(f.t * 2.3 + f.ph) * f.amp;
      f.rot += dt * 0.7;
    }
    f.cx = clamp(f.cx, f.maxOff, CW - f.maxOff);

    const c = Math.cos(f.rot), sn = Math.sin(f.rot);
    for (const e of f.members) {                 // 회전을 반영한 대형 좌표
      if (e.dead) continue;
      e.x = f.cx + e.ox * c - e.oy * sn;
      e.y = f.cy + e.ox * sn + e.oy * c;
    }
    if (f.cy - 120 > CH) {                       // 화면을 완전히 지나가면 정리
      for (const e of f.members) e.gone = true;
      Game.formations.splice(i, 1);
    }
  }
}

function formationBonus(f) {
  const bonus = 250 + Game.stage * 40;
  Game.score += bonus;
  pop("편대 격파! +" + bonus, clamp(f.cx, 70, CW - 70), f.cy, "#ffd76a");
  burst(f.cx, f.cy, 22, true);
  Game.shake = Math.max(Game.shake, 8);
  Sound.play("bigpop");
  for (let i = 0; i < 3; i++)
    spawnDrop(f.cx + rand(-34, 34), f.cy, "gold");
  spawnDrop(f.cx, f.cy - 18,
            (weaponAvailable() && Math.random() < 0.30) ? "weapon" : shieldOr("magnet"));
}

function spawnWave() {
  const stage = Game.stage;

  // 편대 비행 (스테이지 2부터)
  if (stage >= 2 && Math.random() < 0.24) { spawnFormation(); return; }

  // 엘리트: 3배 크기 · 투하물을 던진다
  if (stage >= 2 && Math.random() < 0.13) {
    const lane = 1 + Math.floor(Math.random() * (LANES - 2));
    const hp = enemyHp() * 9 + 6;
    Game.enemies.push({
      x: (lane + 0.5) * LANE_W, y: -ENEMY_R * ELITE_SCALE - 10,
      r: ENEMY_R * ELITE_SCALE, hp, maxHp: hp,
      speed: enemySpeed() * 0.55, type: "elite",
      wob: rand(0, TAU), hurt: 0, elite: true,
      tier: enemyTier(stage),
      flap: rand(0, TAU), flapSp: 4.2, skin: tierSkin(enemyTier(stage)),
      drift: rand(-40, 40)
    });
    return;
  }

  // 일반 편대 — 라인을 채우는 4가지 패턴
  const pat = ["full", "gap", "zigzag", "pair"][(Math.random() * 4) | 0];
  const y0 = -ENEMY_R - 8;
  if (pat === "full") {
    for (let i = 0; i < LANES; i++) Game.enemies.push(makeEnemy(i, y0));
  } else if (pat === "gap") {
    const hole = (Math.random() * LANES) | 0, hole2 = (Math.random() * LANES) | 0;
    for (let i = 0; i < LANES; i++)
      if (i !== hole && i !== hole2) Game.enemies.push(makeEnemy(i, y0));
  } else if (pat === "zigzag") {
    for (let i = 0; i < LANES; i++)
      Game.enemies.push(makeEnemy(i, y0 - (i % 2) * 46));
  } else {
    const start = (Math.random() * (LANES - 2)) | 0;
    for (let i = start; i < start + 3 && i < LANES; i++) {
      Game.enemies.push(makeEnemy(i, y0));
      Game.enemies.push(makeEnemy(i, y0 - 48));
    }
  }
}

/* ── 발사 ──────────────────────────────────────────────────────────────────
 * 무기 레벨이 오르면 탄 수가 늘고, 두 단계마다 발당 데미지도 한 칸 오른다.
 * 늘어나는 방식은 펫마다 다르다.
 *   고양이 : 곧게 위로 나가는 줄이 "옆으로 한 줄씩" 늘어난다 (1 → 5줄)
 *            유도를 걷어낸 대신 겨냥해서 줄을 맞추는 재미가 생긴다.
 *   강아지 : 예전 그대로 부챗살이 한 갈래씩 넓어진다.
 * 최대 5단계. */
const COL_GAP = 28;                          // 고양이 줄 간격(px)
/* 펫별 연사 계수 — 숫자 하나이거나 레벨별 배열일 수 있다 */
function rateMulOf(pet, lv) {
  const m = pet.shot.rateMul;
  if (Array.isArray(m)) return m[clamp(lv - 1, 0, m.length - 1)] || 1;
  return m || 1;
}

function fireStats() {
  const lv = Game.player ? Game.player.wlv : 1;
  const pet = Game.pet;
  /* 고양이 : 레벨 수만큼의 줄을 가운데 기준으로 좌우 대칭 배치 */
  const cols = [];
  for (let i = 0; i < lv; i++) cols.push((i - (lv - 1) / 2) * COL_GAP);
  /* 강아지 : 예전 부챗살 그대로 (4~5레벨에서 바깥 탄이 허공을 갈라
   *          한 번 좁혀 둔 값을 유지한다) */
  const angles = [[0],
                  [-0.055, 0.055],
                  [-0.14, 0, 0.14],
                  [-0.185, -0.062, 0.062, 0.185],
                  [-0.245, -0.122, 0, 0.122, 0.245]][lv - 1];
  const rapid = Game.player && Game.player.rapidT > 0;
  return {
    lv, cols, angles, rapid,
    dmg: pet.shot.dmg + Math.floor((lv - 1) / 2),
    rate: (lv >= 5 ? 0.10 : lv >= 4 ? 0.12 : FIRE_RATE) * rateMulOf(pet, lv)
          / (rapid ? RAPID_MUL : 1)
  };
}

function fire() {
  const pet = Game.pet, p = Game.player, st = fireStats();
  const sp = pet.shot.speed * (st.rapid ? 1.15 : 1);      // 연사 중엔 탄속도 살짝

  if (pet.key === "cat") {                                // 고양이 : 평행한 여러 줄
    for (const ox of st.cols)
      Game.bullets.push({ x: p.x + ox, y: p.y - 26, vx: 0, vy: -sp, homing: 0,
                          r: 9, dmg: st.dmg, kind: "paw", t: 0, spin: 0 });
  } else {                                                // 강아지 : 부챗살
    for (const a of st.angles)
      Game.bullets.push({ x: p.x + a * 70, y: p.y - 22,
                          vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp, homing: 0,
                          r: 10, dmg: st.dmg, kind: "bone", t: 0, spin: rand(0, TAU) });
  }
  Sound.play(pet.key === "cat" ? "catShot" : "dogShot");
  Game.fireT = st.rate;
}

/* ── 드론 ──────────────────────────────────────────────────────────────
 * 본체 좌우를 살짝 뒤처져 따라다니며 독립적으로 사격한다. */
function droneSlots() {
  const p = Game.player;
  if (!p || p.dstep <= 0) return [];
  // 방사형은 1기로 시작해 ★3에서 2기가 되고, 그 뒤로는 계속 2기
  const n = (droneForm() >= 1 || droneRank() >= 3) ? 2 : 1;
  const out = [];
  for (let i = 0; i < n; i++) {
    const side = n === 1 ? 1 : (i === 0 ? -1 : 1);
    out.push({
      x: p.x + side * 42 + Math.sin(Game.timer * 2 + i) * 3,
      y: p.y + 18 + Math.sin(Game.timer * 3 + i * 1.7) * 4,
      side
    });
  }
  return out;
}

function fireDrones(dt) {
  const p = Game.player;
  const sp = droneSpec();
  if (!sp) return;

  /* 전기 스파크는 미사일과 "따로" 돈다 — 같은 타이머에 묶으면 둘 중 하나가
   * 상대의 발사 주기에 끌려가 리듬이 죽는다. 폭풍형은 두 무기가 각자
   * 자기 박자로 나가면서 겹칠 때 화면이 가장 화려해진다. */
  if (sp.chain) {
    p.sparkT = (p.sparkT || 0) - dt;
    if (p.sparkT <= 0) {
      let hit = false;
      for (const d of droneSlots()) hit = fireSpark(d.x, d.y - 10, sp) || hit;
      p.sparkT = (hit ? sp.srate : 0.12) / (p.rapidT > 0 ? RAPID_MUL : 1);
      if (hit) Sound.play("zap");
    }
  }

  p.droneT -= dt;
  if (p.droneT > 0) return;
  p.droneT = sp.rate / (p.rapidT > 0 ? RAPID_MUL : 1);   // 연사 강화는 드론에도 걸린다

  const col = Game.pet.body2;
  for (const d of droneSlots()) {
    if (sp.form === 0) {                        // 방사형: 부채꼴로 흩뿌린다
      for (let i = 0; i < sp.shots; i++) {
        const a = sp.shots === 1 ? 0 : -sp.arc + (2 * sp.arc) * (i / (sp.shots - 1));
        Game.bullets.push({ x: d.x, y: d.y - 10, vx: Math.sin(a) * 380, vy: -Math.cos(a) * 380,
                            r: 7, dmg: sp.dmg, kind: "d_spread", homing: 0, t: 0, spin: 0, col });
      }
    } else if (sp.form === 1) {                 // 집중형: 곧고 빠른 직사 (★3은 2줄)
      for (let i = 0; i < sp.shots; i++) {
        const ox = sp.shots === 1 ? 0 : (i === 0 ? -5 : 5);
        Game.bullets.push({ x: d.x + ox, y: d.y - 12, vx: 0, vy: -820,
                            r: 8, dmg: sp.dmg, kind: "d_focus", homing: 0, t: 0, spin: 0, col });
      }
    } else {                    // 미사일형 · 폭풍형: 유도 + 범위 폭발 (★2 이상은 2발)
      for (let i = 0; i < sp.shots; i++) {
        const ox = sp.shots === 1 ? 0 : (i === 0 ? -7 : 7);
        Game.bullets.push({ x: d.x + ox, y: d.y - 10, vx: d.side * 60 + ox * 6, vy: -300,
                            r: 12, dmg: sp.dmg, kind: "d_missile", homing: 2.8,
                            blast: sp.blast, t: 0, spin: 0, col });
      }
    }
  }
  Sound.play(sp.form >= 2 ? "missile" : "drone");
}

/* ── 전기 스파크 ──────────────────────────────────────────────────────
 * 탄이 아니라 "선"이다. 발사 즉시 가장 가까운 적을 때리고, 그 적에서
 * range 안의 다음 적으로 튄다. 시각 효과(번개 선 + 스파크 파편)는
 * Game.bolts 에 0.2초짜리로 남겨 두고 매 프레임 지지직 흔들어 그린다. */
function fireSpark(x, y, sp) {
  const used = new Set(), pts = [{ x, y }];
  let cx = x, cy = y, dmg = sp.sdmg || sp.dmg;
  for (let i = 0; i < sp.chain; i++) {
    const lim = i === 0 ? sp.reach : sp.range;           // 첫 표적은 멀리, 이후는 가까운 적으로만
    let best = null, bd = lim * lim;
    for (const e of Game.enemies) {
      if (e.dead || used.has(e) || e.y < -e.r || e.y > CH) continue;
      const d = dist2(cx, cy, e.x, e.y);
      if (d < bd) { bd = d; best = e; }
    }
    if (!best) break;
    used.add(best);
    pts.push({ x: best.x, y: best.y });
    best.hp -= dmg; best.hurt = 1;
    sparkBurst(best.x, best.y, 5);
    if (best.hp <= 0) { best.dead = true; killEnemy(best); }
    cx = best.x; cy = best.y;
    dmg = Math.max(1, Math.ceil(dmg * 0.8));
  }
  if (pts.length < 2) return false;
  Game.bolts.push({ pts, life: 0.2, max: 0.2 });
  return true;
}

/* ── 강화 알림 ────────────────────────────────────────────────────────
 * 강화 아이템을 먹은 순간 머리 위에 통통한 글자가 "뽕" 튀어나와
 * 천천히 떠오르며 사라진다. 무엇이 올랐는지는 아랫줄 알약에 적는다.
 * (팝업 텍스트만으로는 강화의 쾌감이 전혀 남지 않았다) */
function upgradeFx(label, sub, top, bot, outline, size) {
  Game.upFx = { t: 0, life: 1.35, label, sub, top, bot, outline, size: size || 30 };
  const p = Game.player;
  if (!p) return;
  for (let i = 0; i < 16; i++) {                     // 머리 위에서 터지는 반짝이
    const a = rand(-Math.PI, 0), spd = rand(90, 260);
    Game.parts.push({
      x: p.x + rand(-24, 24), y: p.y - 40,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: rand(0.5, 0.9), rot: rand(0, TAU), spin: rand(-9, 9),
      size: rand(5, 10), kind: "star",
      color: [top, bot, "#ffffff", "#ffd76a"][(Math.random() * 4) | 0]
    });
  }
}

function drawUpgradeFx() {
  const f = Game.upFx, p = Game.player;
  if (!f || !p) return;
  const k = clamp(f.t / f.life, 0, 1);
  const rise = easeOutCubic(clamp(k * 1.7, 0, 1)) * 58;          // 위로 떠오른다
  const pop = k < 0.24 ? easeOutBack(k / 0.24) : 1;              // 튀어나오는 등장
  const alpha = k > 0.7 ? 1 - (k - 0.7) / 0.3 : 1;

  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(clamp(p.x, 96, CW - 96), p.y - 62 - rise);
  ctx.scale(pop, pop);
  drawBubbleText(f.label, 0, 0, f.size, f.top, f.bot, f.outline, 1);
  if (f.sub) {                                                   // 아랫줄 알약
    ctx.font = "800 12px " + FONT;
    const w = ctx.measureText(f.sub).width + 22;
    ctx.fillStyle = "rgba(30,20,40,.62)";
    rrect(ctx, -w / 2, f.size * 0.60 + 3, w, 20, 10); ctx.fill();
    text(f.sub, 0, f.size * 0.60 + 13, 12, "#ffffff", "center", 800);
  }
  ctx.restore();
}

/* 스파크 파편 — 번개가 닿은 자리에서 튀는 작은 별 모양 불꽃 */
function sparkBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), spd = rand(120, 320);
    Game.parts.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 40,
      life: rand(0.2, 0.45), rot: rand(0, TAU), spin: rand(-20, 20),
      size: rand(7, 14), kind: "spark",
      color: Math.random() < 0.5 ? "#9ff3ff" : "#fff9a8"
    });
  }
}

/* 지지직 튀는 번개 선 — 두 점 사이를 무작위로 꺾어 잇고, 굵은 글로우 + 얇은 흰 심 */
function drawBolts() {
  for (const b of Game.bolts) {
    const k = b.life / b.max;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    /* 마디 위치를 먼저 한 번만 뽑아 둔다 — 겹쳐 그리는 세 겹이 서로 다른
     * 경로를 타면 굵어 보이는 게 아니라 그냥 지저분해진다. */
    const path = [];
    for (let i = 0; i < b.pts.length - 1; i++) {
      const a = b.pts[i], c = b.pts[i + 1];
      const seg = [{ x: a.x, y: a.y }];
      const segs = 6;
      const nx = -(c.y - a.y), ny = (c.x - a.x);
      const len = Math.hypot(nx, ny) || 1;
      for (let j = 1; j < segs; j++) {                   // 중간 마디를 좌우로 흔든다
        const t = j / segs;
        const off = rand(-13, 13) * (1 - Math.abs(t - 0.5) * 0.6);
        seg.push({ x: a.x + (c.x - a.x) * t + nx / len * off,
                   y: a.y + (c.y - a.y) * t + ny / len * off });
      }
      seg.push({ x: c.x, y: c.y });
      path.push(seg);
    }
    const trace = () => {
      ctx.beginPath();
      for (const seg of path) {
        ctx.moveTo(seg[0].x, seg[0].y);
        for (let j = 1; j < seg.length; j++) ctx.lineTo(seg[j].x, seg[j].y);
      }
      ctx.stroke();
    };
    /* 세 겹으로 굵게: 바깥 번짐 → 시안 몸통 → 흰 심 */
    const LAYERS = [
      { col: "#4fd8ff", w: 20, a: 0.30, blur: 26 },
      { col: "#7df3ff", w: 11, a: 0.75, blur: 16 },
      { col: "#ffffff", w: 5,  a: 1.00, blur: 6 }
    ];
    for (const L of LAYERS) {
      ctx.globalAlpha = L.a * clamp(k * 1.6, 0, 1);
      ctx.strokeStyle = L.col;
      ctx.lineWidth = L.w * (0.75 + k * 0.35);           // 사라지면서 가늘어진다
      ctx.shadowColor = "#7df3ff"; ctx.shadowBlur = L.blur;
      trace();
    }
    ctx.shadowBlur = 0;
    for (let i = 1; i < b.pts.length; i++) {             // 착탄점 섬광
      const p = b.pts[i];
      ctx.globalAlpha = clamp(k * 1.4, 0, 1);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(p.x, p.y, 9 + (1 - k) * 11, 0, TAU); ctx.fill();
      ctx.globalAlpha = clamp(k, 0, 1) * 0.6;
      ctx.fillStyle = "#7df3ff";
      ctx.beginPath(); ctx.arc(p.x, p.y, 17 + (1 - k) * 17, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* 미사일 착탄 — 반경 안의 적을 함께 때린다 */
function missileBlast(x, y, dmg, src, radius) {
  burst(x, y, 12, true);
  Game.shake = Math.max(Game.shake, 5);
  Sound.play("bigpop");
  const R = radius || 66;
  for (const e of Game.enemies) {
    if (e === src || e.dead) continue;
    if (dist2(x, y, e.x, e.y) > (R + e.r) * (R + e.r)) continue;
    e.hp -= Math.ceil(dmg * 0.75); e.hurt = 1;
    if (e.hp <= 0) { e.dead = true; killEnemy(e); }
  }
  Game.parts.push({ x, y, vx: 0, vy: 0, life: 0.34, rot: 0, spin: 0,
                    size: R, kind: "blast", color: "#fff3c9" });
}

/* ── 파티클 · 팝업 ─────────────────────────────────────────────────────── */
function burst(x, y, n, big) {
  const pet = Game.pet;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(60, big ? 420 : 250);
    Game.parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
      life: rand(0.5, 1.0), rot: rand(0, TAU), spin: rand(-10, 10),
      size: rand(4, big ? 12 : 8), kind: pet.particle,
      color: pet.pcolor[(Math.random() * pet.pcolor.length) | 0]
    });
  }
}
function pop(str, x, y, color) { Game.pops.push({ str, x, y, color, life: 0.9 }); }

/* ── 보스 ──────────────────────────────────────────────────────────────
 * 보스는 "적 오브젝트"로 만들어 기존 충돌·피격·렌더 경로를 그대로 태운다.
 * 대신 움직임만 별도 AI가 통제한다(강하 → 좌우 배회 → 예고 → 급강하). */
function startBoss() {
  Game.lastBossStage = Game.stage;
  Game.bossT = 0;
  Game.rushLeft = 0;
  const hp = 70 + Game.stage * 26;
  const e = {
    x: CW / 2, y: -140, r: 88, hp, maxHp: hp, speed: 0,
    type: "elite", elite: true, boss: true,
    wob: 0, flap: 0, flapSp: 3.4, hurt: 0, drift: 0,
    skin: BIRD_SKINS[(Game.stage / BOSS_EVERY) % BIRD_SKINS.length | 0],
    phase: "enter", pt: 0, diveT: 4.5, minionT: 3.2, homeY: 210
  };
  Game.boss = e;
  Game.enemies.push(e);
  Game.stageBanner = 0;
  Game.shake = 8;
  Sound.bpm = 168;                                   // BGM이 빨라진다
  Sound.play("boss");
}

function updateBoss(dt) {
  const b = Game.boss;
  if (!b) return;
  if (b.dead || Game.enemies.indexOf(b) < 0) { Game.boss = null; return; }

  Game.bossT += dt;
  b.pt += dt;
  b.flap += dt * b.flapSp;

  if (b.phase === "enter") {
    b.y += 150 * dt;
    if (b.y >= b.homeY) { b.y = b.homeY; b.phase = "idle"; b.pt = 0; }

  } else if (b.phase === "idle") {
    b.x = CW / 2 + Math.sin(Game.bossT * 0.85) * 128;
    b.y = b.homeY + Math.sin(Game.bossT * 1.6) * 12;
    b.diveT -= dt;
    b.minionT -= dt;
    if (b.minionT <= 0) {                            // 새끼 로봇 드론 사출
      b.minionT = Math.max(2.2, 3.6 - Game.stage * 0.05);
      for (const dx of [-52, 52]) {
        const m = makeEnemy(0, b.y + 30, { hp: Math.max(1, Math.round(enemyHp() * 0.7)) });
        m.type = "botling";                          // 보스와 한 세트인 꼬마 로봇
        m.r = 17;
        m.baseX = clamp(b.x + dx, 30, CW - 30);
        m.x = m.baseX;
        m.sway = rand(14, 30);
        m.speed = enemySpeed() * 1.15;
        Game.enemies.push(m);
      }
    }
    if (b.diveT <= 0) {                              // 예고 시작 — 지금 위치를 겨냥한다
      b.phase = "warn"; b.pt = 0;
      const pl = Game.player;
      b.diveX = clamp(pl ? pl.x : b.x, b.r * 0.6, CW - b.r * 0.6);
      b.diveFromX = b.x;
      Sound.play("warn");
    }

  } else if (b.phase === "warn") {                   // 급강하 예고 — 낙하 지점을 미리 보여 준다
    b.hurt = 0.6;
    /* 예고 동안 x는 목표 지점으로 미리 미끄러진다.
     * (표시만 해 두고 엉뚱한 데로 떨어지면 표시가 거짓말이 된다) */
    b.x = b.diveFromX + (b.diveX - b.diveFromX) * easeOutCubic(clamp(b.pt / BOSS_WARN, 0, 1));
    if (b.pt > BOSS_WARN) { b.phase = "dive"; b.pt = 0; b.diveFrom = b.y; }

  } else if (b.phase === "dive") {                   // 플레이어 높이까지 그대로 내리꽂는다
    const k = Math.min(1, b.pt / 0.42);
    b.x = b.diveX;
    b.y = b.diveFrom + (BOSS_DIVE_Y - b.diveFrom) * (k * k);     // 가속하며 떨어진다
    if (k >= 1) {                                    // 착지 충격
      b.phase = "back"; b.pt = 0; b.backFrom = b.y;
      Game.shake = 16;
      Sound.play("bigpop");
      for (let i = 0; i < 16; i++) {                 // 바닥에서 옆으로 퍼지는 먼지
        const sgn = i % 2 ? 1 : -1;
        Game.parts.push({
          x: b.x, y: BOSS_DIVE_Y + b.r * 0.7,
          vx: sgn * rand(120, 460), vy: rand(-190, -40),
          life: rand(0.4, 0.8), rot: rand(0, TAU), spin: rand(-10, 10),
          size: rand(5, 11), kind: "star", color: "#e6ecf5"
        });
      }
    }

  } else if (b.phase === "back") {
    const k = Math.min(1, b.pt / 0.9);
    b.y = b.backFrom + (b.homeY - b.backFrom) * k;
    if (k >= 1) { b.phase = "idle"; b.pt = 0; b.diveT = Math.max(3, 6 - Game.stage * 0.08); }
  }

  if (Game.bossT > BOSS_TIMEOUT) {                   // 오래 못 잡으면 도망간다(교착 방지)
    b.y -= 260 * dt;
    if (b.y < -160) {
      const i = Game.enemies.indexOf(b);
      if (i >= 0) Game.enemies.splice(i, 1);
      endBoss(false);
    }
  }
}

function endBoss(defeated) {
  Game.boss = null;
  Sound.bpm = 148;
  Game.spawnT = defeated ? 1.6 : 0.8;
  if (!defeated) pop("보스가 달아났다...", CW / 2, 260, "#dceaf7");
}

function bossDefeated(b) {
  const bonus = 900 + Game.stage * 140;
  Game.score += bonus;
  pop("BOSS CLEAR! +" + bonus, CW / 2, 240, "#ffd76a");
  Game.shake = 18;
  Game.flash = 0.9;
  for (let i = 0; i < 26; i++)
    Game.parts.push({ x: b.x, y: b.y, vx: rand(-380, 380), vy: rand(-420, 120),
      life: rand(0.7, 1.3), rot: rand(0, TAU), spin: rand(-12, 12), size: rand(6, 14),
      kind: Game.pet.particle, color: Game.pet.pcolor[(Math.random() * 4) | 0] });
  for (let i = 0; i < 8; i++)                        // 골드 샤워
    spawnDrop(b.x + rand(-70, 70), b.y + rand(-20, 20), "gold");
  spawnDrop(b.x - 26, b.y, weaponAvailable() ? "weapon" : shieldOr("magnet"));
  spawnDrop(b.x + 26, b.y, shieldOr("gold"));
  endBoss(true);
}

/* ── 필살기 ─────────────────────────────────────────────────────────── */
function ultReady() { return Game.ult >= ULT_NEED && Game.ultT <= 0; }

function fireUlt() {
  if (!ultReady() || Game.state !== "playing") return;
  Game.ult = 0;
  Game.ultT = ULT_TIME;
  Game.ultR = 0;
  Game.player.inv = ULT_TIME + 0.4;          // 쓸어버리는 동안은 무적
  Game.shake = 13;
  Sound.play("ult");
  pop(Game.pet.key === "cat" ? "냥냥 충격파!" : "왕왕 충격파!",
      Game.player.x, Game.player.y - 60, "#ffffff");
}

/* 충격파가 퍼지면서 닿는 적을 쓸어낸다 (엘리트는 큰 피해만) */
function updateUlt(dt) {
  if (Game.ultT <= 0) return;
  Game.ultT -= dt;
  const k = 1 - clamp(Game.ultT / ULT_TIME, 0, 1);
  const p = Game.player;
  Game.ultR = k * 980;

  for (let i = Game.enemies.length - 1; i >= 0; i--) {
    const e = Game.enemies[i];
    if (e.ulted) continue;
    if (dist2(p.x, p.y, e.x, e.y) > (Game.ultR + e.r) * (Game.ultR + e.r)) continue;
    e.ulted = true;
    if (e.elite) {
      e.hp -= Math.ceil(e.maxHp * (e.boss ? 0.22 : ULT_ELITE_DMG));   // 보스는 22%만
      e.hurt = 1;
      burst(e.x, e.y, 10);
      if (e.hp <= 0) { e.dead = true; killEnemy(e, true); }
    } else {
      e.dead = true;
      killEnemy(e, true);
    }
  }
  if (Game.ultT <= 0) { Game.ultT = 0; Game.ultR = 0; }
}

/* ── 피버타임 : 화면을 가르는 초대형 레이저 ─────────────────────────── */
function addFever(v) {
  if (Game.feverT > 0) return;
  Game.fever = Math.min(1, Game.fever + v);
  if (Game.fever >= 1) startFever();
}

function startFever() {
  Game.fever = 1;
  Game.feverT = FEVER_TIME;
  Game.feverBanner = 1.6;
  Game.player.inv = FEVER_TIME + 0.4;        // 피버 동안은 무적
  Game.feverShotT = 0;                       // 곧바로 첫 발
  Game.shake = 12;
  Sound.play("fever");
  Sound.bpm = 178;
}

/* 거대 관통탄 한 발 사출 */
function spawnFeverShot() {
  const p = Game.player;
  if (!p) return;
  Game.feverShots.push({
    x: p.x, y: p.y - 30, r: FEVER_R, vy: FEVER_VY,
    spin: rand(0, TAU), t: 0,
    wob: rand(0, TAU)
  });
  Game.shake = Math.max(Game.shake, 6);
  Sound.play("whoosh");
}

function updateFever(dt) {
  /* ── 지속시간 · 발사 주기 ── */
  if (Game.feverT > 0) {
    Game.feverT -= dt;
    if (Game.feverBanner > 0) Game.feverBanner -= dt;
    Game.feverShotT -= dt;
    if (Game.feverShotT <= 0) { spawnFeverShot(); Game.feverShotT = FEVER_GAP; }
    if (Game.feverT <= 0) {
      Game.feverT = 0;
      Game.fever = 0;
      Sound.bpm = Game.boss ? 168 : 148;
    }
  }

  /* ── 관통탄 이동 · 충돌 (피버가 끝나도 남은 탄은 화면을 마저 가른다) ── */
  const cat = Game.pet.key === "cat";
  for (let i = Game.feverShots.length - 1; i >= 0; i--) {
    const f = Game.feverShots[i];
    f.t += dt;
    f.y += f.vy * dt;
    f.spin += dt * (cat ? 0.9 : 5.2);                     // 뼈다귀는 빠르게 회전
    if (Math.random() < dt * 46) {                        // 꼬리에 흩날리는 하트·별
      Game.parts.push({
        x: f.x + rand(-f.r * 0.7, f.r * 0.7), y: f.y + rand(10, f.r * 0.8),
        vx: rand(-70, 70), vy: rand(60, 190),
        life: rand(0.4, 0.9), rot: rand(0, TAU), spin: rand(-8, 8),
        size: rand(7, 15), kind: cat ? "heart" : "star",
        color: cat ? ["#ff9ec4", "#ffd1e3", "#ffffff"][(Math.random() * 3) | 0]
                   : ["#ffd76a", "#fff0c2", "#ffffff"][(Math.random() * 3) | 0]
      });
    }

    for (let j = Game.enemies.length - 1; j >= 0; j--) {
      const e = Game.enemies[j];
      if (e.dead) continue;
      const rr = f.r + e.r;
      if (dist2(f.x, f.y, e.x, e.y) > rr * rr) continue;

      if (e.boss || e.elite) {                            // 큰 적은 겹쳐 있는 동안 지속 피해
        e.hp -= e.maxHp * (e.boss ? FEVER_BOSS : FEVER_ELITE) * dt;
        e.hurt = 1;
        if (Math.random() < dt * 30) burst(e.x, e.y + rand(-e.r, e.r), 2);
        if (e.hp <= 0) { e.dead = true; killEnemy(e, true); }
      } else {                                            // 일반 적은 닿는 즉시 소멸
        e.dead = true;
        killEnemy(e, true);
      }
    }

    if (f.y < -f.r - 60) Game.feverShots.splice(i, 1);
  }
}

function killEnemy(e, byUlt) {
  if (e.boss) { bossDefeated(e); }
  if (e.form) {                                  // 편대원이 쓰러지면 대형 카운트 감소
    e.form.left--;
    if (e.form.left <= 0) {
      formationBonus(e.form);
      const idx = Game.formations.indexOf(e.form);
      if (idx >= 0) Game.formations.splice(idx, 1);
    }
  }
  burst(e.x, e.y, e.elite ? 26 : 15, e.elite);
  const gain = byUlt ? 6 : 10;               // 필살기 처치는 점수를 조금 덜 준다
  Game.score += gain * e.maxHp;
  pop("+" + (gain * e.maxHp), e.x, e.y - 6, "#ffffff");
  Game.shake = Math.max(Game.shake, e.elite ? 10 : 3);
  Sound.play(e.elite ? "bigpop" : "pop");
  if (!byUlt) {
    Game.ult = Math.min(ULT_NEED, Game.ult + ULT_KILL);
    addFever(FEVER_KILL);
    dropFrom(e);
  }
}

/* 강화 아이템이 아직 쓸모가 있는가 (무기 만렙이면 드론으로 이어진다)
 * [버그 수정] 예전엔 무기 만렙에서 확률을 0으로 잘라 버려서,
 * 정작 드론이 열리는 시점부터 강화 아이템이 한 개도 나오지 않았다. */
/* ── 강화 아이템 등장 규칙 ────────────────────────────────────────────
 * "2스테이지에 한 개". 2스테이지를 한 구간(block)으로 묶어 그 안에서
 * 딱 한 번만 내보낸다. 게다가 구간이 끝나갈수록 확률이 가파르게 올라가
 * (아래 upgradeChance) 구간을 그냥 넘겨 버리는 일이 거의 없다.
 * — 상한만 두면 "안 나오는 구간"이 생겨 성장이 멈춘 것처럼 느껴진다. */
const WEAPON_EVERY = 2;                                  // 몇 스테이지에 한 개인가
function weaponBlock() { return Math.floor((Game.stage - 1) / WEAPON_EVERY); }
function weaponProgress() {                              // 구간을 얼마나 지나왔나 0→1
  const span = WEAPON_EVERY * STAGE_DIST;
  return clamp((Game.distance - weaponBlock() * span) / span, 0, 1);
}
/* ── 실드 등장 규칙 ────────────────────────────────────────────────────
 * 예전엔 일반 드롭(4%)·엘리트·편대 보상·보스에서 전부 나와 거의 상시
 * 실드를 두르고 다녔다. 이제 한 번 나오면 2~3판(랜덤) 동안 잠긴다.
 * 모든 출처가 이 게이트를 통과해야 하고, 막히면 골드로 대체된다. */
function shieldAvailable() { return Game.stage >= (Game.shieldNextStage || 1); }
function shieldOr(alt) { return shieldAvailable() ? "shield" : (alt || "gold"); }

function weaponAvailable() {
  /* 만렙이어도 아이템은 계속 나온다 — 먹으면 연사 강화 버프가 된다. */
  return Game.weaponBlock !== weaponBlock();
}

function canUpgrade() {
  const p = Game.player;
  return !!p && (p.wlv < MAX_WLV || p.dstep < MAX_DSTEP);
}

/* 강화는 "가끔 만나는 보상"이어야 한다. 기본 2%에서 단계가 오를수록 귀해진다. */
function upgradeChance() {
  const p = Game.player;
  if (!p) return 0.02;
  if (Game.weaponBlock === weaponBlock()) return 0;   // 이번 구간 몫은 이미 나갔다
  /* 구간 후반부일수록 확률이 치솟는다 (0% 지점 1배 → 끝 15배).
   * 앞쪽에서 일찍 터지면 그대로 좋고, 안 나오면 막판에 거의 확정으로 나온다. */
  const pity = 1 + Math.pow(weaponProgress(), 2) * 14;
  if (p.wlv < MAX_WLV) return 0.02 * [1, 0.7, 0.5, 0.32][p.wlv - 1] * pity;
  // 드론 12단계는 뒤로 갈수록 완만하게 귀해진다
  if (p.dstep < MAX_DSTEP)
    return 0.02 * [0.9, 0.8, 0.72, 0.64, 0.56, 0.48, 0.42, 0.36, 0.3, 0.27, 0.24, 0.21][p.dstep] * pity;
  return 0.02 * 0.5 * pity;                          // 만렙 — 연사 강화용으로 계속 나온다
}

function dropFrom(e) {
  const push = (type, dx) => spawnDrop(e.x + (dx || 0), e.y, type);
  if (e.elite) {
    for (let i = 0; i < 5; i++) push("gold", rand(-34, 34));
    push(Math.random() < 0.5 ? "magnet" : shieldOr("magnet"), 0);
    return;
  }
  const r = Math.random();
  let acc = 0.32;
  if (r < acc) push("gold");             // 처음엔 50%였는데 화면이 코인으로 뒤덮였다
  else if (r < (acc += upgradeChance())) push("weapon");
  else if (r < (acc += 0.05)) push("magnet");
  else if (r < (acc += 0.04)) push(shieldOr("gold"));
}

function gameOver() {
  const p = Game.player;
  burst(p.x, p.y, 24, true);
  Game.shake = 14;
  Game.state = "over";
  Game.overT = 0.8;
  Sound.play("hit");
  Sound.play("over");
  if (Game.score > (Game.best.score || 0)) {
    Game.newRecord = true;
    Game.best = { score: Game.score, gold: Game.gold, stage: Game.stage };
    try { localStorage.setItem(BEST_KEY, JSON.stringify(Game.best)); } catch (e) { /* 무시 */ }
  }
}

/* =========================================================================
 * 메인 업데이트
 * ========================================================================= */
function update(dt) {
  Game.timer += dt;
  Game.shake = Math.max(0, Game.shake - dt * 26);
  Sound.sync(Game.state);

  if (pressed.KeyM) Sound.toggle();
  if (pressed.KeyP && (Game.state === "playing" || Game.state === "paused"))
    Game.state = Game.state === "playing" ? "paused" : "playing";
  if (pressed.Space || pressed.Enter) {
    if (Game.state === "title") { if (Game.titleT > 0.6) { Game.state = "select"; Sound.play("stage"); } }
    else if (Game.state === "select") startGame(Game.pet.key);
    else if (Game.state === "over" && Game.overT <= 0) Game.state = "select";
    else if (Game.state === "playing") fireUlt();          // Space = 필살기
  }
  if (pressed.KeyX && Game.state === "playing") fireUlt();
  if (pressed.KeyU && Game.state === "playing" && Game.player) {   // [테스트] 강화 즉시 획득
    spawnDrop(Game.player.x, Game.player.y - 40, "weapon", { vx: 0, vy: -60 });
    Game.weaponBlock = -1;                 // 테스트 키는 구간 제한을 받지 않는다
  }
  if (Game.state === "over") Game.overT = Math.max(0, Game.overT - dt);
  if (Game.state === "title") updateTitle(dt);

  updateParticles(dt);
  if (Game.state !== "playing") { clearPressed(); return; }

  /* ── 비행 거리 · 스테이지 ── */
  Game.distance += SCROLL_SPEED * dt;
  Game.stage = 1 + Math.floor(Game.distance / STAGE_DIST);
  if (Game.stage !== Game.lastStage) {               // 스테이지가 올라간 순간
    Game.lastStage = Game.stage;
    Game.stageBanner = 1.8;
    Game.flash = 0.35;
    Sound.play("stage");
    /* 세대 교체 스테이지에 도달하면 별도의 경고 배너 — 적 그림이 통째로 바뀐다 */
    const tr = enemyTier(Game.stage);
    if (tr > Game.tierShown) {
      Game.tierShown = tr;
      Game.tierBanner = 2.4;
      Game.flash = 0.8;
      Game.shake = Math.max(Game.shake, 10);
      Sound.play("bigpop");
    }
  }
  // 5스테이지마다 보스
  if (!Game.boss && Game.stage % BOSS_EVERY === 0 && Game.stage !== Game.lastBossStage)
    startBoss();
  updateBoss(dt);

  /* ── 플레이어 이동 (좌우 전용) ── */
  const p = Game.player;
  if (pointerX !== null) {
    p.x += (pointerX - p.x) * Math.min(1, dt * 16);      // 드래그를 부드럽게 따라간다
  } else {
    const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    p.x += dir * MOVE_SPEED * dt;
  }
  p.x = clamp(p.x, p.r + 6, CW - p.r - 6);
  p.tilt += (clamp((p.x - (p.lastX === undefined ? p.x : p.lastX)) * 0.06, -0.35, 0.35) - p.tilt) * Math.min(1, dt * 10);
  p.lastX = p.x;
  p.flap += dt * 14;
  if (p.magnet > 0) p.magnet -= dt;
  if (p.inv > 0) p.inv -= dt;
  if (p.rapidT > 0) {                          // 연사 강화
    p.rapidT -= dt;
    if (p.rapidT <= 0) { p.rapidT = 0; pop("연사 강화 종료", p.x, p.y - 44, "#ffd76a"); }
  }
  if (p.shield > 0) {                          // 실드 지속시간
    p.shieldT -= dt;
    if (p.shieldT <= 0) {                      // 시간이 다하면 남은 개수까지 전부 사라진다
      p.shield = 0; p.shieldT = 0;
      pop("실드 해제", p.x, p.y - 44, "#a7f0c6");
      Sound.play("hit");
      for (let i = 0; i < 12; i++) {           // 깨져 흩어지는 조각
        const a = rand(0, TAU);
        Game.parts.push({
          x: p.x + Math.cos(a) * 34, y: p.y - 2 + Math.sin(a) * 34,
          vx: Math.cos(a) * rand(80, 220), vy: Math.sin(a) * rand(80, 220) - 40,
          life: rand(0.3, 0.6), rot: rand(0, TAU), spin: rand(-10, 10),
          size: rand(4, 8), kind: "star", color: "#a7f0c6"
        });
      }
    }
  }

  /* ── 자동 발사 ── */
  Game.fireT -= dt;
  if (Game.fireT <= 0) fire();                 // 발사 간격은 무기 레벨이 정한다
  fireDrones(dt);                              // 드론은 별도 주기로 사격

  /* ── 편대 스폰 (보스전 중에는 멈춘다) ── */
  if (!Game.boss) {
    Game.spawnT -= dt;
    if (Game.spawnT <= 0) {
      if (Game.rushLeft > 0) {                       // 러시: 몰아치는 구간
        spawnWave();
        Game.rushLeft--;
        Game.spawnT = Game.rushLeft > 0 ? RUSH_GAP : spawnGap() + CALM_EXTRA;  // 끝나면 소강
      } else {
        spawnWave();
        Game.waveCount++;
        if (Game.waveCount % RUSH_EVERY === 0) {     // 다음은 러시
          Game.rushLeft = RUSH_WAVES;
          Game.rushBanner = 1.4;
          Game.spawnT = 0.75;
          Sound.play("rush");
        } else Game.spawnT = spawnGap();
      }
    }
  }
  if (Game.rushBanner > 0) Game.rushBanner -= dt;
  if (Game.stageBanner > 0) Game.stageBanner -= dt;
  if (Game.tierBanner > 0)  Game.tierBanner  -= dt;

  /* ── 미사일 ── */
  for (let i = Game.bullets.length - 1; i >= 0; i--) {
    const b = Game.bullets[i];
    b.t += dt; b.spin += dt * 14;

    if (b.homing > 0) {                                  // 유도탄 (고양이 본체 · 드론 미사일)
      /* [표적 락온] 매 프레임 "가장 가까운 적"을 새로 고르면 표적이 계속 바뀌며
       * 갈팡질팡하고, 이미 지나쳐 뒤로 간 적까지 골라 되돌아가느라 탄을 버렸다.
       * → 한 번 문 표적을 끝까지 쫓고, 그 적이 사라졌을 때만 다시 고른다.
       *   후보는 "아직 앞(위쪽)에 있는 적"으로 한정한다. */
      const lost = !b.lock || b.lock.dead || b.lock.gone ||
                   b.lock.y > b.y + 30 || Game.enemies.indexOf(b.lock) < 0;
      if (lost) {
        if (b.lock) b.lock = null;                 // 사라진 적의 카운터는 되돌릴 필요가 없다
        setLock(b, acquireTarget(b));
      }
      if (b.lock) {
        const want = Math.atan2(b.lock.y - b.y, b.lock.x - b.x);
        let cur = Math.atan2(b.vy, b.vx);
        let diff = ((want - cur + Math.PI * 3) % TAU) - Math.PI;
        cur += clamp(diff, -b.homing * dt, b.homing * dt);
        let sp2 = Math.hypot(b.vx, b.vy);
        if (b.accel) sp2 = Math.min(b.vmax || 900, sp2 + b.accel * dt);  // 물면 가속한다
        b.vx = Math.cos(cur) * sp2; b.vy = Math.sin(cur) * sp2;
      }
    }

    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -30 || b.x < -30 || b.x > CW + 30) {
      releaseLock(b);                                    // 예약해 둔 피해량을 돌려준다
      Game.bullets.splice(i, 1); continue;
    }

    for (const e of Game.enemies) {                      // 적중 판정
      if (e.y < -e.r) continue;
      if (dist2(b.x, b.y, e.x, e.y) > (e.r + b.r) * (e.r + b.r)) continue;
      releaseLock(b);
      e.hp -= b.dmg; e.hurt = 1;
      Game.bullets.splice(i, 1);
      const wasBlast = b.blast;
      if (e.hp <= 0) { e.dead = true; killEnemy(e); }
      else burst(b.x, b.y, 3);
      if (wasBlast) missileBlast(b.x, b.y, b.dmg, e, wasBlast);   // 범위 폭발
      break;
    }
  }

  updateUlt(dt);                               // 필살기 충격파
  updateFever(dt);                             // 피버 관통탄

  /* ── 편대 대형 이동 ── */
  updateFormations(dt);

  /* ── 적 ── */
  for (let i = Game.enemies.length - 1; i >= 0; i--) {
    const e = Game.enemies[i];
    if (e.dead) { Game.enemies.splice(i, 1); continue; }
    e.y += e.speed * dt;
    e.wob += dt * 3;
    e.flap += dt * (e.flapSp || 8);
    if (e.form) e.y -= e.speed * dt;                 // 편대원은 대형이 위치를 정한다
    else if (e.baseX !== undefined)                  // 낱개는 라인 안에서 살랑살랑
      e.x = clamp(e.baseX + Math.sin(e.wob * (e.swaySp || 1) + e.swayPh) * e.sway,
                  e.r, CW - e.r);
    if (e.hurt > 0) e.hurt -= dt * 4;
    if (e.elite) {
      e.x = clamp(e.x + Math.sin(e.wob * 0.5) * (e.drift || 0) * dt, e.r, CW - e.r);
    }
    if (e.gone || e.y - e.r > CH + 20) { Game.enemies.splice(i, 1); continue; }

    if (p.inv <= 0 && dist2(p.x, p.y, e.x, e.y) < (p.r + e.r * 0.82) * (p.r + e.r * 0.82)) {
      if (p.shield > 0) {                                // 실드가 1회 막아 준다
        p.shield--; p.inv = 1.2;
        if (p.shield <= 0) p.shieldT = 0;                // 마지막 장이 깨지면 타이머도 끝
        burst(p.x, p.y, 14);
        Game.shake = 9;
        Sound.play("bigpop");
        if (!e.elite) { e.dead = true; killEnemy(e); }
      } else { gameOver(); return; }
    }
  }

  /* ── 아이템 ── */
  for (let i = Game.drops.length - 1; i >= 0; i--) {
    const d = Game.drops[i];
    d.t += dt;
    const heavy = d.type === "gold";
    const dx = p.x - d.x, dy = p.y - d.y, len = Math.hypot(dx, dy) || 1;

    /* 중력 가속 — 종단 속도까지 매 프레임 빨라진다 */
    d.vy = Math.min(heavy ? DROP_VMAX.gold : DROP_VMAX.item,
                    d.vy + (heavy ? DROP_G.gold : DROP_G.item) * dt);

    if (p.magnet > 0 && d.type === "gold" && len < 300) {   // 자석: 멀리서도 끌어당긴다
      d.x += (dx / len) * 470 * dt; d.y += (dy / len) * 470 * dt;
      d.vy *= Math.pow(0.05, dt);                           // 끌려오는 동안은 낙하 속도를 죽인다
      d.vx *= Math.pow(0.05, dt);
    } else {
      if (len < 86) {                                       // 코앞이면 살짝 빨려온다
        d.x += (dx / len) * 150 * dt; d.y += (dy / len) * 90 * dt + d.vy * dt * 0.5;
      } else d.y += d.vy * dt;

      d.x += d.vx * dt;                                     // 튀어나간 옆방향은 서서히 잦아든다
      d.vx *= Math.pow(DROP_DRAG, dt);
      if (d.x < 14) { d.x = 14; d.vx = Math.abs(d.vx) * 0.55; }              // 벽에서 튕긴다
      else if (d.x > CW - 14) { d.x = CW - 14; d.vx = -Math.abs(d.vx) * 0.55; }
    }

    if (d.y > CH + 24) { Game.drops.splice(i, 1); continue; }
    if (dist2(p.x, p.y, d.x, d.y) < 30 * 30) {
      if (d.type === "gold") {
        Game.gold++; Game.score += 5;
        Game.ult = Math.min(ULT_NEED, Game.ult + ULT_GOLD);
        addFever(FEVER_GOLD);                        // 골드가 피버를 채운다
        Sound.play("coin"); pop("+1 G", d.x, d.y, "#ffd76a");
      }
      else if (d.type === "weapon") {
        if (p.wlv < MAX_WLV) {                            // 무기 강화
          p.wlv++;
          upgradeFx("업그레이드", "무기 LV." + p.wlv, "#ffe0ec", "#ff6f9c", "#7a1a3c");
          Game.shake = Math.max(Game.shake, 5);
        } else if (p.dstep < MAX_DSTEP) {                 // 만렙 이후엔 드론으로
          p.dstep++;
          const sp = droneSpec();
          upgradeFx("업그레이드", "드론 " + sp.name + " ★" + sp.rank,
                    "#ffffff", DRONE_COLORS[sp.form], "#20304a");
          Game.shake = Math.max(Game.shake, 6);
        } else {                                          // 더 올릴 게 없다 → 연사 강화
          p.rapidT = RAPID_TIME;
          Game.gold += 3;
          upgradeFx("MAX", "연사 +50%  " + RAPID_TIME.toFixed(0) + "초",
                    "#fff6c4", "#ffb03a", "#7a4a0c", 44);
          Game.shake = Math.max(Game.shake, 7);
        }
        Sound.play("power");
      }
      else if (d.type === "magnet") { p.magnet = MAGNET_TIME; Sound.play("power"); pop("자석!", d.x, d.y, "#8fd9ff"); }
      else {                                              // 실드
        p.shield = Math.min(2, p.shield + 1);
        p.shieldT = SHIELD_TIME;                          // 먹을 때마다 시간이 새로 찬다
        Sound.play("power");
        pop("실드! " + SHIELD_TIME.toFixed(0) + "초", d.x, d.y, "#a7f0c6");
      }
      Game.drops.splice(i, 1);
    }
  }

  clearPressed();
}

function updateParticles(dt) {
  for (let i = Game.parts.length - 1; i >= 0; i--) {
    const s = Game.parts[i];
    s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt;
    s.vy += (s.kind === "spark" ? 140 : 620) * dt; s.vx *= 0.99; s.rot += s.spin * dt;
    if (s.life <= 0) Game.parts.splice(i, 1);
  }
  if (Game.upFx) {
    Game.upFx.t += dt;
    if (Game.upFx.t >= Game.upFx.life) Game.upFx = null;
  }
  for (let i = Game.bolts.length - 1; i >= 0; i--) {
    Game.bolts[i].life -= dt;
    if (Game.bolts[i].life <= 0) Game.bolts.splice(i, 1);
  }
  for (let i = Game.pops.length - 1; i >= 0; i--) {
    const q = Game.pops[i];
    q.life -= dt; q.y -= 34 * dt;
    if (q.life <= 0) Game.pops.splice(i, 1);
  }
}

function clearPressed() { for (const k in pressed) delete pressed[k]; }

/* =========================================================================
 * [1·2·5단계] 렌더링 — 배경 · 펫 · 적 · 미사일 · 아이템 · UI
 * ========================================================================= */

/* ── 아이템 낙하 물리 ───────────────────────────────────────────────────
 * 예전엔 모든 아이템이 초당 95px 등속으로 스르륵 내려와 "떨어진다"는 느낌이
 * 없었다. 이제는 터질 때 위로 팍 튀어올랐다가 중력으로 점점 빨라지며 낙하한다.
 * 골드는 묵직하게(가속 크게), 강화·실드처럼 놓치면 아쉬운 아이템은
 * 가볍게(가속 작게·종단속도 낮게) 떨어져 잡을 시간을 남겨 준다. */
const DROP_G    = { gold: 300, item: 170 };   // 중력 가속도 (px/s^2)
const DROP_VMAX = { gold: 330, item: 200 };   // 종단 속도 — 무한히 빨라지진 않는다
const DROP_DRAG = 0.22;                       // 좌우 흩어짐이 잦아드는 비율(1초당)

/* 아이템 사출 — 폭발 지점에서 위로 튀었다가 중력에 실려 떨어진다 */
function spawnDrop(x, y, type, o) {
  o = o || {};
  /* 강화 아이템이 화면에 나온 스테이지를 기록해 둔다.
   * 모든 드롭이 이 함수를 지나므로 여기 한 곳만 찍으면 된다. */
  if (type === "weapon") Game.weaponBlock = weaponBlock();
  /* 실드가 하나 나가면 2~3판 뒤에야 다시 나온다 (간격은 매번 랜덤) */
  if (type === "shield") Game.shieldNextStage = Game.stage + (Math.random() < 0.5 ? 2 : 3);
  const heavy = type === "gold";
  Game.drops.push({
    x, y, type, t: 0,
    vx: o.vx !== undefined ? o.vx : rand(-105, 105) * (heavy ? 1 : 0.5),
    vy: o.vy !== undefined ? o.vy : rand(-195, -85) * (heavy ? 1 : 0.7)
  });
}

/* ── 배경 : 바이옴(지형) × 시간대 ───────────────────────────────────────
 * 스테이지가 깊어지면 "지나가는 땅" 자체가 바뀐다.
 *   1~29   하늘   : 구름바다 위
 *   30~59  숲     : 침엽수 캔버스와 굽이치는 강 위
 *   60~89  바닷가 : 파도치는 바다와 오른쪽 모래사장 위
 *   90~    우주   : 성운과 별, 그리고 멀리서 옆으로 흘러가는 지구
 * 각 바이옴 안에서는 예전처럼 5스테이지마다 시간대가 한 칸씩 흘러
 * 아침 → 한낮 → 노을 → 밤 순으로 "서서히 어두워진다".
 * 바이옴이 바뀔 때도 같은 1.4초 크로스페이드를 그대로 쓰므로
 * 하늘색도 지형도 툭 끊기지 않고 서로 녹아든다. */
const clouds = [];
for (let i = 0; i < 11; i++)
  clouds.push({ x: rand(0, CW), y: rand(-100, CH), s: rand(26, 62),
                sp: rand(28, 70), a: rand(0.45, 0.95) });
const sparks = [];
for (let i = 0; i < 26; i++)
  sparks.push({ x: rand(0, CW), y: rand(0, CH), r: rand(1, 2.6), sp: rand(90, 200) });

const BIOME_START = [1, 30, 60, 90];
function biomeIndex(st) { return st >= 90 ? 3 : st >= 60 ? 2 : st >= 30 ? 1 : 0; }

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모찌 오목 AI — iorikim</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff5f7,#eee9ff);font-family:'Gowun Dodum',sans-serif;color:#503b58}.wrap{max-width:1050px;margin:auto;padding:26px 22px;display:grid;grid-template-columns:320px minmax(360px,640px);gap:34px;align-items:center}.card{background:#fffdfd;border:3px solid white;border-radius:28px;box-shadow:0 16px 45px #b6a3bd55;padding:24px}.title{font:2.35rem Jua;color:#ef7196;margin:0}.title span{color:#8d7ade}.sub{color:#9b8494;font-size:.9rem;margin:8px 0 24px}.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:10px 0 24px}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#fff0b5;font-size:2.6rem;border:4px solid #fff}.avatar.ai{background:#eadfff}.vs{font:1.4rem Jua;color:#f2a6bd}.label{font:1.1rem Jua;margin-top:8px}.stone{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:-3px;margin-right:5px;background:radial-gradient(circle at 30% 25%,#8c969f,#202532 65%)}.stone.white{background:radial-gradient(circle at 30% 25%,#fff,#d8d2df 72%);border:1px solid #c3bccb}.section{font:1.15rem Jua;margin:20px 0 9px}.levels{display:flex;gap:7px}.level{flex:1;border:2px solid #eee0ec;border-radius:13px;padding:8px 2px;background:white;color:#9a8192;font:1rem Jua;cursor:pointer}.level.active{background:#8d7ade;border-color:#8d7ade;color:white;box-shadow:0 5px 12px #8d7ade55}.tip{background:#fff4ba;padding:12px;border-radius:14px;font-size:.84rem;line-height:1.55;margin-top:23px}.new{width:100%;border:0;border-radius:15px;background:#ef7196;color:#fff;padding:13px;font:1.15rem Jua;cursor:pointer;margin-top:18px;box-shadow:0 6px 0 #d85b7e}.new:active{transform:translateY(3px);box-shadow:0 3px 0 #d85b7e}.game{position:relative}.boardcard{padding:18px;background:#fffdfd;border-radius:30px;box-shadow:0 16px 45px #b6a3bd55}.status{height:38px;display:flex;align-items:center;justify-content:center;white-space:nowrap;text-align:center;font:1.25rem Jua;margin-bottom:12px;color:#73607a}.status b{color:#ef7196}canvas{display:block;width:100%;aspect-ratio:1;border-radius:17px;background:#f4c87c;box-shadow:inset 0 0 0 8px #e5aa58;cursor:pointer}.badge{position:absolute;right:-8px;top:-14px;background:#8d7ade;color:white;padding:8px 13px;border-radius:20px;font:1rem Jua;transform:rotate(5deg)}@media(max-width:760px){.wrap{display:block;padding:16px}.card{margin-bottom:20px}.title{font-size:2rem}.boardcard{padding:12px}.status{font-size:1.05rem}}
</style></head><body><main class="wrap"><aside class="card"><h1 class="title">모찌 오목 <span>AI</span></h1><p class="sub">말랑말랑한 한 판, 다섯 개를 먼저 이어보세요!</p><div class="players"><div><div class="avatar">🐰</div><div class="label"><i class="stone"></i>나</div></div><div class="vs">VS</div><div><div class="avatar ai">🐻</div><div class="label"><i class="stone white"></i>모찌 AI</div></div></div><div class="section">난이도 선택</div><div class="levels"><button class="level" data-d="easy">쉬움</button><button class="level active" data-d="medium">중간</button><button class="level" data-d="hard">어려움</button></div><div class="tip">💡 검은 돌은 나, 하얀 돌은 모찌 AI예요.<br>가로·세로·대각선으로 5개를 이어 승리하세요.</div><button class="new" id="reset">새 게임 시작하기 ✨</button></aside><section class="game"><div class="badge" id="difficulty">중간 모드</div><div class="boardcard"><div class="status" id="status"><b>내 차례!</b> 원하는 곳을 눌러주세요</div><canvas id="board" width="640" height="640" aria-label="오목 보드"></canvas></div></section></main><script>
const N=15,cv=document.querySelector('#board'),ctx=cv.getContext('2d'),status=document.querySelector('#status');let b,turn,over,diff='medium',last;
function reset(){b=Array.from({length:N},()=>Array(N).fill(0));turn=1;over=false;last=null;status.innerHTML='<b>내 차례!</b> 원하는 곳을 눌러주세요';draw()}function draw(){let w=640/(N+1),c=ctx; c.clearRect(0,0,640,640);c.strokeStyle='#a66f3d';c.lineWidth=2;for(let i=1;i<=N;i++){c.beginPath();c.moveTo(w,i*w);c.lineTo(N*w,i*w);c.stroke();c.beginPath();c.moveTo(i*w,w);c.lineTo(i*w,N*w);c.stroke()}[[4,4],[12,4],[8,8],[4,12],[12,12]].forEach(([x,y])=>{c.fillStyle='#9b6637';c.beginPath();c.arc(x*w,y*w,4,0,7);c.fill()});for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(b[y][x]){let g=c.createRadialGradient((x+1)*w-w*.3,(y+1)*w-w*.35,2,(x+1)*w,(y+1)*w,w*.47);if(b[y][x]===1){g.addColorStop(0,'#73808a');g.addColorStop(.55,'#26303b');g.addColorStop(1,'#111722')}else{g.addColorStop(0,'#fff');g.addColorStop(.65,'#eee7f0');g.addColorStop(1,'#beb7c3')}c.fillStyle=g;c.beginPath();c.arc((x+1)*w,(y+1)*w,w*.42,0,7);c.fill();if(last&&last[0]===x&&last[1]===y){c.strokeStyle='#ef7196';c.lineWidth=3;c.beginPath();c.arc((x+1)*w,(y+1)*w,w*.18,0,7);c.stroke()}}}
function win(x,y,p){for(let [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]){let n=1;for(let s of [-1,1])for(let k=1;k<5&&b[y+dy*k*s]?.[x+dx*k*s]===p;k++)n++;if(n>=5)return true}return false}function cells(){let a=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!b[y][x])a.push([x,y]);return a}function nearby(){let a=cells().filter(([x,y])=>{for(let yy=Math.max(0,y-2);yy<=Math.min(N-1,y+2);yy++)for(let xx=Math.max(0,x-2);xx<=Math.min(N-1,x+2);xx++)if(b[yy][xx])return true;return false});return a.length?a:[[7,7]]}function line(x,y,p,dx,dy){let n=1;for(let s of[-1,1])for(let k=1;k<5&&b[y+dy*k*s]?.[x+dx*k*s]===p;k++)n++;return n}function score(x,y,p){let s=0;for(let d of [[1,0],[0,1],[1,1],[1,-1]]){let n=line(x,y,p,...d);s+=[0,2,12,120,1800,50000][n]||0}return s}function choose(){let a=nearby();if(diff==='easy')return a[Math.floor(Math.random()*a.length)];let best=[],max=-1;for(let [x,y] of a){b[y][x]=2;let attack=score(x,y,2),w=win(x,y,2);b[y][x]=1;let defend=score(x,y,1),block=win(x,y,1);b[y][x]=0;let v=(w?1e8:0)+(block?5e7:0)+attack+(diff==='hard'?defend*.95:defend*.68)+Math.random()*(diff==='hard'?10:260);if(v>max){max=v;best=[[x,y]]}else if(v>max-50)best.push([x,y])}return best[Math.floor(Math.random()*best.length)]}function showResult(p){let win=p===1;let box=document.createElement('div');box.className='result';box.innerHTML='<div class=burst>'+ (win?'🎉 ✨ 🎊':'🌧️ 🐻 💜') +'</div><div class=resultcard><div class=resultemoji>'+ (win?'🐰':'🐻') +'</div><h2>'+ (win?'이겼어요!':'모찌 AI의 승리!') +'</h2><p>'+ (win?'완벽한 5목이에요. 정말 잘했어요!':'아쉬워요! 다음 판에서 복수해요.') +'</p><button>한 판 더 하기 ✨</button></div>';document.body.append(box);box.querySelector('button').onclick=()=>{box.remove();reset()}}function place(x,y,p){b[y][x]=p;last=[x,y];draw();if(win(x,y,p)){over=true;status.innerHTML=p===1?'<b>축하해요! 🎉</b> 내가 이겼어요!':'<b>모찌 AI 승리!</b> 다음엔 이겨봐요 🐻';showResult(p);return true}if(!cells().length){over=true;status.textContent='무승부! 꽤 멋진 대국이었어요.';return true}}cv.addEventListener('click',e=>{if(over||turn!==1)return;let r=cv.getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*(N+1)-1),y=Math.round((e.clientY-r.top)/r.height*(N+1)-1);if(x<0||y<0||x>=N||y>=N||b[y][x])return;if(place(x,y,1))return;turn=2;status.textContent='모찌 AI가 생각 중이에요... 🐻';setTimeout(()=>{if(over)return;let [ax,ay]=choose();if(place(ax,ay,2))return;turn=1;status.innerHTML='<b>내 차례!</b> 좋은 자리를 골라보세요'},diff==='easy'?450:diff==='medium'?600:760)});document.querySelectorAll('.level').forEach(q=>q.onclick=()=>{diff=q.dataset.d;document.querySelectorAll('.level').forEach(x=>x.classList.toggle('active',x===q));document.querySelector('#difficulty').textContent={easy:'쉬움 모드',medium:'중간 모드',hard:'어려움 모드'}[diff];reset()});document.querySelector('#reset').onclick=reset;reset();
document.head.insertAdjacentHTML('beforeend','<style>.result{position:fixed;z-index:9;inset:0;display:grid;place-items:center;background:#51405b55;backdrop-filter:blur(4px);animation:fade .25s}.resultcard{position:relative;text-align:center;background:#fffdfd;border:5px solid #fff;border-radius:30px;padding:25px 38px 28px;box-shadow:0 22px 55px #4a314b77;animation:pop .38s}.resultemoji{font-size:3.6rem;line-height:1}.result h2{font:2rem Jua;color:#ef7196;margin:7px 0}.result p{margin:0 0 18px;color:#806c80}.result button{border:0;border-radius:14px;background:#8d7ade;color:white;padding:12px 22px;font:1.1rem Jua;cursor:pointer}.burst{position:absolute;top:20%;font-size:2rem;letter-spacing:10px;animation:float .8s infinite alternate}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:scale(1)}}@keyframes float{to{transform:translateY(-10px) rotate(3deg)}}</style>');</script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Dodum&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap');
    :root{--ink:#eddfbf;--muted:#a79678;--accent:#e5b864;--dark:#071113;--panel:#102225}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 50% 0,#284447 0,#102528 41%,#071113 80%);font-family:'Gowun Dodum',sans-serif;overflow-x:hidden}
    body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.26;background:repeating-linear-gradient(100deg,transparent 0 17px,#fff1 18px 19px,transparent 20px 42px)}
    .shell{width:min(1320px,96vw);margin:auto;padding:28px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;margin:0 12px 19px}.brand small{display:block;font:500 .67rem/1 'DM Mono',monospace;letter-spacing:.24em;color:var(--accent);margin-bottom:7px}.brand h1{margin:0;font:800 clamp(1.7rem,4vw,3rem)/.88 'Playfair Display',serif;letter-spacing:-.055em}.tag{font:500 .72rem 'DM Mono',monospace;color:#bdad8d;border:1px solid #b7965d66;border-radius:999px;padding:10px 13px;background:#0b1719aa}
    .stage{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;align-items:center}.game{min-width:0}.table-wrap{position:relative;border-radius:26px;padding:9px;background:#e6d4a6;box-shadow:0 26px 60px #000a,0 0 0 1px #fff4;overflow:hidden}.table-wrap:after{content:'';position:absolute;inset:9px;border-radius:18px;box-shadow:inset 0 0 45px #001b19bb;pointer-events:none}canvas{display:block;width:100%;height:auto;border-radius:18px;cursor:crosshair;touch-action:none;background:#0c604b}.help{display:flex;justify-content:center;gap:17px;margin:16px 5px 0;color:#d8c8a6;font-size:.9rem}.key{font:500 .71rem 'DM Mono',monospace;color:#131d1e;background:#e8d9b9;border-radius:4px;padding:3px 6px;margin-right:5px}
    .side{background:linear-gradient(155deg,#173438ef,#0c1b1eef);border:1px solid #e7c67945;border-radius:20px;padding:20px;box-shadow:0 20px 40px #0006}.side h2{font:600 1.35rem 'Playfair Display',serif;margin:0 0 16px;color:#f7e3b2}.stat{padding:15px 0;border-top:1px solid #dfc38230}.stat:first-of-type{border-top:0}.stat label{display:block;color:var(--muted);font:500 .66rem 'DM Mono',monospace;letter-spacing:.12em;margin-bottom:7px}.stat strong{font:600 1.85rem/1 'DM Mono',monospace;color:#fff4df}.stat strong small{font-size:.65rem;color:var(--muted)}.status{font-size:.84rem;line-height:1.6;color:#d4c6aa;margin:3px 0 18px;min-height:45px}.new{width:100%;border:0;border-radius:11px;background:linear-gradient(135deg,#eac36f,#b88235);color:#1c1710;font:500 .84rem 'Gowun Dodum',sans-serif;padding:13px;cursor:pointer;box-shadow:0 7px 18px #0004}.new:hover{filter:brightness(1.1)}
    .toast{position:fixed;left:50%;top:28%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;background:#f4d884;color:#202017;border-radius:999px;padding:13px 22px;font:600 1rem 'Gowun Dodum',sans-serif;box-shadow:0 12px 32px #0009;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
    @media(max-width:800px){.shell{width:min(630px,94vw);padding-top:18px}.stage{grid-template-columns:1fr;gap:14px}.side{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:14px 18px}.side h2,.status,.new{grid-column:1/-1}.side h2{margin-bottom:4px}.stat{border-top:0;border-left:1px solid #dfc38230;padding:9px 11px}.stat:first-of-type{border-left:0}.stat strong{font-size:1.35rem}.help{font-size:.74rem;gap:8px}.tag{display:none}}@media(max-width:430px){.top{margin-inline:2px}.side{grid-template-columns:1fr 1fr}.stat:last-of-type{grid-column:1/-1;border-left:0;border-top:1px solid #dfc38230}.table-wrap{padding:5px;border-radius:17px}canvas{border-radius:13px}}

<body>
  <a href="../index.html" data-i18n="common.backHome" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(7,17,19,.55);color:#eddfbf;font:700 13px/1 'Gowun Dodum',sans-serif;padding:9px 14px;border-radius:999px;text-decoration:none;backdrop-filter:blur(6px);">← 홈으로</a>
  <main class="shell"><header class="top"><div class="brand"><small>SOLO TABLE</small><h1>Midnight Pocket</h1></div><div class="tag">DRAG TO SHOOT</div></header>
    <section class="stage"><div class="game"><div class="table-wrap"><canvas id="table" width="960" height="540" aria-label="포켓볼 테이블. 흰 공을 드래그해서 샷을 칩니다."></canvas></div><div class="help"><span><b class="key">DRAG</b>큐를 당기기</span><span><b class="key">RELEASE</b>샷 하기</span><span><b class="key">R</b>새 게임</span></div></div>
      <aside class="side"><h2>Table Card</h2><div class="stat"><label>SCORE</label><strong id="score">0</strong></div><div class="stat"><label>BALLS LEFT</label><strong id="left">9 <small>/ 9</small></strong></div><div class="stat"><label>BEST</label><strong id="best">0</strong></div><p class="status" id="status">흰 공을 반대 방향으로 당긴 뒤 놓아주세요.</p><button class="new" id="reset">새 테이블 열기</button></aside>
    </section></main><div class="toast" id="toast"></div>
  <script>
  const c=document.querySelector('#table'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),leftEl=document.querySelector('#left'),bestEl=document.querySelector('#best'),statusEl=document.querySelector('#status'),toast=document.querySelector('#toast');
  const W=c.width,H=c.height, R=17, felt={l:88,r:869,t:80,b:440};
  const pockets=[[61,61],[480,52],[899,61],[61,480],[480,488],[899,480]]; let balls=[],aim=null,score=0,shot=false,toastTimer;
  const colors=['#f2c842','#2c73c9','#db4441','#7440a0','#ec842f','#2c9b72','#8d2b35','#17191a'];
  let best=+localStorage.midnightPocketBest||0; bestEl.textContent=best;
  const ping=(f=360,d=.07,v=.055)=>{try{let ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}};
  function show(s){toast.textContent=s;toast.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('on'),900)}
  function rack(){balls=[{x:235,y:270,vx:0,vy:0,n:0,color:'#fbf6e9',cue:true,live:true}];const layout=[[0,0],[1,-17],[1,17],[2,-34],[2,0],[2,34],[3,-17],[3,17]];for(let k=0;k<8;k++){let[col,off]=layout[k];balls.push({x:690+col*30,y:270+off,vx:0,vy:0,n:k+1,color:colors[k],live:true})} score=0;shot=false;aim=null;scoreEl.textContent=score;leftEl.innerHTML='8 <small>/ 8</small>';statusEl.textContent='1~8번 공을 모두 넣어보세요. 8번은 검은 공입니다.';draw()}
  function p(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  function moving(){return balls.some(b=>b.live&&Math.hypot(b.vx,b.vy)>.14)}
  function cue(){return balls[0]}
  c.addEventListener('pointerdown',e=>{if(moving()||!cue().live)return;let q=p(e),b=cue();if(Math.hypot(q.x-b.x,q.y-b.y)<48){aim=q;c.setPointerCapture(e.pointerId);draw()}});
  c.addEventListener('pointermove',e=>{if(aim){aim=p(e);draw()}});
  c.addEventListener('pointerup',e=>{if(!aim)return;let q=p(e),b=cue(),dx=b.x-q.x,dy=b.y-q.y,pow=Math.min(18,Math.hypot(dx,dy)/10);if(pow>1){b.vx=dx/Math.hypot(dx,dy)*pow;b.vy=dy/Math.hypot(dx,dy)*pow;shot=true;statusEl.textContent='공들이 멈출 때까지 기다려주세요.';ping(240,.09,.07)}aim=null;draw()});
  document.querySelector('#reset').onclick=rack;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')rack()});
  function pocket(b){b.live=false;b.vx=b.vy=0;if(b.cue){setTimeout(()=>{b.live=true;b.x=235;b.y=270;statusEl.textContent='스크래치! 흰 공이 돌아왔어요.'},550);show('SCRATCH');ping(110,.15,.08);return}score+=b.n*10;scoreEl.textContent=score;let n=balls.filter(z=>z.live&&!z.cue).length;leftEl.innerHTML=n+' <small>/ 8</small>';show(b.n===8?'BLACK 8!':'+'+(b.n*10));ping(b.n===8?270:620,.12,.07);if(!n){best=Math.max(best,score);localStorage.midnightPocketBest=best;bestEl.textContent=best;statusEl.textContent='클리어! 8번 검은 공까지 완벽합니다.';setTimeout(()=>show('TABLE CLEAR!'),150)}}
  function physics(){for(const b of balls){if(!b.live)continue;b.x+=b.vx;b.y+=b.vy;b.vx*=.987;b.vy*=.987;if(Math.abs(b.vx)<.03)b.vx=0;if(Math.abs(b.vy)<.03)b.vy=0;for(const z of pockets)if(Math.hypot(b.x-z[0],b.y-z[1])<27){pocket(b);break}if(!b.live)continue;if(b.x-R<felt.l){b.x=felt.l+R;b.vx=Math.abs(b.vx)*.82}if(b.x+R>felt.r){b.x=felt.r-R;b.vx=-Math.abs(b.vx)*.82}if(b.y-R<felt.t){b.y=felt.t+R;b.vy=Math.abs(b.vy)*.82}if(b.y+R>felt.b){b.y=felt.b-R;b.vy=-Math.abs(b.vy)*.82}}
    for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(!a.live||!b.live)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;if(d<R*2){let nx=dx/d,ny=dy/d,over=R*2-d;a.x-=nx*over/2;a.y-=ny*over/2; b.x+=nx*over/2;b.y+=ny*over/2;let rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx*.93;a.vy-=rel*ny*.93;b.vx+=rel*nx*.93;b.vy+=rel*ny*.93;if(rel>2)ping(130+rel*20,.025,.025)}}}for(const b of balls){if(!b.live)continue;for(const z of pockets)if(Math.hypot(b.x-z[0],b.y-z[1])<27){pocket(b);break}if(!b.live)continue;if(b.x-R<felt.l){b.x=felt.l+R;b.vx=Math.abs(b.vx)*.82}if(b.x+R>felt.r){b.x=felt.r-R;b.vx=-Math.abs(b.vx)*.82}if(b.y-R<felt.t){b.y=felt.t+R;b.vy=Math.abs(b.vy)*.82}if(b.y+R>felt.b){b.y=felt.b-R;b.vy=-Math.abs(b.vy)*.82}}if(shot&&!moving()){shot=false;if(balls.filter(b=>b.live&&!b.cue).length)statusEl.textContent='다음 샷을 준비하세요.'}}
  const ball=(b)=>{x.save();x.translate(b.x,b.y);let g=x.createRadialGradient(-6,-7,2,0,0,R);g.addColorStop(0,'#fff9');g.addColorStop(.2,b.color);g.addColorStop(1,'#0009');x.fillStyle=g;x.beginPath();x.arc(0,0,R,0,7);x.fill();if(!b.cue){x.fillStyle='#f7edd5';x.beginPath();x.arc(0,0,8,0,7);x.fill();x.fillStyle='#1a2425';x.font='600 11px DM Mono';x.textAlign='center';x.textBaseline='middle';x.fillText(b.n,0,1)}x.restore()};
  const bg=new Image();bg.src='table.png';bg.onload=draw;function draw(){x.clearRect(0,0,W,H);if(bg.complete&&bg.naturalWidth)x.drawImage(bg,0,0,W,H);else{x.fillStyle='#0a624b';x.fillRect(0,0,W,H)}if(aim){let b=cue();x.save();x.strokeStyle='#fff8';x.setLineDash([9,8]);x.lineWidth=2;x.beginPath();x.moveTo(b.x,b.y);x.lineTo(b.x+(b.x-aim.x)*3,b.y+(b.y-aim.y)*3);x.stroke();x.restore()}for(const b of balls)if(b.live)ball(b)}
  function frame(){physics();draw();requestAnimationFrame(frame)}rack();frame();
  </script>

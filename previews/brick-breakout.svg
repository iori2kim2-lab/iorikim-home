<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280">
  <defs>
    <linearGradient id="bbbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e2ff"/>
      <stop offset="1" stop-color="#e6d6ff"/>
    </linearGradient>
    <linearGradient id="bb1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2d6"/><stop offset="1" stop-color="#ff9dbd"/></linearGradient>
    <linearGradient id="bb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bdf0d8"/><stop offset="1" stop-color="#8fe0bd"/></linearGradient>
    <linearGradient id="bb3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3e4ff"/><stop offset="1" stop-color="#95cdff"/></linearGradient>
    <linearGradient id="bb4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0cdff"/><stop offset="1" stop-color="#c3a8f5"/></linearGradient>
    <linearGradient id="bb5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#ffd070"/></linearGradient>
    <linearGradient id="bbball" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ee"/><stop offset="0.5" stop-color="#ff9ec4"/><stop offset="1" stop-color="#f0679c"/></linearGradient>
    <linearGradient id="bbpaddle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a3"/><stop offset="0.55" stop-color="#ffd45e"/><stop offset="1" stop-color="#f7b93a"/></linearGradient>
  </defs>
  <rect width="480" height="280" fill="url(#bbbg)"/>

  <!-- brick rows -->
  <g stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
    <rect x="34"  y="34" width="46" height="24" rx="7" fill="url(#bb1)"/>
    <rect x="86"  y="34" width="46" height="24" rx="7" fill="url(#bb2)"/>
    <rect x="138" y="34" width="46" height="24" rx="7" fill="url(#bb3)"/>
    <rect x="190" y="34" width="46" height="24" rx="7" fill="url(#bb4)"/>
    <rect x="242" y="34" width="46" height="24" rx="7" fill="url(#bb5)"/>
    <rect x="294" y="34" width="46" height="24" rx="7" fill="url(#bb1)"/>
    <rect x="346" y="34" width="46" height="24" rx="7" fill="url(#bb2)"/>
    <rect x="398" y="34" width="46" height="24" rx="7" fill="url(#bb3)"/>

    <rect x="60"  y="64" width="46" height="24" rx="7" fill="url(#bb3)"/>
    <rect x="112" y="64" width="46" height="24" rx="7" fill="url(#bb4)"/>
    <rect x="164" y="64" width="46" height="24" rx="7" fill="url(#bb5)"/>
    <rect x="216" y="64" width="46" height="24" rx="7" fill="url(#bb1)"/>
    <rect x="268" y="64" width="46" height="24" rx="7" fill="url(#bb2)"/>
    <rect x="320" y="64" width="46" height="24" rx="7" fill="url(#bb3)"/>
    <rect x="372" y="64" width="46" height="24" rx="7" fill="url(#bb4)"/>

    <rect x="34"  y="94" width="46" height="24" rx="7" fill="url(#bb5)"/>
    <rect x="86"  y="94" width="46" height="24" rx="7" fill="url(#bb1)"/>
    <rect x="138" y="94" width="46" height="24" rx="7" fill="url(#bb2)"/>
    <rect x="242" y="94" width="46" height="24" rx="7" fill="url(#bb4)"/>
    <rect x="294" y="94" width="46" height="24" rx="7" fill="url(#bb5)"/>
    <rect x="346" y="94" width="46" height="24" rx="7" fill="url(#bb1)"/>
    <rect x="398" y="94" width="46" height="24" rx="7" fill="url(#bb2)"/>
  </g>

  <!-- ball with trail -->
  <circle cx="205" cy="150" r="7" fill="#ff9ec4" opacity="0.28"/>
  <circle cx="218" cy="160" r="8" fill="#ff9ec4" opacity="0.45"/>
  <circle cx="233" cy="171" r="11" fill="url(#bbball)"/>
  <ellipse cx="229" cy="167" rx="3" ry="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="230" cy="172" r="1.5" fill="#8a4763"/>
  <circle cx="236" cy="172" r="1.5" fill="#8a4763"/>

  <!-- paddle (duck jelly) -->
  <rect x="180" y="225" width="120" height="24" rx="12" fill="url(#bbpaddle)" stroke="#e39f22" stroke-width="2.5"/>
  <rect x="196" y="229" width="88" height="6" rx="3" fill="#ffffff" opacity="0.75"/>
  <rect x="233" y="234" width="14" height="7" rx="3" fill="#ffa53d"/>
  <circle cx="226" cy="233" r="2.4" fill="#5a4630"/>
  <circle cx="254" cy="233" r="2.4" fill="#5a4630"/>
  <ellipse cx="215" cy="238" rx="4.5" ry="3" fill="#ff96b5" opacity="0.55"/>
  <ellipse cx="265" cy="238" rx="4.5" ry="3" fill="#ff96b5" opacity="0.55"/>
</svg>

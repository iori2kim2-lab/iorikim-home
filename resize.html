<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이미지 리사이즈 — iorikim</title>
<meta name="description" content="이미지 크기와 용량을 브라우저에서 바로 줄여보세요. 업로드 없이 안전하게." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%236d5bff%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22800%22>io</text></svg>" />
</head>
<body>

<header class="site">
  <div class="wrap site-nav">
    <a href="index.html" class="brand">
      <span class="brand-badge">io</span>
      iorikim
    </a>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="light">☀️ 일반</button>
      <button data-theme="dark">🌙 다크</button>
    </div>
  </div>
</header>

<section class="wrap tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="back-link">← 홈으로</a>
    <h1>🖼️ 이미지 리사이즈</h1>
    <p>사진 크기와 용량을 원하는 만큼 줄여드려요. 이미지는 업로드되지 않고 브라우저 안에서만 처리됩니다.</p>
  </div>

  <div class="panel">
    <div class="dropzone" id="dropzone">
      <p><strong>클릭하거나 이미지를 끌어다 놓으세요</strong></p>
      <p>JPG, PNG, WebP 지원</p>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>

    <div class="controls" id="controls" style="display:none;">

      <div class="field">
        <label>크기 조절 방식</label>
        <div class="mode-tabs" id="modeTabs">
          <button data-mode="percent" class="active">배율(%)</button>
          <button data-mode="exact">가로 × 세로</button>
          <button data-mode="longedge">긴 변 기준</button>
        </div>
      </div>

      <div class="field" id="percentField">
        <label>배율: <span id="percentValue">100</span>%</label>
        <input type="range" id="percentRange" min="1" max="100" value="100" />
      </div>

      <div class="field" id="exactField" style="display:none;">
        <label>가로 × 세로 (px)</label>
        <div class="field-row">
          <input type="number" id="widthInput" min="1" />
          <span>×</span>
          <input type="number" id="heightInput" min="1" />
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="lockAspect" checked />
          <label for="lockAspect">비율 유지</label>
        </div>
      </div>

      <div class="field" id="longedgeField" style="display:none;">
        <label>긴 변 최대 길이 (px)</label>
        <input type="number" id="longEdgeInput" min="1" value="1920" />
      </div>

      <div class="field">
        <label>출력 형식</label>
        <select id="formatSelect">
          <option value="auto">원본 형식 유지</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </div>

      <div class="field" id="qualityField">
        <label>품질: <span id="qualityValue">85</span>%</label>
        <input type="range" id="qualityRange" min="10" max="100" value="85" />
      </div>

      <button class="primary-btn" id="convertBtn">변환하기</button>
    </div>

    <div class="result" id="result">
      <div class="compare">
        <figure>
          <img id="beforeImg" alt="원본 이미지" />
          <figcaption>원본 · <b id="beforeSize"></b> · <span id="beforeDims"></span></figcaption>
        </figure>
        <figure>
          <img id="afterImg" alt="변환된 이미지" />
          <figcaption>변환 후 · <b id="afterSize"></b> · <span id="afterDims"></span></figcaption>
        </figure>
      </div>
      <div class="stats-row">
        <span class="save" id="saveStat"></span>
      </div>
      <a class="primary-btn download-btn" id="downloadBtn" download>다운로드</a>
      <p class="hint">이미지는 서버로 전송되지 않습니다. 모든 처리는 이 브라우저 안에서 끝나요.</p>
    </div>
  </div>
</section>

<footer class="site">
  <div class="wrap">© 2026 iorikim. 모든 도구는 브라우저에서 무료로 이용할 수 있어요.</div>
</footer>

<script src="theme.js"></script>
<script src="resize.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이미지를 PDF로 — iorikim</title>
<meta name="description" content="여러 장의 사진을 골라서 PDF 한 파일로 합쳐보세요. 브라우저 안에서 바로 처리됩니다." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%236d5bff%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22800%22>io</text></svg>" />
</head>
<body>

<header class="site">
  <div class="wrap site-nav">
    <a href="index.html" class="brand">
      <span class="brand-badge">io</span>
      iorikim
    </a>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="light">☀️ 일반</button>
      <button data-theme="dark">🌙 다크</button>
    </div>
  </div>
</header>

<section class="wrap tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="back-link">← 홈으로</a>
    <h1>📄 이미지를 PDF로</h1>
    <p>여러 장의 사진(HEIC 포함)을 골라서 PDF 한 파일로 합쳐드려요. 이미지는 업로드되지 않고 브라우저 안에서만 처리됩니다.</p>
  </div>

  <div class="panel">
    <div class="dropzone" id="dropzone">
      <p><strong>클릭하거나 이미지를 끌어다 놓으세요</strong></p>
      <p>여러 장 한 번에 선택 가능 · JPG, PNG, WebP, HEIC 지원</p>
      <input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple hidden />
    </div>

    <div class="controls" id="controls" style="display:none;">
      <div class="field">
        <label>담은 이미지 (<span id="fileCount">0</span>장) · 순서대로 페이지가 됩니다</label>
        <div class="file-list" id="fileList"></div>
      </div>

      <div class="field">
        <label>페이지 크기</label>
        <select id="pageSizeSelect">
          <option value="a4">A4</option>
          <option value="letter">Letter</option>
          <option value="fit">이미지 크기 그대로</option>
        </select>
      </div>

      <button class="primary-btn" id="makePdfBtn">PDF로 합치기</button>
    </div>

    <div class="result" id="result">
      <p class="hint" id="pdfSummary" style="text-align:left;margin:0;"></p>
      <a class="primary-btn download-btn" id="downloadBtn" download>PDF 다운로드</a>
      <p class="hint">이미지는 서버로 전송되지 않습니다. 모든 처리는 이 브라우저 안에서 끝나요.</p>
    </div>
  </div>
</section>

<footer class="site">
  <div class="wrap">© 2026 iorikim. 모든 도구는 브라우저에서 무료로 이용할 수 있어요.</div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script src="theme.js"></script>
<script src="pdf.js"></script>
</body>
</html>

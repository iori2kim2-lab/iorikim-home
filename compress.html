<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이미지 압축기 — J - LAB</title>
<meta name="description" content="사진 크기는 그대로 두고 용량만 줄여보세요. 브라우저 안에서 바로 처리됩니다." />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%236d5bff%22/><text x=%2250%22 y=%2266%22 font-size=%2250%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22800%22>J</text></svg>" />
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "3cc28db5dffd4206983e938497275c25"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<header class="site">
  <div class="wrap site-nav">
    <a href="index.html" class="brand">
      <span class="brand-badge">J</span>
      - LAB
    </a>
    <div class="theme-toggle" id="themeToggle">
      <button data-theme="light" data-i18n="common.themeLight">☀️ 일반</button>
      <button data-theme="dark" data-i18n="common.themeDark">🌙 다크</button>
    </div>
  </div>
</header>

<section class="wrap tool-page">
  <div class="tool-page-header">
    <a href="index.html" class="back-link" data-i18n="common.backHome">← 홈으로</a>
    <h1><span class="tool-emoji">🗜️</span> <span data-i18n="compress.title">이미지 압축기</span></h1>
    <p data-i18n="compress.pageDesc">사진 크기는 그대로 두고 용량만 줄여드려요. 이미지는 업로드되지 않고 브라우저 안에서만 처리됩니다.</p>
  </div>

  <div class="panel">
    <div class="dropzone" id="dropzone">
      <p><strong data-i18n="common.dropzoneDefault">클릭하거나 이미지를 끌어다 놓으세요</strong></p>
      <p data-i18n="compress.dropzoneHint">JPG, PNG, WebP 지원</p>
      <input type="file" id="fileInput" accept="image/*" hidden />
    </div>

    <div class="controls" id="controls" style="display:none;">

      <div class="field">
        <div class="mode-tabs" id="modeTabs">
          <button data-mode="quality" class="active" data-i18n="compress.modeQuality">품질로 조절</button>
          <button data-mode="target" data-i18n="compress.modeTarget">목표 용량으로</button>
        </div>
      </div>

      <div class="field" id="qualityField">
        <label><span data-i18n="compress.qualityLabelPrefix">품질: </span><span id="qualityValue">80</span>%</label>
        <input type="range" id="qualityRange" min="10" max="100" value="80" />
        <p class="hint" data-i18n="compress.qualityHint">낮출수록 용량은 줄지만 화질이 거칠어져요. 슬라이더를 움직이면 바로 미리 보여드려요.</p>
      </div>

      <div class="field" id="targetField" style="display:none;">
        <label data-i18n="compress.targetLabel">목표 용량 (KB)</label>
        <input type="number" id="targetInput" min="1" value="200" />
        <p class="hint" data-i18n="compress.targetHint">가장 가까운 용량으로 자동으로 맞춰드려요.</p>
      </div>

      <div class="field" id="formatField">
        <label data-i18n="compress.formatLabel">출력 형식</label>
        <select id="formatSelect">
          <option value="auto" data-i18n="compress.formatAuto">자동 (추천 형식)</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/webp">WebP</option>
          <option value="image/png" data-i18n="compress.formatPng">PNG (무손실 · 용량 차이가 적어요)</option>
        </select>
      </div>

      <button class="primary-btn" id="compressBtn" style="display:none;" data-i18n="compress.compressBtn">압축하기</button>
    </div>

    <div class="result" id="result">
      <div class="compare">
        <figure>
          <img id="beforeImg" alt="원본 이미지" />
          <figcaption><span data-i18n="common.original">원본</span> · <b id="beforeSize"></b></figcaption>
        </figure>
        <figure>
          <img id="afterImg" alt="압축된 이미지" />
          <figcaption><span data-i18n="compress.resultCompressed">압축 후</span> · <b id="afterSize"></b></figcaption>
        </figure>
      </div>
      <div class="stats-row">
        <span class="save" id="saveStat"></span>
      </div>
      <a class="primary-btn download-btn" id="downloadBtn" download data-i18n="common.downloadBtn">다운로드</a>
      <p class="hint" data-i18n="common.privacyHint">이미지는 서버로 전송되지 않습니다. 모든 처리는 이 브라우저 안에서 끝나요.</p>
    </div>
  </div>
</section>

<footer class="site">
  <div class="wrap" data-i18n="common.footer">© 2026 J - LAB. 모든 도구는 브라우저에서 무료로 이용할 수 있어요.</div>
</footer>

<script src="i18n-data.js"></script>
<script src="i18n.js"></script>
<script src="theme.js"></script>
<script src="compress.js"></script>
</body>
</html>
